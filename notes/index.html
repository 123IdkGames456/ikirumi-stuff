<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07080b;color:#f5f6f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;min-height:64px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(9,10,13,.82);backdrop-filter:blur(24px)}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#fff,#aeb4bf);color:#08090c;display:grid;place-items:center;font-weight:950}.actions{display:flex;gap:8px}.btn{height:36px;padding:0 13px;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(255,255,255,.05);color:#d8dbe0}.btn:hover{background:rgba(255,255,255,.1);color:#fff}.primary{background:#fff;color:#08090b;border-color:#fff;font-weight:750}.primary:hover{background:#e7e9ed;color:#08090b}.main{flex:1;min-height:0;display:grid;grid-template-columns:280px 1fr}.sidebar{border-right:1px solid rgba(255,255,255,.07);padding:16px;display:flex;flex-direction:column;min-width:0}.new{width:100%;padding:12px;border:0;border-radius:11px;background:#fff;color:#08090b;font-weight:800;margin-bottom:14px}.new:hover{background:#e7e9ed}.list{overflow:auto;display:flex;flex-direction:column;gap:5px}.note-item{border:1px solid transparent;background:transparent;color:#c5c9d0;border-radius:10px;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:10px}.note-item:hover{background:rgba(255,255,255,.05)}.note-item.active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.09);color:#fff}.note-icon{opacity:.65}.note-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.empty-list{color:#656d79;font-size:12px;text-align:center;padding:25px 8px}.editor{min-width:0;display:flex;flex-direction:column}.editorbar{height:60px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;padding:0 18px}.title{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:18px;font-weight:800}.title::placeholder{color:#555d68}.editor-actions{display:flex;gap:7px}.danger{color:#ff9b9b}.danger:hover{background:rgba(255,70,70,.1);color:#ffb4b4}.area{flex:1;resize:none;border:0;outline:0;background:transparent;color:#dfe2e7;padding:28px 32px;font-size:16px;line-height:1.7}.area::placeholder{color:#505865}.status{height:30px;display:flex;align-items:center;padding:0 18px;color:#59616e;font-size:11px;border-top:1px solid rgba(255,255,255,.05)}.welcome{height:100%;display:grid;place-items:center;text-align:center;color:#69717e;padding:30px}.welcome-box{max-width:430px}.welcome-icon{font-size:42px;margin-bottom:15px}.welcome h2{color:#dfe2e7;margin:0 0 8px}.welcome p{font-size:13px;line-height:1.6;margin:0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.box{width:min(390px,100%);background:#121419;border:1px solid rgba(255,255,255,.1);border-radius:17px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.5)}.box h3{margin:0 0 7px}.box p{margin:0 0 18px;color:#7d8591;font-size:12px}.box input{width:100%;height:43px;background:#08090c;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;padding:0 12px;outline:0}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:#20242b;color:#fff}.modal-actions .primary{background:#fff;color:#08090b}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f5f6f8;color:#08090b;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:750;transition:.22s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.main{grid-template-columns:1fr}.sidebar{height:190px;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.editorbar{padding:0 12px}.area{padding:20px 16px}.top{padding:0 12px}.actions .btn span{display:none}.btn{padding:0 10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">N</div><span>Notes</span></div><div class="actions"><button class="btn" id="cloudLoad">☁ <span>Cloud Load</span></button><button class="btn" id="cloudSave">☁ <span>Sync</span></button><button class="btn" id="loadBtn">↑ <span>Load</span></button><button class="btn" id="downloadAll">↓ <span>Download All</span></button><button class="btn primary" id="newTop">＋ <span>New Note</span></button></div></header>
<main class="main">
<aside class="sidebar"><button class="new" id="newBtn">＋ New Note</button><div class="list" id="list"></div></aside>
<section class="editor" id="editor">
<div class="welcome"><div class="welcome-box"><div class="welcome-icon">📝</div><h2>Your notes, saved on this device</h2><p>Create notes and they are automatically stored in this browser. You can also download your notes as files and load them back later.</p></div></div>
</section>
</main>
</div>
<input type="file" id="fileInput" accept=".json,.note,.txt" hidden>
<div class="modal" id="renameModal"><div class="box"><h3>Rename note</h3><p>Choose a new name for this note.</p><input id="renameInput" maxlength="100"><div class="modal-actions"><button id="cancelRename">Cancel</button><button class="primary" id="saveRename">Rename</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY="ikirumi_notes_v1";
const GOOGLE_SCRIPT_URL="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
let notes=[],activeId=null,renameId=null,saveTimer=null;
const list=document.getElementById("list"),editor=document.getElementById("editor"),fileInput=document.getElementById("fileInput"),toast=document.getElementById("toast"),renameModal=document.getElementById("renameModal"),renameInput=document.getElementById("renameInput");
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function loadLocal(){try{const data=JSON.parse(localStorage.getItem(KEY)||"[]");notes=Array.isArray(data)?data.filter(n=>n&&n.id):[]}catch{notes=[]}}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(notes))}
function cloudEnabled(){return GOOGLE_SCRIPT_URL&&GOOGLE_SCRIPT_URL.indexOf("PASTE_YOUR_")!==0}
function cloudLoad(){if(!cloudEnabled()){showToast("Add your Apps Script URL first");return}showToast("Loading from Google Sheets...");const callback="notesCloudLoad_"+Date.now();window[callback]=data=>{try{delete window[callback];const incoming=Array.isArray(data)?data:[];notes=incoming.map(n=>({id:String(n.id||uid()),title:String(n.title||"Untitled Note"),content:String(n.content||""),created:Number(n.created)||Date.now(),updated:Number(n.updated)||Date.now()}));saveLocal();activeId=notes[0]?.id||null;renderList();if(activeId)openNote(activeId);else editor.innerHTML='<div class="welcome"><div class="welcome-box"><div class="welcome-icon">☁</div><h2>No cloud notes</h2><p>Create a note and sync it to Google Sheets.</p></div></div>';showToast(notes.length+" note"+(notes.length===1?"":"s")+" loaded from Google Sheets")}catch(e){showToast("Cloud load failed")}};const s=document.createElement("script");s.src=GOOGLE_SCRIPT_URL+"?action=load&callback="+encodeURIComponent(callback)+"&_="+Date.now();s.onerror=()=>{delete window[callback];showToast("Cloud load failed")};document.body.appendChild(s)}
function cloudSave(){if(!cloudEnabled()){showToast("Add your Apps Script URL first");return}const frame=document.createElement("iframe");frame.name="notesCloudFrame_"+Date.now();frame.style.display="none";document.body.appendChild(frame);const form=document.createElement("form");form.method="POST";form.action=GOOGLE_SCRIPT_URL;form.target=frame.name;const action=document.createElement("input");action.name="action";action.value="save";const data=document.createElement("input");data.name="data";data.value=JSON.stringify(notes);form.appendChild(action);form.appendChild(data);document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();frame.remove()},2500);showToast("Saved to Google Sheets")}
function queueCloudSave(){clearTimeout(window.cloudTimer);window.cloudTimer=setTimeout(cloudSave,900)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function renderList(){list.innerHTML="";if(!notes.length){list.innerHTML='<div class="empty-list">No notes yet</div>';return}notes.forEach(n=>{const b=document.createElement("button");b.className="note-item"+(n.id===activeId?" active":"");b.innerHTML='<span class="note-icon">▤</span><span class="note-title"></span>';b.querySelector(".note-title").textContent=n.title||"Untitled";b.onclick=()=>openNote(n.id);list.appendChild(b)})}
function openNote(id){activeId=id;const n=notes.find(x=>x.id===id);if(!n)return;editor.innerHTML='<div class="editorbar"><input class="title" id="title" value=""><div class="editor-actions"><button class="btn" id="rename">Rename</button><button class="btn" id="downloadNote">↓ Save</button><button class="btn danger" id="delete">Delete</button></div></div><textarea class="area" id="area" placeholder="Start writing..."></textarea><div class="status" id="status">Saved on this device</div>';const title=document.getElementById("title"),area=document.getElementById("area");title.value=n.title;area.value=n.content;title.oninput=()=>queueSave();area.oninput=()=>queueSave();document.getElementById("rename").onclick=()=>showRename(n.id);document.getElementById("downloadNote").onclick=downloadNote;document.getElementById("delete").onclick=()=>deleteNote(n.id);renderList();area.focus()}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const n=notes.find(x=>x.id===activeId);if(!n)return;n.title=document.getElementById("title").value.trim()||"Untitled";n.content=document.getElementById("area").value; n.updated=Date.now();saveLocal();renderList();document.getElementById("status").textContent=cloudEnabled()?"Saved locally • syncing...":"Saved on this device";queueCloudSave()},150)}
function newNote(){const n={id:uid(),title:"Untitled Note",content:"",created:Date.now(),updated:Date.now()};notes.unshift(n);saveLocal();cloudSave();openNote(n.id)}
function deleteNote(id){const n=notes.find(x=>x.id===id);if(!n)return;if(!confirm("Delete \""+(n.title||"Untitled")+"?\""))return;notes=notes.filter(x=>x.id!==id);saveLocal();cloudSave();activeId=null;if(notes.length)openNote(notes[0].id);else{editor.innerHTML='<div class="welcome"><div class="welcome-box"><div class="welcome-icon">📝</div><h2>No notes yet</h2><p>Create a new note to get started.</p></div></div>';renderList()};showToast("Note deleted")}\nfunction showRename(id){renameId=id;const n=notes.find(x=>x.id===id);renameInput.value=n?n.title:"";renameModal.style.display="flex";setTimeout(()=>{renameInput.focus();renameInput.select()},20)}
function hideRename(){renameModal.style.display="none";renameId=null}
function rename(){const n=notes.find(x=>x.id===renameId);if(!n)return;n.title=renameInput.value.trim()||"Untitled Note";n.updated=Date.now();saveLocal();cloudSave();openNote(n.id);hideRename();showToast("Note renamed")}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadNote(){const n=notes.find(x=>x.id===activeId);if(!n)return;const data=JSON.stringify({format:"ikirumi-note",version:1,title:n.title,content:n.content,created:n.created,updated:n.updated},null,2);downloadBlob(new Blob([data],{type:"application/json"}),(n.title||"note").replace(/[\\/:*?"<>|]/g,"_")+".json");showToast("Note downloaded")}
function downloadAll(){if(!notes.length){showToast("No notes to download");return}const data=JSON.stringify({format:"ikirumi-notes",version:1,notes},null,2);downloadBlob(new Blob([data],{type:"application/json"}),"notes.json");showToast("All notes downloaded")}
function loadFile(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);let incoming=[];if(data&&data.format==="ikirumi-note"){incoming=[{id:uid(),title:data.title||"Untitled Note",content:data.content||"",created:data.created||Date.now(),updated:Date.now()}]}else if(data&&data.format==="ikirumi-notes"&&Array.isArray(data.notes)){incoming=data.notes.map(n=>({id:uid(),title:String(n.title||"Untitled Note"),content:String(n.content||""),created:n.created||Date.now(),updated:Date.now()}))}else throw new Error("Invalid note file");notes=[...incoming,...notes];saveLocal();renderList();if(incoming[0])openNote(incoming[0].id);showToast(incoming.length+" note"+(incoming.length===1?"":"s")+" loaded")}catch(e){showToast("Could not load that file")}};reader.readAsText(file)}
function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove("show"),1800)}
document.getElementById("cloudLoad").onclick=cloudLoad;document.getElementById("cloudSave").onclick=cloudSave;document.getElementById("newBtn").onclick=newNote;document.getElementById("newTop").onclick=newNote;document.getElementById("downloadAll").onclick=downloadAll;document.getElementById("loadBtn").onclick=()=>fileInput.click();fileInput.onchange=()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);fileInput.value=""};document.getElementById("cancelRename").onclick=hideRename;document.getElementById("saveRename").onclick=rename;renameInput.onkeydown=e=>{if(e.key==="Enter")rename();if(e.key==="Escape")hideRename()};renameModal.onclick=e=>{if(e.target===renameModal)hideRename()};
loadLocal();renderList();if(notes.length)openNote(notes[0].id);
</script>
</body>
</html>
