<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ikirumi</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}#app{width:100%;height:100%;display:flex;flex-direction:column}.topbar{height:64px;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,8,11,.8);backdrop-filter:blur(25px);position:relative;z-index:100}.logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:850}.logo-mark{width:31px;height:31px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(145deg,#fff,#b9bec8);color:#08090c;font-weight:950}.refresh-button,.back-button{height:36px;padding:0 13px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#929aa7;border-radius:10px;cursor:pointer;transition:.2s}.refresh-button:hover,.back-button:hover{color:#fff;background:#24262a}.back-button{display:none}.page{position:absolute;left:0;top:64px;width:100%;height:calc(100% - 64px);overflow:auto}.home-content{width:100%;max-width:1500px;min-height:100%;margin:auto;padding:42px 28px 70px}.hero{margin-bottom:28px}.hero-title{font-size:clamp(32px,5vw,48px);font-weight:900;letter-spacing:-2.5px}.hero-title span{background:linear-gradient(120deg,#fff,#777f8c);-webkit-background-clip:text;background-clip:text;color:transparent}.hero-subtitle{margin-top:9px;color:#737b88;font-size:13px}.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.site-card{position:relative;min-height:160px;padding:20px;border:1px solid rgba(255,255,255,.07);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));overflow:hidden;cursor:pointer;opacity:0;animation:cardIn .4s ease forwards;transition:.23s}.site-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 18px 45px rgba(0,0,0,.23)}.site-card-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.06);font-size:18px;margin-bottom:30px;transition:.25s}.site-card:hover .site-card-icon{transform:scale(1.06);background:rgba(255,255,255,.09)}.site-card-name{font-size:16px;font-weight:760;word-break:break-word}.site-card-path{margin-top:6px;font-size:11px;color:#666e7b}.site-card-arrow{position:absolute;right:18px;bottom:18px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.045);color:#68707c;font-size:16px;transition:.25s}.site-card:hover .site-card-arrow{color:#fff;background:rgba(255,255,255,.1);transform:translateX(4px)}.empty{padding:70px 20px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:17px;color:#6f7784}.empty-icon{font-size:28px;margin-bottom:10px}#siteFrame{position:absolute;left:0;top:64px;width:100%;height:calc(100% - 64px);border:0;background:#050608;display:none;opacity:0;transition:opacity .25s}#siteFrame.ready{opacity:1}#loading,#error{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(5,6,8,.88);backdrop-filter:blur(25px);padding:30px}.loader-wrap{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.loader{width:27px;height:27px;border:2px solid rgba(255,255,255,.12);border-top-color:#fff;border-right-color:#fff;border-radius:50%;animation:spin .65s linear infinite}.loading-title{margin-top:18px;font-size:14px;font-weight:750}.loading-info{margin-top:7px;font-size:11px;color:#68707d;max-width:500px;word-break:break-word}.error-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:23px;margin-bottom:18px}#error h2{margin:0;font-size:25px}#error p{max-width:600px;margin:12px 0 0;color:#858c98;line-height:1.5;font-size:13px}#error button{margin-top:22px;border:0;background:#fff;color:#07080b;padding:11px 19px;border-radius:10px;font-weight:750;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cardIn{from{opacity:0;transform:translateY(13px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:650px){.topbar{padding:0 12px}.logo{font-size:16px}.logo-mark{width:29px;height:29px}.home-content{padding:30px 14px 50px}.site-grid{grid-template-columns:1fr}.hero-title{font-size:34px}}.download-modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(18px);padding:20px}.download-box{width:min(380px,100%);padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#111318;box-shadow:0 25px 70px rgba(0,0,0,.5)}.download-box h2{margin:0;font-size:20px}.download-box p{margin:8px 0 18px;color:#7f8794;font-size:12px}.download-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.download-actions button{border:1px solid rgba(255,255,255,.09);background:#20242b;color:#fff;border-radius:10px;padding:12px;font-weight:750;cursor:pointer}.download-actions .play{background:#fff;color:#08090c}.download-close{margin-top:9px;width:100%;border:0;background:transparent;color:#737b88;padding:8px;cursor:pointer}</style>
</head>
<body>
<div id="app">
<header class="topbar">
<div class="logo"><div class="logo-mark">I</div><span>Ikirumi</span></div>
<div>
<button id="backButton" class="back-button" onclick="showHome()">← Back</button>
<button class="refresh-button" onclick="refreshRepository()" title="Refresh">↻</button>
</div>
</header>

<section id="home" class="page">
<div class="home-content">
<div class="hero">
<div class="hero-title">Welcome to <span>Ikirumi</span></div>
<div class="hero-subtitle">Choose a site to launch.</div>
</div>
<div id="siteGrid" class="site-grid"></div>
</div>
</section>

<iframe id="siteFrame"></iframe>

<div id="loading">
<div class="loader-wrap"><div class="loader"></div></div>
<div id="loadingTitle" class="loading-title">Starting Ikirumi</div>
<div id="loadingInfo" class="loading-info">Loading sites...</div>
</div>

<div id="downloadModal" class="download-modal"><div class="download-box"><h2 id="downloadTitle">Site</h2><p id="downloadInfo">Choose how you want the complete site packaged.</p><div class="download-actions"><button class="play" id="playSiteButton">▶ Play</button><button id="downloadSiteButton">↓ Download</button></div><div id="downloadChoices" style="display:none;margin-top:14px;gap:8px;flex-direction:column"><button id="downloadHtmlButton" style="width:100%;border:1px solid rgba(255,255,255,.09);background:#20242b;color:#fff;border-radius:10px;padding:12px;font-weight:750;cursor:pointer">HTML · All Files</button><button id="downloadExeButton" style="width:100%;border:1px solid rgba(255,255,255,.09);background:#20242b;color:#fff;border-radius:10px;padding:12px;font-weight:750;cursor:pointer">EXE · All Files</button><button id="downloadApkButton" style="width:100%;border:1px solid rgba(255,255,255,.09);background:#20242b;color:#fff;border-radius:10px;padding:12px;font-weight:750;cursor:pointer">APK · All Files</button></div><button class="download-close" onclick="closeDownloadModal()">Cancel</button></div></div><div id="error">
<div class="error-icon">!</div>
<h2>Something went wrong</h2>
<p id="errorText"></p>
<button onclick="initialize()">Try Again</button>
</div>
</div>

<script>
const OWNER="ikirumi11";
const REPO="ikirumi-stuff";
const BRANCH="main";
const TREE_URL="https://api.github.com/repos/"+OWNER+"/"+REPO+"/git/trees/"+BRANCH+"?recursive=1";
const RAW_BASE="https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/";

const home=document.getElementById("home");
const siteGrid=document.getElementById("siteGrid");
const siteFrame=document.getElementById("siteFrame");
const backButton=document.getElementById("backButton");
const loading=document.getElementById("loading");
const loadingTitle=document.getElementById("loadingTitle");
const loadingInfo=document.getElementById("loadingInfo");
const error=document.getElementById("error");
const errorText=document.getElementById("errorText");const downloadModal=document.getElementById("downloadModal");const downloadTitle=document.getElementById("downloadTitle");const downloadChoices=document.getElementById("downloadChoices");const downloadHtmlButton=document.getElementById("downloadHtmlButton");const downloadExeButton=document.getElementById("downloadExeButton");const downloadApkButton=document.getElementById("downloadApkButton");const downloadInfo=document.getElementById("downloadInfo");const playSiteButton=document.getElementById("playSiteButton");const downloadSiteButton=document.getElementById("downloadSiteButton");const filePicker=document.getElementById("filePicker");const downloadFileSelect=document.getElementById("downloadFileSelect");const downloadChosenButton=document.getElementById("downloadChosenButton");const downloadZipButton=document.getElementById("downloadZipButton");let selectedSite=null;

let repositoryFiles=[];
let sites=[];
let virtualFiles=new Map();
let virtualUrls=new Map();

function showHome(){
home.style.display="block";
siteFrame.classList.remove("ready");
siteFrame.style.display="none";
backButton.style.display="none";
error.style.display="none";
renderSites();
}

function getFolders(path){
const prefix=path?path+"/":"";
const result=new Set();
for(const file of repositoryFiles){
if(!file.path.startsWith(prefix)) continue;
const remaining=file.path.substring(prefix.length);
const slash=remaining.indexOf("/");
if(slash===-1) continue;
result.add(prefix+remaining.substring(0,slash));
}
return Array.from(result);
}

function getFiles(path){
const prefix=path?path+"/":"";
return repositoryFiles.filter(file=>{
if(!file.path.startsWith(prefix)) return false;
const remaining=file.path.substring(prefix.length);
return remaining.length>0&&!remaining.includes("/");
});
}

function hasIndex(path){
return getFiles(path).some(file=>file.path.split("/").pop().toLowerCase()==="index.html");
}

function getAllSites(){
const result=[];
function scan(path){
for(const folder of getFolders(path)){
if(hasIndex(folder)) result.push(folder);
scan(folder);
}
}
scan("");
return result.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})).filter((v,i,a)=>a.indexOf(v)===i);
}

function getSiteName(folder){
return folder.split("/").pop();
}

function renderSites(){
siteGrid.innerHTML="";
if(sites.length===0){
siteGrid.innerHTML='<div class="empty"><div class="empty-icon">⌕</div>No sites found.</div>';
return;
}
sites.forEach((folder,index)=>{
const card=document.createElement("div");
card.className="site-card";
card.style.animationDelay=Math.min(index*35,400)+"ms";
card.innerHTML='<div class="site-card-icon">▶</div><div class="site-card-name"></div><div class="site-card-path"></div><div class="site-card-arrow">›</div>';
card.querySelector(".site-card-name").textContent=getSiteName(folder);
card.querySelector(".site-card-path").textContent=folder;
card.onclick=()=>chooseSite(folder);
siteGrid.appendChild(card);
});
}

async function refreshRepository(){
repositoryFiles=[];
sites=[];
showHome();
await initialize();
}

async function loadRepository(){
loadingTitle.textContent="Loading Sites";
loadingInfo.textContent="Reading GitHub repository...";
const response=await fetch(TREE_URL+"&cache="+Date.now(),{cache:"no-store"});
if(!response.ok) throw new Error("GitHub returned HTTP "+response.status);
const data=await response.json();
if(!Array.isArray(data.tree)) throw new Error("GitHub did not return a valid file tree.");
if(data.truncated) throw new Error("This repository is too large to read in one request.");
repositoryFiles=data.tree.filter(file=>file.type==="blob");
sites=getAllSites();
renderSites();
}

function normalizePath(path){
const result=[];
for(const part of path.split("/")){
if(!part||part===".") continue;
if(part==="..") result.pop(); else result.push(part);
}
return result.join("/");
}

function directory(path){
const index=path.lastIndexOf("/");
return index===-1?"":path.substring(0,index+1);
}

function resolvePath(source,currentFile){
if(!source) return null;
source=source.trim();
if(source.startsWith("#")||source.startsWith("data:")||source.startsWith("blob:")||source.startsWith("javascript:")) return null;
if(source.startsWith("http://")||source.startsWith("https://")||source.startsWith("//")) return source;
const clean=source.split("?")[0].split("#")[0];
return clean.startsWith("/")?normalizePath(clean.substring(1)):normalizePath(directory(currentFile)+clean);
}

function virtualUrl(path){
return virtualUrls.get(normalizePath(path))||null;
}

async function prepareFiles(folder){
virtualFiles.clear();
for(const url of virtualUrls.values()){
try{URL.revokeObjectURL(url)}catch(e){}
}
virtualUrls.clear();

const filesToDownload=repositoryFiles.filter(file=>file.path===folder+"/index.html"||file.path.startsWith(folder+"/"));
if(filesToDownload.length===0) throw new Error("No files were found for this site.");

loading.style.display="flex";

for(let i=0;i<filesToDownload.length;i++){
const file=filesToDownload[i];
const relative=file.path.substring(folder.length+1);
loadingTitle.textContent="Opening Site";
loadingInfo.textContent=(i+1)+" / "+filesToDownload.length+" · "+relative;
const response=await fetch(RAW_BASE+file.path+"?cache="+Date.now(),{cache:"no-store"});
if(!response.ok) throw new Error("Failed to download "+relative);
const blob=await response.blob();
virtualFiles.set(relative,{blob:blob,type:blob.type});
}

for(const [path,file] of virtualFiles){
let blob=file.blob;
if(path.toLowerCase().endsWith(".css")){
let text=await blob.text();
text=rewriteCSS(text,path);
blob=new Blob([text],{type:"text/css"});
}
virtualUrls.set(path,URL.createObjectURL(blob));
}
return filesToDownload;
}

function rewriteCSS(text,file){
return text.replace(/url\s*\(\s*(['"]?)(.*?)\1\s*\)/gi,(full,quote,source)=>{
const path=resolvePath(source,file);
if(!path) return full;
const url=virtualUrl(path);
return url?'url("'+url+'")':full;
});
}

function replaceAttribute(element,attribute,currentFile){
const source=element.getAttribute(attribute);
if(!source) return;
const path=resolvePath(source,currentFile);
if(!path) return;
const url=virtualUrl(path);
if(url) element.setAttribute(attribute,url);
}

async function loadSite(folder){
const filesToDownload=await prepareFiles(folder);
const index=virtualFiles.get("index.html");
if(!index) throw new Error("index.html was not found.");

const parser=new DOMParser();
const doc=parser.parseFromString(await index.blob.text(),"text/html");

doc.querySelectorAll("base").forEach(element=>element.remove());
doc.querySelectorAll("link[href]").forEach(element=>replaceAttribute(element,"href","index.html"));
doc.querySelectorAll("script[src]").forEach(element=>replaceAttribute(element,"src","index.html"));
doc.querySelectorAll("img[src],video[src],audio[src],source[src],iframe[src]").forEach(element=>replaceAttribute(element,"src","index.html"));
doc.querySelectorAll("video[poster]").forEach(element=>replaceAttribute(element,"poster","index.html"));

loadingTitle.textContent="Launching "+getSiteName(folder);
loadingInfo.textContent=filesToDownload.length+" files ready";
siteFrame.srcdoc="<!DOCTYPE html>"+doc.documentElement.outerHTML;
siteFrame.style.display="block";
backButton.style.display="inline-block";
home.style.display="none";

siteFrame.onload=()=>{
requestAnimationFrame(()=>{
siteFrame.classList.add("ready");
loading.style.display="none";
});
};
}

function chooseSite(folder){selectedSite=folder;const name=getSiteName(folder);const folderFiles=repositoryFiles.filter(file=>file.path.startsWith(folder+"/"));downloadTitle.textContent=name;downloadInfo.textContent="Choose Play, or Download the complete "+folderFiles.length+"-file site as HTML, EXE, or APK.";downloadChoices.style.display="none";downloadModal.style.display="flex"}function closeDownloadModal(){downloadModal.style.display="none";selectedSite=null}playSiteButton.onclick=async()=>{const folder=selectedSite;closeDownloadModal();if(folder)openSite(folder)};downloadSiteButton.onclick=()=>{if(selectedSite)downloadChoices.style.display="flex"};downloadHtmlButton.onclick=async()=>{const folder=selectedSite;closeDownloadModal();if(folder)await downloadFolderZip(folder,"html")};downloadExeButton.onclick=async()=>{const folder=selectedSite;closeDownloadModal();if(folder)await generatePackage(folder,"exe")};downloadApkButton.onclick=async()=>{const folder=selectedSite;closeDownloadModal();if(folder)await generatePackage(folder,"apk")};function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function downloadFolderZip(folder,format){const files=repositoryFiles.filter(file=>file.path.startsWith(folder+"/"));loading.style.display="flex";loadingTitle.textContent="Preparing "+format.toUpperCase();loadingInfo.textContent="Packaging all "+files.length+" files...";try{const JSZip=await loadJSZip();const zip=new JSZip();for(let i=0;i<files.length;i++){const file=files[i];loadingInfo.textContent=(i+1)+" / "+files.length+" · "+file.path.substring(folder.length+1);const r=await fetch(RAW_BASE+file.path+"?cache="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Failed to download "+file.path);zip.file(file.path.substring(folder.length+1),await r.blob())}const blob=await zip.generateAsync({type:"blob"});downloadBlob(blob,getSiteName(folder)+"."+format+".zip")}catch(e){errorText.textContent="Could not package "+getSiteName(folder)+": "+e.message;error.style.display="flex"}finally{loading.style.display="none"}}async function generatePackage(folder,format){if(format==="exe"||format==="apk"){errorText.textContent=format.toUpperCase()+" generation needs a native build environment. The complete site files are kept in GitHub, but this browser launcher cannot create a valid installable "+format.toUpperCase()+" by itself.";error.style.display="flex"}}function loadJSZip(){return new Promise((resolve,reject)=>{if(window.JSZip){resolve(window.JSZip);return}const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";s.onload=()=>resolve(window.JSZip);s.onerror=()=>reject(new Error("Could not load ZIP support."));document.head.appendChild(s)})}
async function openSite(folder){
siteFrame.classList.remove("ready");
try{
await loadSite(folder);
}catch(e){
loading.style.display="none";
errorText.textContent="Could not open "+getSiteName(folder)+": "+e.message;
error.style.display="flex";
}
}

async function initialize(){
error.style.display="none";
loading.style.display="flex";
loadingTitle.textContent="Starting Ikirumi";
loadingInfo.textContent="Loading sites...";
try{
await loadRepository();
showHome();
loading.style.display="none";
}catch(e){
loading.style.display="none";
errorText.textContent="Could not initialize Ikirumi: "+e.message;
error.style.display="flex";
}
}

initialize();
</script>
</body>
</html>
