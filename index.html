<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ikirumi</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}#app{width:100%;height:100%;display:flex;flex-direction:column}.topbar{height:64px;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,8,11,.8);backdrop-filter:blur(25px);position:relative;z-index:100}.logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:850}.logo-mark{width:31px;height:31px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(145deg,#fff,#b9bec8);color:#08090c;font-weight:950}.refresh-button,.back-button{height:36px;padding:0 13px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#929aa7;border-radius:10px;cursor:pointer;transition:.2s}.refresh-button:hover,.back-button:hover{color:#fff;background:#24262a}.back-button{display:none}.page{position:absolute;left:0;top:64px;width:100%;height:calc(100% - 64px);overflow:auto}.home-content{width:100%;max-width:1500px;min-height:100%;margin:auto;padding:42px 28px 70px}.hero{margin-bottom:28px}.hero-title{font-size:clamp(32px,5vw,48px);font-weight:900;letter-spacing:-2.5px}.hero-title span{background:linear-gradient(120deg,#fff,#777f8c);-webkit-background-clip:text;background-clip:text;color:transparent}.hero-subtitle{margin-top:9px;color:#737b88;font-size:13px}.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.catalog-controls{margin:0 0 20px}.search-wrap{height:48px;display:flex;align-items:center;gap:12px;padding:0 15px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(255,255,255,.035);color:#89919e}.search-wrap:focus-within{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.035)}.search-wrap>span{font-size:23px}.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:14px}.search-wrap input::placeholder{color:#666f7c}.filter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}.category-tabs{display:flex;gap:7px;flex-wrap:wrap}.category-tab{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);color:#89919e;border-radius:10px;padding:9px 13px;font-size:12px;cursor:pointer;transition:.2s}.category-tab:hover,.category-tab.active{background:#f0f1f3;color:#090a0d;border-color:#f0f1f3}.sort-control{display:flex;align-items:center;gap:8px;color:#7d8592;font-size:12px}.sort-control select{border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:9px 10px;background:#121419;color:#eee;max-width:190px}.result-count{margin-top:13px;font-size:11px;color:#6f7784}.site-card{min-height:220px;display:flex;flex-direction:column}.site-card-icon{margin-bottom:20px}.site-card-description{font-size:12px;line-height:1.55;color:#9098a5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.site-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;padding-right:20px}.site-tag{font-size:10px;color:#aeb5c0;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);padding:4px 7px;border-radius:6px}.site-card-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:13px;font-size:10px;color:#68717e}.site-card-meta span{display:inline-flex;align-items:center;gap:4px}.site-card-path{display:none}.site-card-arrow{bottom:15px}.empty{grid-column:1/-1}.empty strong{display:block;color:#b6bdc8;margin-bottom:6px}@media(max-width:650px){.filter-row{align-items:stretch}.category-tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.category-tab{white-space:nowrap}.sort-control{width:100%;justify-content:space-between}.sort-control select{flex:1}.site-card{min-height:200px}}.category-section{grid-column:1/-1;margin-top:18px}.category-section:first-child{margin-top:0}.category-section-heading{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07)}.category-section-heading strong{font-size:14px;font-weight:800;letter-spacing:-.2px}.category-section-heading span{font-size:11px;color:#737b88}.category-section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.catalog-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.catalog-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#697280;font-weight:800;margin-bottom:12px}.site-card{position:relative;min-height:160px;padding:20px;border:1px solid rgba(255,255,255,.07);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));overflow:hidden;cursor:pointer;opacity:0;animation:cardIn .4s ease forwards;transition:.23s}.site-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 18px 45px rgba(0,0,0,.23)}.site-card-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.06);font-size:18px;margin-bottom:30px;transition:.25s}.site-card:hover .site-card-icon{transform:scale(1.06);background:rgba(255,255,255,.09)}.site-card-name{font-size:16px;font-weight:760;word-break:break-word}.site-card-path{margin-top:6px;font-size:11px;color:#666e7b}.site-card-arrow{position:absolute;right:18px;bottom:18px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.045);color:#68707c;font-size:16px;transition:.25s}.site-card:hover .site-card-arrow{color:#fff;background:rgba(255,255,255,.1);transform:translateX(4px)}.empty{padding:70px 20px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:17px;color:#6f7784}.empty-icon{font-size:28px;margin-bottom:10px}#siteFrame{position:absolute;left:0;top:64px;width:100%;height:calc(100% - 64px);border:0;background:#050608;display:none;opacity:0;transition:opacity .25s}#siteFrame.ready{opacity:1}#loading,#error{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(5,6,8,.88);backdrop-filter:blur(25px);padding:30px}.loader-wrap{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.loader{width:27px;height:27px;border:2px solid rgba(255,255,255,.12);border-top-color:#fff;border-right-color:#fff;border-radius:50%;animation:spin .65s linear infinite}.loading-title{margin-top:18px;font-size:14px;font-weight:750}.loading-info{margin-top:7px;font-size:11px;color:#68707d;max-width:500px;word-break:break-word}.error-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:23px;margin-bottom:18px}#error h2{margin:0;font-size:25px}#error p{max-width:600px;margin:12px 0 0;color:#858c98;line-height:1.5;font-size:13px}#error button{margin-top:22px;border:0;background:#fff;color:#07080b;padding:11px 19px;border-radius:10px;font-weight:750;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cardIn{from{opacity:0;transform:translateY(13px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:650px){.topbar{padding:0 12px}.logo{font-size:16px}.logo-mark{width:29px;height:29px}.home-content{padding:30px 14px 50px}.site-grid{grid-template-columns:1fr}.hero-title{font-size:34px}}.download-modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(18px);padding:20px}.download-box{width:min(380px,100%);padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#111318;box-shadow:0 25px 70px rgba(0,0,0,.5)}.download-box h2{margin:0;font-size:20px}.download-box p{margin:8px 0 18px;color:#7f8794;font-size:12px}.download-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.download-actions button{border:1px solid rgba(255,255,255,.09);background:#20242b;color:#fff;border-radius:10px;padding:12px;font-weight:750;cursor:pointer}.download-actions .play{background:#fff;color:#08090c}.download-close{margin-top:9px;width:100%;border:0;background:transparent;color:#737b88;padding:8px;cursor:pointer}</style>
</head>
<body>
<div id="app">
<header class="topbar">
<div class="logo"><div class="logo-mark">I</div><span>Ikirumi</span></div>
<div><button id="backButton" class="back-button" onclick="showHome()">← Back</button><button class="refresh-button" onclick="refreshRepository()" title="Refresh">↻</button></div>
</header>
<section id="home" class="page"><div class="home-content"><div class="hero"><div class="hero-title">Explore <span>Ikirumi</span></div><div class="hero-subtitle">Games, tools, experiments and projects — all in one place.</div></div><div class="catalog-controls"><div class="catalog-label">Your project library</div><div class="search-wrap"><span>⌕</span><input id="siteSearch" type="search" placeholder="Search sites, tags, and descriptions…" autocomplete="off" aria-label="Search sites"></div><div class="filter-row"><div id="categoryTabs" class="category-tabs"><button class="category-tab active" data-category="all">All sites</button></div><label class="sort-control">Sort <select id="siteSort"><option value="recent">Recently updated</option><option value="newest">Recently added</option><option value="az">A to Z</option><option value="za">Z to A</option></select></label></div><div id="resultCount" class="result-count"></div></div><div id="siteGrid" class="site-grid"></div></div></section>
<iframe id="siteFrame"></iframe>
<div id="loading"><div class="loader-wrap"><div class="loader"></div></div><div id="loadingTitle" class="loading-title">Starting Ikirumi</div><div id="loadingInfo" class="loading-info">Loading sites...</div></div>
<div id="downloadModal" class="download-modal"><div class="download-box"><h2 id="downloadTitle">Site</h2><p id="downloadInfo">Choose an action.</p><div class="download-actions"><button class="play" id="playSiteButton">▶ Play</button><button id="downloadSiteButton">↓ Download</button></div><button class="download-close" onclick="closeDownloadModal()">Cancel</button></div></div>
<div id="error"><div class="error-icon">!</div><h2>Something went wrong</h2><p id="errorText"></p><button onclick="initialize()">Try Again</button></div>
</div>
<script>
const SITE_BASE=new URL("./",location.href).href;
const MANIFEST_URL=new URL("sites.json",SITE_BASE).href;
function localFileUrl(path){return new URL(path.split("/").map(encodeURIComponent).join("/"),SITE_BASE).href;}
const home=document.getElementById("home"),siteGrid=document.getElementById("siteGrid"),siteFrame=document.getElementById("siteFrame"),backButton=document.getElementById("backButton"),loading=document.getElementById("loading"),loadingTitle=document.getElementById("loadingTitle"),loadingInfo=document.getElementById("loadingInfo"),error=document.getElementById("error"),errorText=document.getElementById("errorText"),downloadModal=document.getElementById("downloadModal"),downloadTitle=document.getElementById("downloadTitle"),downloadInfo=document.getElementById("downloadInfo"),playSiteButton=document.getElementById("playSiteButton"),downloadSiteButton=document.getElementById("downloadSiteButton");
let selectedSite=null,repositoryFiles=[],sites=[],virtualFiles=new Map(),virtualUrls=new Map();
const siteSearch=document.getElementById("siteSearch"),categoryTabs=document.getElementById("categoryTabs"),siteSort=document.getElementById("siteSort"),resultCount=document.getElementById("resultCount");
const siteMetadata=new Map();let activeCategory="all";
function inferMetadata(folder){const name=getSiteName(folder),words=name.replace(/[-_]+/g," ").replace(/\b\w/g,s=>s.toUpperCase()),lower=(folder+" "+name).toLowerCase();let category="Tools",icon="✦",description="An interactive web project from the Ikirumi collection.",tags=["Web","Interactive"];if(/game|racing|rally|drift|cookie|subway|boss|fnaj|five|runner|clicker|surfer/.test(lower)){category="Games";icon="🎮";description="Play "+words+" — an interactive game project.";tags=["Game","Playable"]}else if(/editor|maker|blueprint|code|ai|chat|message|text/.test(lower)){category="Tools";icon="⌘";description="A browser-based tool for creating, experimenting, or getting things done.";tags=["Tool","Creative"]}else if(/gallery|image|photo|art|music|audio|video/.test(lower)){category="Media";icon="▧";description="Explore media and creative content in this project.";tags=["Media","Creative"]}else if(/test|demo|experiment|prototype/.test(lower)){category="Experiments";icon="⚗";description="An experimental project for testing ideas and interactive features.";tags=["Experiment","Prototype"]}return {name:words,description,tags,category,icon,createdAt:null,updatedAt:null}}
function dateLabel(value){if(!value)return "Date unknown";const date=new Date(value);if(Number.isNaN(date.getTime()))return "Date unknown";return date.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function matchesSite(folder,meta,query){const haystack=[meta.name,folder,meta.description,meta.category,...meta.tags].join(" ").toLowerCase();return (!query||haystack.includes(query))&&(activeCategory==="all"||meta.category===activeCategory)}
function renderCategories(){const cats=["all",...new Set(sites.map(folder=>(siteMetadata.get(folder)||inferMetadata(folder)).category))];categoryTabs.innerHTML="";cats.forEach(category=>{const button=document.createElement("button");button.className="category-tab"+(activeCategory===category?" active":"");button.dataset.category=category;button.textContent=category==="all"?"All sites":category;button.onclick=()=>{activeCategory=category;renderCategories();renderSites()};categoryTabs.appendChild(button)})}
function sortSites(list){const mode=siteSort.value;return list.sort((a,b)=>{const A=siteMetadata.get(a)||inferMetadata(a),B=siteMetadata.get(b)||inferMetadata(b);if(mode==="az")return A.name.localeCompare(B.name);if(mode==="za")return B.name.localeCompare(A.name);const key=mode==="newest"?"createdAt":"updatedAt";return (Date.parse(B[key]||"")||0)-(Date.parse(A[key]||"")||0)||A.name.localeCompare(B.name)})}
siteSearch.addEventListener("input",renderSites);siteSort.addEventListener("change",renderSites);
function showHome(){home.style.display="block";siteFrame.classList.remove("ready");siteFrame.style.display="none";backButton.style.display="none";error.style.display="none";history.replaceState({},document.title,location.pathname+location.search.replace(/([?&])site=[^&]*/,"").replace(/^\?$/,"").replace(/[?&]$/,""));renderSites()}
function getFolders(path){const prefix=path?path+"/":"",result=new Set();for(const file of repositoryFiles){if(!file.path.startsWith(prefix))continue;const remaining=file.path.substring(prefix.length),slash=remaining.indexOf("/");if(slash===-1)continue;result.add(prefix+remaining.substring(0,slash))}return Array.from(result)}
function getFiles(path){const prefix=path?path+"/":"";return repositoryFiles.filter(file=>{if(!file.path.startsWith(prefix))return false;const remaining=file.path.substring(prefix.length);return remaining.length>0&&!remaining.includes("/")})}
function hasIndex(path){return getFiles(path).some(file=>file.path.split("/").pop().toLowerCase()==="index.html")}
function getAllSites(){const result=[];function scan(path){for(const folder of getFolders(path)){if(hasIndex(folder))result.push(folder);scan(folder)}}scan("");return result.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})).filter((v,i,a)=>a.indexOf(v)===i)}
function getSiteName(folder){return folder.split("/").pop()}
function renderSites(){
siteGrid.innerHTML="";
const query=(siteSearch.value||"").trim().toLowerCase();
const filtered=sortSites(sites.filter(folder=>matchesSite(folder,siteMetadata.get(folder)||inferMetadata(folder),query)));
resultCount.textContent=filtered.length+" of "+sites.length+" sites";
if(filtered.length===0){siteGrid.innerHTML='<div class="empty"><div class="empty-icon">⌕</div><strong>No matching sites</strong>Try another search or category.</div>';return}
const grouped=activeCategory==="all"&&!query;
const groups=grouped?["Games","Tools","Media","Experiments","Other"].map(category=>({category,folders:filtered.filter(folder=>{const c=(siteMetadata.get(folder)||inferMetadata(folder)).category;return category==="Other"?!["Games","Tools","Media","Experiments"].includes(c):c===category})})).filter(group=>group.folders.length):[{category:null,folders:filtered}];
let cardIndex=0;
groups.forEach(group=>{
const section=document.createElement("section");
if(grouped){
section.className="category-section";
const heading=document.createElement("div");
heading.className="category-section-heading";
const title=document.createElement("strong");title.textContent=group.category;
const count=document.createElement("span");count.textContent=group.folders.length+" "+(group.folders.length===1?"site":"sites");
heading.append(title,count);section.appendChild(heading);
}
const grid=document.createElement("div");grid.className=grouped?"category-section-grid":"site-grid";
group.folders.forEach(folder=>{
const meta=siteMetadata.get(folder)||inferMetadata(folder),card=document.createElement("div");
card.className="site-card";card.style.animationDelay=Math.min(cardIndex++*25,350)+"ms";
card.innerHTML='<div class="site-card-icon"></div><div class="site-card-name"></div><div class="site-card-description"></div><div class="site-card-tags"></div><div class="site-card-meta"><span class="created"></span><span class="updated"></span></div><div class="site-card-path"></div><div class="site-card-arrow">›</div>';
card.querySelector(".site-card-icon").textContent=meta.icon||"✦";
card.querySelector(".site-card-name").textContent=meta.name||getSiteName(folder);
card.querySelector(".site-card-description").textContent=meta.description;
card.querySelector(".site-card-path").textContent=folder;
const tags=card.querySelector(".site-card-tags");
(meta.tags||[]).slice(0,4).forEach(tag=>{const el=document.createElement("span");el.className="site-tag";el.textContent=tag;tags.appendChild(el)});
card.querySelector(".created").textContent="Added "+dateLabel(meta.createdAt);
card.querySelector(".updated").textContent="Updated "+dateLabel(meta.updatedAt);
card.onclick=()=>chooseSite(folder);grid.appendChild(card);
});
section.appendChild(grid);siteGrid.appendChild(section);
});
}
async function refreshRepository(){repositoryFiles=[];sites=[];showHome();await initialize()}
async function loadRepository(){loadingTitle.textContent="Loading Sites";loadingInfo.textContent="Reading the site library...";const response=await fetch(MANIFEST_URL+"?cache="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("Could not load sites.json from this website (HTTP "+response.status+").");const data=await response.json();if(!Array.isArray(data.files)||!Array.isArray(data.sites))throw new Error("sites.json is not a valid site manifest.");repositoryFiles=data.files.map(path=>({path,type:"blob"}));sites=data.sites.filter(folder=>repositoryFiles.some(file=>file.path===folder+"/index.html"));siteMetadata.clear();await Promise.all(sites.map(async folder=>{let meta=inferMetadata(folder);try{const response=await fetch(localFileUrl(folder+"/site.json")+"?cache="+Date.now(),{cache:"no-store"});if(response.ok){const custom=await response.json();meta={...meta,...custom,name:custom.name||meta.name,description:custom.description||meta.description,tags:Array.isArray(custom.tags)?custom.tags:meta.tags,category:custom.category||meta.category,icon:custom.icon||meta.icon}}}catch(e){}meta.createdAt=null;meta.updatedAt=null;siteMetadata.set(folder,meta)}));renderCategories();renderSites()}
function normalizePath(path){const result=[];for(const part of path.split("/")){if(!part||part===".")continue;if(part==="..")result.pop();else result.push(part)}return result.join("/")}
function directory(path){const index=path.lastIndexOf("/");return index===-1?"":path.substring(0,index+1)}
function resolvePath(source,currentFile){if(!source)return null;source=source.trim();if(source.startsWith("#")||source.startsWith("data:")||source.startsWith("blob:")||source.startsWith("javascript:"))return null;if(source.startsWith("http://")||source.startsWith("https://")||source.startsWith("//"))return source;const clean=source.split("?")[0].split("#")[0];return clean.startsWith("/")?normalizePath(clean.substring(1)):normalizePath(directory(currentFile)+clean)}
function virtualUrl(path){return virtualUrls.get(normalizePath(path))||null}
async function prepareFiles(folder){virtualFiles.clear();for(const url of virtualUrls.values()){try{URL.revokeObjectURL(url)}catch(e){}}virtualUrls.clear();const filesToDownload=repositoryFiles.filter(file=>file.path===folder+"/index.html"||file.path.startsWith(folder+"/"));if(filesToDownload.length===0)throw new Error("No files were found for this site.");loading.style.display="flex";for(let i=0;i<filesToDownload.length;i++){const file=filesToDownload[i],relative=file.path.substring(folder.length+1);loadingTitle.textContent="Opening Site";loadingInfo.textContent=(i+1)+" / "+filesToDownload.length+" · "+relative;const response=await fetch(localFileUrl(file.path)+"?cache="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("Failed to download "+relative);const blob=await response.blob();virtualFiles.set(relative,{blob:blob,type:blob.type})}for(const [path,file] of virtualFiles){let blob=file.blob;if(path.toLowerCase().endsWith(".css")){let text=await blob.text();text=rewriteCSS(text,path);blob=new Blob([text],{type:"text/css"})}virtualUrls.set(path,URL.createObjectURL(blob))}return filesToDownload}
function rewriteCSS(text,file){return text.replace(/url\s*\(\s*(['"]?)(.*?)\1\s*\)/gi,(full,quote,source)=>{const path=resolvePath(source,file);if(!path)return full;const url=virtualUrl(path);return url?'url("'+url+'")':full})}
function replaceAttribute(element,attribute,currentFile){const source=element.getAttribute(attribute);if(!source)return;const path=resolvePath(source,currentFile);if(!path)return;const url=virtualUrl(path);if(url)element.setAttribute(attribute,url)}
async function loadSite(folder){const filesToDownload=await prepareFiles(folder);const index=virtualFiles.get("index.html");if(!index)throw new Error("index.html was not found.");const parser=new DOMParser(),doc=parser.parseFromString(await index.blob.text(),"text/html");doc.querySelectorAll("base").forEach(element=>element.remove());doc.querySelectorAll("link[href]").forEach(element=>replaceAttribute(element,"href","index.html"));doc.querySelectorAll("script[src]").forEach(element=>replaceAttribute(element,"src","index.html"));doc.querySelectorAll("img[src],video[src],audio[src],source[src],iframe[src]").forEach(element=>replaceAttribute(element,"src","index.html"));doc.querySelectorAll("video[poster]").forEach(element=>replaceAttribute(element,"poster","index.html"));loadingTitle.textContent="Launching "+getSiteName(folder);loadingInfo.textContent=filesToDownload.length+" files ready";siteFrame.srcdoc="<!DOCTYPE html>"+doc.documentElement.outerHTML;siteFrame.style.display="block";backButton.style.display="inline-block";home.style.display="none";siteFrame.onload=()=>{requestAnimationFrame(()=>{siteFrame.classList.add("ready");loading.style.display="none"})}}
function chooseSite(folder){history.replaceState({},document.title,location.pathname+"?site="+encodeURIComponent(folder));selectedSite=folder;const name=getSiteName(folder),folderFiles=repositoryFiles.filter(file=>file.path.startsWith(folder+"/"));downloadTitle.textContent=name;downloadInfo.textContent="Play the site, or download the complete "+folderFiles.length+"-file folder.";downloadModal.style.display="flex"}
function closeDownloadModal(){downloadModal.style.display="none";selectedSite=null}
playSiteButton.onclick=async()=>{const folder=selectedSite;closeDownloadModal();if(folder)openSite(folder)}
downloadSiteButton.onclick=async()=>{const folder=selectedSite;closeDownloadModal();if(folder)await downloadFolder(folder)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function loadJSZip(){return new Promise((resolve,reject)=>{if(window.JSZip){resolve(window.JSZip);return}const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";s.onload=()=>resolve(window.JSZip);s.onerror=()=>reject(new Error("Could not load ZIP support."));document.head.appendChild(s)})}
async function downloadFolder(folder){const files=repositoryFiles.filter(file=>file.path.startsWith(folder+"/"));loading.style.display="flex";loadingTitle.textContent="Preparing Download";loadingInfo.textContent="Downloading all "+files.length+" files...";try{const JSZip=await loadJSZip(),zip=new JSZip();for(let i=0;i<files.length;i++){const file=files[i],relative=file.path.substring(folder.length+1);loadingInfo.textContent=(i+1)+" / "+files.length+" · "+relative;const r=await fetch(localFileUrl(file.path)+"?cache="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Failed to download "+relative);zip.file(relative,await r.blob())}const blob=await zip.generateAsync({type:"blob"});downloadBlob(blob,getSiteName(folder)+".zip")}catch(e){errorText.textContent="Could not download "+getSiteName(folder)+": "+e.message;error.style.display="flex"}finally{loading.style.display="none"}}
async function openSite(folder){siteFrame.classList.remove("ready");try{await loadSite(folder)}catch(e){loading.style.display="none";errorText.textContent="Could not open "+getSiteName(folder)+": "+e.message;error.style.display="flex"}}
async function initialize(){error.style.display="none";loading.style.display="flex";loadingTitle.textContent="Starting Ikirumi";loadingInfo.textContent="Loading sites...";try{await loadRepository();loading.style.display="none";const params=new URLSearchParams(location.search),directSite=params.get("site");if(directSite&&sites.includes(directSite)){await openSite(directSite)}else{showHome()}}catch(e){loading.style.display="none";errorText.textContent="Could not initialize Ikirumi: "+e.message;error.style.display="flex"}}
initialize();
</script>
