<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text to 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#fff;font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.panel{background:#0d1118;border-right:1px solid #252b35;padding:20px;overflow:auto}.title{font-size:22px;font-weight:900;margin-bottom:4px}.sub{font-size:12px;color:#7d8797;margin-bottom:22px}.label{font-size:12px;color:#aeb7c5;margin:15px 0 7px}.text{width:100%;height:130px;background:#080b10;color:#fff;border:1px solid #303846;border-radius:9px;padding:12px;resize:vertical;outline:0}.text:focus{border-color:#6478ef}.range{width:100%;accent-color:#6478ef}.row{display:flex;justify-content:space-between;font-size:12px;color:#b9c1cc}.value{color:#6678e8}.select{width:100%;background:#11161e;color:#fff;border:1px solid #303846;border-radius:8px;padding:9px}.btn{width:100%;border:1px solid #303846;background:#151a22;color:#fff;border-radius:9px;padding:11px;margin-top:9px;font-weight:800;cursor:pointer}.btn:hover{background:#202733}.primary{background:#596de9;border-color:#7182f2}.primary:hover{background:#687bf4}.status{font-size:11px;color:#718096;margin-top:12px}.view{position:relative;min-width:0}.view canvas{display:block;width:100%;height:100vh}.badge{position:absolute;top:16px;left:16px;background:#0b0f16dd;border:1px solid #303846;border-radius:8px;padding:8px 10px;color:#9ba6b6;font-size:11px;pointer-events:none}.hint{font-size:11px;line-height:1.5;color:#687487;margin-top:14px}@media(max-width:700px){.app{display:block}.panel{border:0;border-bottom:1px solid #252b35}.view canvas{height:60vh}.view{height:60vh}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
<div class="title">Text to 3D</div>
<div class="sub">Low-poly 3D text generator</div>
<div class="label">Text</div>
<textarea id="text" class="text">IKIRUMI</textarea>
<div class="label">Block size <span class="value" id="sizeV"></span></div>
<input id="size" class="range" type="range" min=".05" max=".5" step=".01" value=".18">
<div class="label">Depth <span class="value" id="depthV"></span></div>
<input id="depth" class="range" type="range" min=".05" max="1" step=".01" value=".35">
<div class="label">Letter spacing <span class="value" id="spacingV"></span></div>
<input id="spacing" class="range" type="range" min="0" max=".4" step=".01" value=".08">
<div class="label">Text color</div>
<input id="color" type="color" value="#6377ff" style="width:100%;height:40px;background:#080b10;border:1px solid #303846;border-radius:8px;padding:3px">
<div class="label">Background</div>
<input id="bg" type="color" value="#11151d" style="width:100%;height:40px;background:#080b10;border:1px solid #303846;border-radius:8px;padding:3px">
<button id="fbx" class="btn primary">Download FBX</button>
<button id="reset" class="btn">Reset</button>
<div class="hint">Uses a custom 5×7 block font, so the exported mesh stays extremely low-poly. Spaces and line breaks are supported. Every visible block becomes part of the FBX mesh.</div>
<div id="status" class="status">Ready</div>
</aside>
<main class="view" id="view"><div class="badge">DRAG TO ROTATE • SCROLL TO ZOOM</div></main>
</div>
<script>
const FONT={
A:["01110","10001","10001","11111","10001","10001","10001"],B:["11110","10001","10001","11110","10001","10001","11110"],C:["01111","10000","10000","10000","10000","10000","01111"],D:["11110","10001","10001","10001","10001","10001","11110"],E:["11111","10000","10000","11110","10000","10000","11111"],F:["11111","10000","10000","11110","10000","10000","10000"],G:["01111","10000","10000","10111","10001","10001","01111"],H:["10001","10001","10001","11111","10001","10001","10001"],I:["11111","00100","00100","00100","00100","00100","11111"],J:["00111","00010","00010","00010","10010","10010","01100"],K:["10001","10010","10100","11000","10100","10010","10001"],L:["10000","10000","10000","10000","10000","10000","11111"],M:["10001","11011","10101","10101","10001","10001","10001"],N:["10001","11001","10101","10011","10001","10001","10001"],O:["01110","10001","10001","10001","10001","10001","01110"],P:["11110","10001","10001","11110","10000","10000","10000"],Q:["01110","10001","10001","10001","10101","10010","01101"],R:["11110","10001","10001","11110","10100","10010","10001"],S:["01111","10000","10000","01110","00001","00001","11110"],T:["11111","00100","00100","00100","00100","00100","00100"],U:["10001","10001","10001","10001","10001","10001","01110"],V:["10001","10001","10001","10001","10001","01010","00100"],W:["10001","10001","10001","10101","10101","11011","10001"],X:["10001","10001","01010","00100","01010","10001","10001"],Y:["10001","10001","01010","00100","00100","00100","00100"],Z:["11111","00001","00010","00100","01000","10000","11111"],
"0":["01110","10001","10011","10101","11001","10001","01110"],"1":["00100","01100","00100","00100","00100","00100","01110"],"2":["01110","10001","00001","00010","00100","01000","11111"],"3":["11110","00001","00001","01110","00001","00001","11110"],"4":["00010","00110","01010","10010","11111","00010","00010"],"5":["11111","10000","10000","11110","00001","00001","11110"],"6":["01110","10000","10000","11110","10001","10001","01110"],"7":["11111","00001","00010","00100","01000","01000","01000"],"8":["01110","10001","10001","01110","10001","10001","01110"],"9":["01110","10001","10001","01111","00001","00001","01110"]
};
const el=id=>document.getElementById(id);
let canvas,ctx,mesh=[],rotX=.18,rotY=-.55,zoom=1.8,drag=false,lx=0,ly=0;

function rebuild(){
const s=+el("size").value,d=+el("depth").value,sp=+el("spacing").value;
mesh=[];const lines=el("text").value.toUpperCase().split("\n");let y=lines.length*3.5*s;
for(const line of lines){
let width=0;
for(const ch of line)width+=(FONT[ch]?5*s+sp:3*s+sp);
let x=-width/2;
for(const ch of line){
const f=FONT[ch];
if(!f){x+=3*s+sp;continue}
for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(f[r][c]==="1"){addCube(x+c*s,y-r*s,s,d)}
x+=5*s+sp
}
y-=8*s
}
render();labels()
}
function addCube(x,y,s,d){
const z=d/2, x0=x,y0=y,x1=x+s,y1=y+s,z0=-z,z1=z;
const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
const f=[[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[0,4,7,3],[1,2,6,5]];
for(const q of f)mesh.push([v[q[0]],v[q[1]],v[q[2]],[v[q[0]],v[q[2]],v[q[3]]]])
}
function project(p){
let x=p[0],y=p[1],z=p[2],cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);
let x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cx-z1*sx,z2=y*sx+z1*cx;
let scale=180*zoom/(z2+7),w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
return [w/2+x1*scale,h/2-y1*scale,z2]
}
function render(){
if(!canvas)return;
canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle=el("bg").value;ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
const faces=mesh.map(q=>{const p=q.map(project);return{p,z:(p[0][2]+p[1][2]+p[2][2]+p[3][2])/4}}).sort((a,b)=>b.z-a.z);
ctx.fillStyle=el("color").value;ctx.strokeStyle="rgba(0,0,0,.18)";ctx.lineWidth=.5;
for(const a of faces){ctx.beginPath();ctx.moveTo(a.p[0][0],a.p[0][1]);for(let i=1;i<4;i++)ctx.lineTo(a.p[i][0],a.p[i][1]);ctx.closePath();ctx.fill();ctx.stroke()}
}
function labels(){el("sizeV").textContent=el("size").value;el("depthV").textContent=el("depth").value;el("spacingV").textContent=el("spacing").value}
function init(){
canvas=document.createElement("canvas");el("view").appendChild(canvas);ctx=canvas.getContext("2d");new ResizeObserver(render).observe(el("view"));rebuild();
canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;rotY+=(e.clientX-lx)*.01;rotX+=(e.clientY-ly)*.01;rotX=Math.max(-1.5,Math.min(1.5,rotX));lx=e.clientX;ly=e.clientY;render()};
canvas.onpointerup=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom*=e.deltaY<0?1.1:.9;zoom=Math.max(.5,Math.min(4,zoom));render()}
}
function clean(){return(el("text").value.split("\n")[0].trim().replace(/[^a-z0-9_-]/gi,"-").replace(/^-+|-+$/g,"")||"text-3d").slice(0,40)}
function exportFBX(){
if(!mesh.length){el("status").textContent="Nothing to export";return}
el("status").textContent="Building FBX…";
const vs=[],ids=[],lookup=new Map();
function get(v){const k=v.map(n=>n.toFixed(5)).join(",");if(lookup.has(k))return lookup.get(k);const i=vs.length/3;vs.push(...v);lookup.set(k,i);return i}
for(const q of mesh){const a=get(q[0]),b=get(q[1]),c=get(q[2]),d=get(q[3]);ids.push(a,b,c,-(d+1))}
const lines=[
"; FBX 7.4.0 project file","; Generated by Text to 3D","",
"FBXHeaderExtension: {"," FBXHeaderVersion: 1003"," FBXVersion: 7400"," Creator: \"Text to 3D\"","}","",
"Definitions: {"," Version: 100"," Count: 2"," ObjectType: \"Geometry\" { Count: 1 }"," ObjectType: \"Model\" { Count: 1 }","}","",
"Objects: {",
" Geometry: 100000001, \"Geometry::Text\", \"Mesh\" {",
"  GeometryVersion: 124",
"  Vertices: "+vs.join(","),
"  PolygonVertexIndex: "+ids.join(","),
" }",
" Model: 100000002, \"Model::Text\", \"Mesh\" {",
"  Version: 232",
" }",
"}","",
"Connections: {"," C: \"OO\",100000001,100000002","}",""
];
const blob=new Blob([lines.join("\n")],{type:"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=clean()+".fbx";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);el("status").textContent="FBX downloaded";
}
["text","size","depth","spacing"].forEach(id=>el(id).addEventListener(id==="text"?"input":"input",rebuild));el("color").oninput=render;el("bg").oninput=render;el("fbx").onclick=exportFBX;el("reset").onclick=()=>{el("text").value="IKIRUMI";el("size").value=".18";el("depth").value=".35";el("spacing").value=".08";el("color").value="#6377ff";el("bg").value="#11151d";rebuild()};init();
</script>
</body>
</html>
