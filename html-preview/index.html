<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Preview — Ikirumi</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#12151d;--panel2:#171b25;--line:#292e3b;--muted:#929bad;--text:#edf0f7;--accent:#a78bfa;--accent2:#7c5ce7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px;cursor:pointer;transition:.15s}button:hover{border-color:#7770a6;background:#222635}button.primary{background:var(--accent2);border-color:var(--accent2);color:white}button.active{background:#30264e;border-color:var(--accent)}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:#10121a}.brand{font-weight:800;letter-spacing:-.4px;font-size:16px;display:flex;align-items:center;gap:10px;margin-right:auto}.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#c4b5fd,#7c3aed);color:#171122;font-weight:900}.status{color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:minmax(280px,42%) 1fr;min-height:0;flex:1}.editor{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:var(--panel)}.panehead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);min-height:48px}.panehead strong{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.spacer{flex:1}.tabs{display:flex;gap:5px}.tab{padding:6px 9px;font-size:12px}.codewrap{display:flex;flex:1;min-height:0;position:relative}.numbers{padding:15px 10px;color:#626b7d;text-align:right;white-space:pre;user-select:none;background:#10131a;overflow:hidden;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.code{resize:none;flex:1;width:0;min-width:0;border:0;outline:0;background:#12151d;color:#e2e6f0;padding:15px 14px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}.editorfoot{padding:9px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.preview{min-width:0;min-height:0;display:flex;flex-direction:column;background:#0e1016}.previewhead{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);min-height:48px}.device{display:flex;gap:4px;background:#0b0d12;border:1px solid var(--line);padding:3px;border-radius:10px}.device button{border:0;padding:5px 8px;background:transparent;color:var(--muted);font-size:12px}.device button.active{background:#28243b;color:white}.address{display:flex;align-items:center;gap:7px;flex:1;min-width:80px;background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:12px}.viewport{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;padding:14px;overflow:auto}.framebox{width:100%;height:100%;min-height:260px;transition:width .2s;border:1px solid #303541;border-radius:10px;overflow:hidden;background:white}.framebox.tablet{width:768px;max-width:100%}.framebox.mobile{width:390px;max-width:100%}.framebox iframe{display:block;width:100%;height:100%;border:0;background:white}.empty{height:100%;display:grid;place-items:center;color:#697386;text-align:center;padding:25px}.empty b{display:block;color:#aeb6c7;margin-bottom:5px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#29233c;border:1px solid #514174;padding:10px 15px;border-radius:10px;display:none;z-index:10}.hidden{display:none!important}input[type=file]{display:none}.bottomline{height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--line);color:#798296;font-size:11px;background:#10121a}@media(max-width:760px){.workspace{grid-template-columns:1fr;grid-template-rows:45% 55%}.editor{border-right:0;border-bottom:1px solid var(--line)}.top{padding:0 9px;gap:6px}.top button{padding:7px 8px}.brand{font-size:14px}.status{display:none}.viewport{padding:7px}.framebox{min-height:180px}.panehead{min-height:40px;padding:6px 9px}.previewhead{min-height:40px;padding:6px 9px}}
.floating-menu-toggle{position:fixed;z-index:30;top:12px;right:12px;width:44px;height:44px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:#211c31ef;border:1px solid #a78bfa80;box-shadow:0 8px 28px #0007;backdrop-filter:blur(14px)}.floating-menu-toggle span{width:15px;height:2px;border-radius:2px;background:#eee8ff;transition:transform .18s,opacity .18s}.floating-menu-toggle[aria-expanded=true] span:first-child{transform:translateY(6px) rotate(45deg)}.floating-menu-toggle[aria-expanded=true] span:nth-child(2){opacity:0}.floating-menu-toggle[aria-expanded=true] span:last-child{transform:translateY(-6px) rotate(-45deg)}.floating-menu{position:fixed;z-index:29;top:64px;right:12px;width:min(300px,calc(100vw - 24px));padding:12px;border:1px solid #39334b;border-radius:17px;background:#15131df5;box-shadow:0 20px 65px #0009;backdrop-filter:blur(18px)}.floating-menu[hidden]{display:none}.floating-menu-title{display:flex;align-items:center;gap:10px;padding:5px 4px 13px;border-bottom:1px solid #ffffff14;margin-bottom:8px}.floating-menu-title>div{display:flex;flex-direction:column;gap:3px;flex:1}.floating-menu-title strong{font-size:14px}.floating-menu-title small,.menu-action small{font-size:10px;color:var(--muted)}.menu-close{width:30px;height:30px;padding:0;border-radius:50%;font-size:21px;line-height:1}.menu-action{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;margin-top:5px;text-align:left;border-radius:11px}.menu-action>span:first-child{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#ffffff0b;font-size:16px}.menu-action>span:last-child{display:flex;flex-direction:column;gap:3px;flex:1}.menu-action strong{font-size:12px}.menu-action.primary{background:#7353d8;border-color:#7353d8}.menu-action.primary small{color:#eee6ff}.menu-note{margin:10px 4px 2px;color:var(--muted);font-size:10px}@media(max-width:760px){.floating-menu-toggle{top:9px;right:9px;width:40px;height:40px}.floating-menu{top:56px;right:9px}.top{display:none}.workspace{height:100%;grid-template-rows:minmax(0,48%) minmax(0,52%)}.code{font-size:12px;padding:10px}.numbers{font-size:12px;padding:10px 7px}.editorfoot{padding:6px 9px}.previewhead .address{display:none}.previewhead .device button{padding:5px 6px}.viewport{padding:5px}.framebox{min-height:120px}}@media(max-width:380px){.workspace{grid-template-rows:minmax(0,50%) minmax(0,50%)}.previewhead{gap:5px}.previewhead>strong{font-size:10px!important}.device button{font-size:10px!important}.previewhead #fullBtn{font-size:11px;padding:6px}}</style>
</head>
<body><div class="app">
<input id="fileInput" type="file" accept=".html,.htm,.txt"><button id="menuToggle" class="floating-menu-toggle" aria-label="Open HTML viewer menu" aria-expanded="false" aria-controls="viewerMenu" title="HTML menu"><span></span><span></span><span></span></button><aside id="viewerMenu" class="floating-menu" hidden><div class="floating-menu-title"><span class="logo">&lt;/&gt;</span><div><strong>HTML Viewer</strong><small>FILE &amp; PREVIEW</small></div><button id="menuClose" class="menu-close" aria-label="Close menu">×</button></div><button id="openBtn" class="menu-action"><span>↥</span><span><strong>Open HTML file</strong><small>Load an .html or .htm file</small></span></button><button id="refreshBtn" class="menu-action primary"><span>▶</span><span><strong>Run preview</strong><small>Update the live preview</small></span></button><button id="downloadBtn" class="menu-action"><span>↓</span><span><strong>Export HTML</strong><small>Download current HTML</small></span></button><button id="sampleBtn" class="menu-action"><span>✧</span><span><strong>Load example</strong><small>Load sample code</small></span></button><button id="clearBtn" class="menu-action"><span>⌫</span><span><strong>Clear editor</strong><small>Remove current code</small></span></button><p class="menu-note">Code is saved in this browser.</p></aside>
<main class="workspace" id="workspace">
<section class="editor"><div class="panehead"><strong>Code editor</strong><div class="spacer"></div><span class="status">HTML / CSS / JavaScript</span></div><div class="codewrap"><div class="numbers" id="numbers">1</div><textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="HTML code editor"></textarea></div><div class="editorfoot"><span id="lineInfo">1 line</span><span class="spacer"></span><span id="saveInfo">Saved in this browser</span></div></section>
<section class="preview"><div class="previewhead"><strong style="font-size:12px">PREVIEW</strong><div class="spacer"></div><div class="device"><button data-size="desktop" class="active">Desktop</button><button data-size="tablet">Tablet</button><button data-size="mobile">Phone</button></div><div class="address"><span>◉</span><span id="previewLabel">Live local preview</span></div><button id="fullBtn">⛶ Fullscreen</button></div><div class="viewport" id="viewport"><div class="framebox" id="framebox"><iframe id="preview" title="HTML preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div></div></section>
</main><footer class="bottomline"><span>HTML • CSS • JavaScript</span><span id="stateText">Ready</span><span>Changes update live</span></footer></div><div class="toast" id="toast"></div>
<script>
const starter='<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>My website</title>\n  <style>\n    body { font-family: system-ui, sans-serif; margin: 0; padding: 48px; background: #f3f4f6; color: #202332; }\n    main { max-width: 680px; margin: 8vh auto; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 12px 50px #17203318; }\n    button { padding: 12px 18px; border: 0; border-radius: 9px; background: #7455e8; color: white; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <main>\n    <h1>Hello, world!</h1>\n    <p>Edit this HTML and your preview updates automatically.</p>\n    <button onclick="document.querySelector('p').textContent='Your button works!'">Try the button</button>\n  </main>\n</body>\n</html>';
const code=document.getElementById('code'),frame=document.getElementById('preview'),box=document.getElementById('framebox'),nums=document.getElementById('numbers'),toastEl=document.getElementById('toast');let timer;const menu=document.getElementById('viewerMenu'),menuToggle=document.getElementById('menuToggle');function setMenu(open){menu.hidden=!open;menuToggle.setAttribute('aria-expanded',String(open));menuToggle.setAttribute('aria-label',open?'Close HTML viewer menu':'Open HTML viewer menu')}menuToggle.addEventListener('click',()=>setMenu(menu.hidden));document.getElementById('menuClose').addEventListener('click',()=>setMenu(false));document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!menuToggle.contains(e.target))setMenu(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
function toast(t){toastEl.textContent=t;toastEl.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toastEl.style.display='none',2200)}
function run(){const val=code.value;frame.srcdoc=val;const n=val.split('\n').length;nums.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');document.getElementById('lineInfo').textContent=n+' line'+(n===1?'':'s');document.getElementById('stateText').textContent='Preview updated';try{localStorage.setItem('ikirumi-html-preview-code',val);document.getElementById('saveInfo').textContent='Saved in this browser'}catch(e){document.getElementById('saveInfo').textContent='Browser storage unavailable'}}
code.addEventListener('input',()=>{run();document.getElementById('stateText').textContent='Editing…'});code.addEventListener('scroll',()=>{nums.scrollTop=code.scrollTop});
document.getElementById('refreshBtn').onclick=()=>{run();setMenu(false);toast('Preview refreshed')};
document.getElementById('sampleBtn').onclick=()=>{code.value=starter;run();setMenu(false);toast('Example loaded')};
document.getElementById('clearBtn').onclick=()=>{setMenu(false);if(confirm('Clear the editor?')){code.value='';run()}};
document.getElementById('openBtn').onclick=()=>{setMenu(false);document.getElementById('fileInput').click()};
document.getElementById('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;code.value=await f.text();run();toast('Opened '+f.name);e.target.value=''};
document.getElementById('downloadBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/html;charset=utf-8'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);setMenu(false);toast('HTML export started')};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));box.className='framebox'+(b.dataset.size==='desktop'?'':' '+b.dataset.size);document.getElementById('previewLabel').textContent=b.dataset.size==='desktop'?'Live local preview':b.dataset.size==='tablet'?'Tablet preview · 768px':'Phone preview · 390px'});
document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.getElementById('viewport').requestFullscreen();else await document.exitFullscreen()}catch(e){toast('Fullscreen is not available in this browser')}};
document.addEventListener('fullscreenchange',()=>document.getElementById('fullBtn').textContent=document.fullscreenElement?'⛶ Exit fullscreen':'⛶ Fullscreen');
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();document.getElementById('downloadBtn').click()}});
try{code.value=localStorage.getItem('ikirumi-html-preview-code')||starter}catch(e){code.value=starter}run();
</script></body></html>
