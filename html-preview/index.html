<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111018">
<title>HTML Viewer — Ikirumi</title>
<style>
:root{color-scheme:dark;--bg:#111018;--panel:#1b1925;--line:#393448;--text:#f4f1fb;--muted:#b4adca;--accent:#9270f5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
#preview{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:block}
#toggle{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:44px;height:44px;border-radius:50%;border:1px solid #b9a5ff99;background:#211c31ed;color:white;display:grid;place-items:center;padding:0;box-shadow:0 5px 24px #0006;backdrop-filter:blur(12px);cursor:pointer}
#toggle svg{width:21px;height:21px}
#menu{position:fixed;z-index:999;top:calc(max(12px,env(safe-area-inset-top)) + 54px);right:max(12px,env(safe-area-inset-right));width:min(330px,calc(100vw - 24px));max-height:calc(100dvh - 85px);overflow:auto;background:#191722f7;border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:0 18px 65px #0009;backdrop-filter:blur(18px)}
[hidden]{display:none!important}
.menuhead{display:flex;align-items:center;gap:10px;padding:3px 2px 12px;margin-bottom:8px;border-bottom:1px solid #ffffff18}
.logo{width:35px;height:35px;border-radius:11px;background:#9270f5;color:#160f2d;font-weight:900;display:grid;place-items:center}
.headtext{flex:1;min-width:0}.headtext strong{display:block;font-size:15px}.headtext small{color:var(--muted);font-size:11px}
.action{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 10px;margin:4px 0;border-radius:11px;border:1px solid transparent;background:#ffffff08;color:var(--text);cursor:pointer}
.action:hover{background:#ffffff12;border-color:#51466f}
.action .ico{width:30px;height:30px;border-radius:9px;background:#ffffff0c;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.action .words{display:block;min-width:0}.action strong{display:block;font-size:13px}.action small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.action.primary{background:#7354d8;border-color:#8b70ef}.action.primary small{color:#eee7ff}
#editor{margin-top:10px;border-top:1px solid #ffffff18;padding-top:12px}
#htmlCode{display:block;width:100%;min-height:210px;max-height:40dvh;resize:vertical;background:#0d0c13;color:#e8e3f8;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline:none}
#htmlCode:focus{border-color:var(--accent)}
.editorbuttons{display:flex;gap:7px;margin-top:8px}.editorbuttons button{flex:1}
.smallbtn{border:1px solid var(--line);border-radius:9px;background:#272431;color:var(--text);padding:9px 10px;cursor:pointer}
.note{font-size:11px;color:var(--muted);padding:8px 3px 1px}
#toast{position:fixed;z-index:1100;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 28px);background:#211c31;color:white;border:1px solid #65558b;border-radius:12px;padding:10px 15px;box-shadow:0 8px 28px #0007;display:none;text-align:center}
@media(min-width:761px){#toggle{top:16px;right:16px}#menu{top:70px;right:16px}}
</style>
</head>
<body>
<iframe id="preview" title="HTML preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
<input id="file" type="file" accept=".html,.htm,.txt,text/html,text/plain" hidden>
<button id="toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu" title="HTML menu">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<aside id="menu" hidden>
<div class="menuhead"><div class="logo">&lt;/&gt;</div><div class="headtext"><strong>HTML Viewer</strong><small>Full-screen preview</small></div><button id="close" class="smallbtn" aria-label="Close menu">×</button></div>
<button id="open" class="action primary"><span class="ico">↥</span><span class="words"><strong>Open HTML file</strong><small>Choose a file from your device</small></span></button>
<button id="edit" class="action"><span class="ico">✎</span><span class="words"><strong>Set / edit HTML</strong><small>Paste or change the HTML source</small></span></button>
<button id="download" class="action"><span class="ico">↓</span><span class="words"><strong>Download HTML</strong><small>Save the current page as a file</small></span></button>
<button id="reload" class="action"><span class="ico">↻</span><span class="words"><strong>Reload preview</strong><small>Run the current HTML again</small></span></button>
<section id="editor" hidden>
<label for="htmlCode" class="note">HTML source</label>
<textarea id="htmlCode" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste your complete HTML here..."></textarea>
<div class="editorbuttons"><button id="apply" class="smallbtn">Apply HTML</button><button id="cancel" class="smallbtn">Cancel</button></div>
</section>
<div class="note">Your HTML is saved in this browser when possible.</div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
const preview=document.getElementById('preview');
const toggle=document.getElementById('toggle');
const menu=document.getElementById('menu');
const file=document.getElementById('file');
const editor=document.getElementById('editor');
const htmlCode=document.getElementById('htmlCode');
const toastBox=document.getElementById('toast');
let toastTimer=0;
const starter='<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>My page</title>\n<style>body{font-family:system-ui,sans-serif;padding:40px;line-height:1.5}h1{color:#7354d8}</style>\n</head>\n<body>\n<h1>HTML Viewer is ready</h1>\n<p>Open an HTML file or choose Set / edit HTML from the corner menu.</p>\n</body>\n</html>';
function notify(message){toastBox.textContent=message;toastBox.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastBox.style.display='none'},2400)}
function getCurrent(){return htmlCode.value}
function applyHTML(value,save){htmlCode.value=value;preview.srcdoc=value;if(save!==false){try{localStorage.setItem('ikirumi-html-viewer-source',value)}catch(e){}}}
function openMenu(){menu.hidden=false;toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Close menu')}
function closeMenu(){menu.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open menu')}
toggle.addEventListener('click',function(){if(menu.hidden)openMenu();else closeMenu()});
document.getElementById('close').addEventListener('click',closeMenu);
document.addEventListener('click',function(e){if(!menu.hidden&&!menu.contains(e.target)&&!toggle.contains(e.target))closeMenu()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeMenu();editor.hidden=true}});
document.getElementById('open').addEventListener('click',function(){file.click()});
file.addEventListener('change',function(){const chosen=file.files&&file.files[0];if(!chosen)return;const reader=new FileReader();reader.onload=function(){applyHTML(String(reader.result||''));editor.hidden=true;closeMenu();notify('Loaded '+chosen.name)};reader.onerror=function(){notify('Could not read that file')};reader.readAsText(chosen);file.value=''});
document.getElementById('edit').addEventListener('click',function(){editor.hidden=!editor.hidden;if(!editor.hidden){htmlCode.focus()}});
document.getElementById('apply').addEventListener('click',function(){applyHTML(getCurrent());editor.hidden=true;closeMenu();notify('HTML applied')});
document.getElementById('cancel').addEventListener('click',function(){editor.hidden=true});
document.getElementById('reload').addEventListener('click',function(){applyHTML(getCurrent());closeMenu();notify('Preview reloaded')});
document.getElementById('download').addEventListener('click',function(){const blob=new Blob([getCurrent()],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500);closeMenu();notify('HTML download started')});
let initial=starter;try{const saved=localStorage.getItem('ikirumi-html-viewer-source');if(saved!==null)initial=saved}catch(e){}
applyHTML(initial,false);
})();
</script>
</body>
</html>
