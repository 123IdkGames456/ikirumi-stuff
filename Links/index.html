<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Links</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050608;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:40px 20px}
main{width:min(760px,100%);margin:auto}
h1{margin:0;font-size:clamp(34px,7vw,52px);font-weight:900;letter-spacing:-2.5px}
.subtitle{margin:8px 0 28px;color:#737b88;font-size:13px}
.links{display:grid;gap:12px}
a{display:flex;align-items:center;justify-content:space-between;min-height:78px;padding:18px 20px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));color:#fff;text-decoration:none;transition:.23s}
a:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.16);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 18px 45px rgba(0,0,0,.23)}
.name{font-size:16px;font-weight:800}
.url{margin-top:5px;color:#68707c;font-size:11px;word-break:break-all}
.arrow{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.05);color:#737b88;font-size:18px;transition:.2s}
a:hover .arrow{color:#fff;background:rgba(255,255,255,.1);transform:translateX(4px)}
</style>
</head>
<body>
<main>
<h1>Links</h1>
<div class="subtitle">Useful links.</div>
<div class="links">
<a href="https://123idkgames456.github.io/FNAJ/" target="_blank" rel="noopener"><div><div class="name">FNAJ Website</div><div class="url">123idkgames456.github.io/FNAJ/</div></div><div class="arrow">›</div></a>
<a href="https://github.com/123IdkGames456/FNAJ" target="_blank" rel="noopener"><div><div class="name">FNAJ GitHub</div><div class="url">github.com/123IdkGames456/FNAJ</div></div><div class="arrow">›</div></a>
</div>
</main>
</body>
</html>
