<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Image AI</title>
<style>body{margin:0;background:#111;color:#eee;font:15px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(900px,94vw);background:#191919;padding:20px;border-radius:18px}input{width:100%;box-sizing:border-box;background:#222;color:#fff;border:1px solid #444;border-radius:12px;padding:14px}button{margin-top:10px;padding:11px 16px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:700}img{display:block;max-width:100%;margin-top:18px;border-radius:14px}.status{opacity:.7}</style></head>
<body><main><h1>Local Image AI</h1><div class="status" id="status">Ready to load the browser image model.</div><input id="prompt" placeholder="Describe an image…"><button id="go">Generate Image</button><div id="out"></div></main>
<script type="module">
import {TextToImagePipeline} from "https://cdn.jsdelivr.net/npm/web-txt2img@0.1.0/dist/index.js";
const status=document.getElementById("status"),prompt=document.getElementById("prompt"),go=document.getElementById("go"),out=document.getElementById("out");
let pipe;
async function load(){try{pipe=await TextToImagePipeline.from_pretrained("sd-turbo");status.textContent="Model ready — image generation runs locally with WebGPU."}catch(e){status.textContent="Image model could not load: "+e.message}}
go.onclick=async()=>{if(!pipe||!prompt.value.trim())return;go.disabled=true;status.textContent="Generating…";out.innerHTML="";try{const result=await pipe.generate({prompt:prompt.value,width:512,height:512});const img=document.createElement("img");img.src=result.image instanceof Blob?URL.createObjectURL(result.image):result.image;out.appendChild(img);status.textContent="Done — generated locally."}catch(e){status.textContent="Generation failed: "+e.message}go.disabled=false};
load();
</script></body></html>
