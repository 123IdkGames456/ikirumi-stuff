<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE TORCHES WIND · THE HOLLOW COUNT</title>
  <style>
    /* ============================================================
       RESET & GLOBAL
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --text-size: 1.15rem;
      --line-height: 1.8;
      --word-spacing: 0.04em;
      --letter-spacing: 0.01em;
      --page-bg: #f8f4e9;
      --page-text: #1a1a1a;
      --accent: #8b2a1a;
      --gold: #b8952a;
      --card-bg: #ece4d4;
      --nav-bg: #1e1e2a;
      --nav-text: #f0e6d2;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
      margin: 0;
    }

    #book-container {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      max-height: 100vh;
      background: var(--page-bg);
      border-radius: 0;
      box-shadow: none;
      padding: 14px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
      overflow: hidden;
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    #nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 2px 64px 10px;
      border-bottom: 1px solid #d4c9b0;
      margin-bottom: 12px;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
      font-size: .7rem;
      color: #3d3d4a;
    }

    #page-indicator {
      font-weight: bold;
      background: var(--nav-bg);
      color: var(--nav-text);
      padding: 7px 15px;
      border-radius: 30px;
      letter-spacing: .7px;
      font-size: .72rem;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .nav-buttons { display: contents; }

    .nav-buttons button {
      position: fixed;
      z-index: 20;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 48px;
      height: 76px;
      padding: 0;
      border: 1px solid rgba(240,230,210,.18);
      border-radius: 14px;
      background: rgba(30,30,42,.88);
      color: var(--nav-text);
      box-shadow: 0 8px 26px rgba(0,0,0,.2);
      backdrop-filter: blur(10px);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s, opacity .2s, transform .2s;
    }

    #prev-btn { left: 12px; }
    #next-btn { right: 12px; }
    .nav-buttons button:hover { background: #48485c; transform: translateY(-50%) scale(1.04); }
    .nav-buttons button:active { transform: translateY(-50%) scale(.96); }
    .nav-buttons button:disabled { opacity: .2; cursor: not-allowed; box-shadow: none; }

    /* ============================================================
       SETTINGS PANEL (Page 1 only)
       ============================================================ */
    #settings-panel {
      background: linear-gradient(135deg, #f1e8d6, #e8ddc8);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 12px;
      flex-shrink: 0;
      border: 1px solid #c8bca4;
      box-shadow: 0 8px 24px rgba(69,48,20,.08);
      font-family: 'Courier New', monospace;
      font-size: .78rem;
      color: #2e2e3a;
    }

    #settings-panel .settings-title {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #0e0e10;
      letter-spacing: 0.5px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .setting-row label {
      min-width: 90px;
      font-weight: bold;
      font-size: 0.7rem;
      color: #3d3d4a;
    }

    .setting-row input[type="range"] {
      flex: 1;
      min-width: 80px;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
    }

    .setting-row .value-display {
      min-width: 42px;
      text-align: right;
      font-weight: bold;
      color: var(--accent);
      font-size: 0.7rem;
    }

    .setting-row .reset-btn {
      background: #d4c9b0;
      border: none;
      border-radius: 20px;
      padding: 4px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
      color: #2e2e3a;
      transition: background 0.2s;
    }

    .setting-row .reset-btn:hover { background: #c8bca4; }

    /* ============================================================
       PAGE CONTENT
       ============================================================ */
    #page-content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: var(--text-size);
      line-height: var(--line-height);
      word-spacing: var(--word-spacing);
      letter-spacing: var(--letter-spacing);
      color: var(--page-text);
      transition: opacity 0.1s;
      padding-right: 6px;
      scroll-behavior: smooth;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    #page-content p {
      margin-bottom: 0.8em;
      text-indent: 1.4em;
    }

    #page-content p:first-of-type { text-indent: 0; }

    #page-content h2 {
      font-size: 1.5em;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 0.4em 0;
      color: #0e0e10;
      text-indent: 0;
      border-left: 5px solid var(--gold);
      padding-left: 12px;
      line-height: 1.25;
    }

    #page-content h3 {
      font-size: 1.15em;
      font-weight: 600;
      margin: 1em 0 0.3em 0;
      color: #2a2a3a;
      text-indent: 0;
    }

    #page-content .divider {
      text-align: center;
      margin: 1.4em 0;
      color: #9a8e78;
      letter-spacing: 6px;
      font-size: 1em;
    }

    /* Marked word */
    .marked-word {
      background: #e8d48b;
      color: #0e0e10;
      padding: 0 3px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 0 1.5px #d4b85c;
      font-weight: 600;
    }

    .marked-word:hover { background: #f0e0a0; }

    /* ============================================================
       MARK HINT
       ============================================================ */
    #mark-hint {
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      color: #5a4e3e;
      background: #ece4d4;
      padding: 3px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 6px;
      letter-spacing: 0.2px;
      border: 1px solid #c8bca4;
      flex-shrink: 0;
      align-self: flex-start;
    }

    /* ============================================================
       COVER PAGE
       ============================================================ */
    .cover-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 10px;
      min-height: 100%;
    }

    .cover-content h1 {
      font-size: 2.6em;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #0e0e10;
      line-height: 1.15;
      margin-bottom: 0.2em;
      text-indent: 0;
      border: none;
      padding: 0;
    }

    .cover-content .subtitle {
      font-size: 1.1em;
      font-style: italic;
      color: #6a5e4e;
      margin-bottom: 1.6em;
      letter-spacing: 0.04em;
    }

    .cover-content .flame {
      font-size: 2.2em;
      margin: 0.2em 0 0.4em 0;
      color: var(--gold);
    }

    .cover-content .tagline {
      font-size: 0.95em;
      color: #3d3d4a;
      max-width: 460px;
      line-height: 1.7;
      margin-bottom: 1.4em;
      text-indent: 0;
    }

    .cover-content .divider {
      margin: 0.8em 0;
      color: #9a8e78;
      letter-spacing: 8px;
      font-size: 0.9em;
    }

    .cover-content .season-label {
      font-family: 'Courier New', monospace;
      font-size: 0.75em;
      letter-spacing: 3px;
      color: #8b7a5c;
      margin-top: 0.6em;
      text-transform: uppercase;
    }

    /* ============================================================
       TRAILER
       ============================================================ */
    .trailer-box {
      background: #14141e;
      color: #e8e0d0;
      padding: 14px 16px;
      border-radius: 12px;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
      font-size: 0.82em;
      line-height: 1.6;
      border: 2px solid #3a3a4e;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
    }

    .trailer-box h3 {
      color: var(--nav-text);
      font-size: 1.2em;
      margin-bottom: 0.3em;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
      font-family: 'Georgia', serif;
    }

    .trailer-box .trailer-line { margin: 5px 0; }
    .trailer-box em { color: var(--gold); font-style: normal; }

    /* ============================================================
       GUESSING GAME
       ============================================================ */
    .guess-section {
      background: var(--nav-bg);
      color: var(--nav-text);
      padding: 14px 16px;
      border-radius: 12px;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
      font-size: 0.82em;
    }

    .guess-section h2 {
      color: var(--nav-text);
      border-left-color: var(--accent);
      font-size: 1.2em;
    }

    .guess-section p {
      font-size: 0.82em;
      line-height: 1.5;
      margin-bottom: 10px;
      color: #c8c0b0;
      text-indent: 0;
    }

    .suspect-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
      margin: 8px 0 12px 0;
    }

    .suspect-btn {
      background: #2a2a3a;
      border: 2px solid #3a3a4e;
      color: var(--nav-text);
      padding: 6px 8px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.75em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .suspect-btn:hover { background: #3a3a4e; border-color: #6a6a7e; }

    .suspect-btn.selected {
      background: #4a3a2a;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold);
    }

    .suspect-btn .num {
      background: #0e0e10;
      padding: 1px 7px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.7em;
      color: var(--gold);
    }

    #guess-feedback {
      margin-top: 10px;
      background: #0e0e10;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78em;
      line-height: 1.5;
      color: #d4c8b0;
      border-left: 3px solid var(--accent);
      white-space: pre-wrap;
    }

    #guess-feedback .evidence-block {
      margin: 6px 0;
      padding: 6px 10px;
      background: #1a1a26;
      border-radius: 6px;
      border-left: 2px solid var(--gold);
      font-size: 0.95em;
    }

    #guess-feedback .evidence-block strong { color: var(--nav-text); }

    #reveal-btn {
      background: #8b2a1a;
      color: var(--nav-text);
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.8em;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }

    #reveal-btn:hover { background: #a83a2a; }
    #reveal-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .reveal-text {
      margin-top: 10px;
      padding: 12px 16px;
      background: #0e0e10;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      color: #e8e0d0;
      font-size: 0.8em;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .reveal-text .imposter-name {
      color: #e8a060;
      font-weight: bold;
      font-size: 1.1em;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px) {
      #book-container { padding: 10px 14px; }
      #page-content { font-size: var(--text-size); padding: 0 2px; }
      #page-content h2 { font-size: 1.2em; }
      .suspect-grid { grid-template-columns: 1fr 1fr; }
      #nav-bar { font-size: .6rem; padding: 2px 46px 10px; }
      .nav-buttons button { width: 34px; height: 58px; border-radius: 11px; font-size: .8rem; }
      #prev-btn { left: 4px; }
      #next-btn { right: 4px; }
      .setting-row { gap: 7px; }
      .setting-row label { min-width: 74px; font-size: .66rem; }
      .setting-row input[type="range"] { min-width: 70px; }
      .setting-row .value-display { min-width: 42px; font-size: .64rem; }
      #settings-panel { padding: 12px; font-size: .68rem; }
      #settings-panel .settings-title { font-size: .82rem; }
      .cover-content { padding: 14px 4px; }
      .cover-content h1 { font-size: 1.9em; }
      .cover-content .subtitle { font-size: .95em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    /* ============================================================
       SCROLLBAR
       ============================================================ */
    #page-content::-webkit-scrollbar { width: 5px; }
    #page-content::-webkit-scrollbar-track { background: #e8e0d0; border-radius: 10px; }
    #page-content::-webkit-scrollbar-thumb { background: #b8ac98; border-radius: 10px; }
    #page-content::-webkit-scrollbar-thumb:hover { background: #9a8e78; }
  
    /* Navigation stays in the reading flow, before and after the text */
    #book-container {
      width: 100%;
      max-width: 860px;
      min-height: 100dvh;
      height: auto;
      max-height: none;
      padding: 10px clamp(12px, 4vw, 28px) 18px;
      position: relative;
      overflow: visible;
    }
    #nav-bar {
      justify-content: center;
      padding: 2px 4px 9px;
      margin-bottom: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 10px 0;
    }
    .nav-buttons button {
      position: static;
      left: auto;
      top: auto;
      bottom: auto;
      transform: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: min(220px, 100%);
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(240,230,210,.2);
      border-radius: 24px;
      background: rgba(30,30,42,.97);
      color: var(--nav-text);
      box-shadow: 0 5px 18px rgba(0,0,0,.16);
      font: bold .78rem 'Courier New', monospace;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #prev-btn::after { content: 'PREVIOUS PAGE'; }
    #next-btn::after { content: 'NEXT PAGE'; }
    .nav-buttons button:hover { background: #48485c; transform: none; }
    .nav-buttons button:active { opacity: .8; }
    .nav-buttons button:disabled { opacity: .18; cursor: not-allowed; box-shadow: none; }
    #page-content {
      display: block;
      width: 100%;
      overflow: visible;
      overflow-wrap: anywhere;
      padding: 4px 4px 12px 2px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    #settings-panel {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 14px;
    }
    .setting-row { gap: 8px; }
    .setting-row input[type="range"] { min-width: 0; }
    @media (max-width: 600px) {
      #book-container { padding: 8px 12px 62px; }
      #nav-bar { padding: 2px 0 8px; margin-bottom: 7px; }
      #page-indicator { padding: 6px 12px; font-size: .68rem; }
      #prev-btn { top: 52px; }
      #next-btn { bottom: max(8px, env(safe-area-inset-bottom)); }
      .nav-buttons button { width: min(166px, calc(100vw - 48px)); min-height: 40px; font-size: .7rem; }
      #settings-panel { padding: 11px; font-size: .68rem; }
      #settings-panel .settings-title { font-size: .8rem; }
      .setting-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 44px; gap: 7px; }
      .setting-row label { min-width: 0; font-size: .63rem; }
      .setting-row input[type="range"] { width: 100%; min-width: 0; }
      .setting-row .value-display { min-width: 0; font-size: .61rem; }
      .cover-content { padding: 14px 4px; }
      .cover-content h1 { font-size: clamp(1.6em, 8vw, 2.1em); overflow-wrap: anywhere; }
      #page-content h2 { font-size: 1.25em; }
      #mark-hint { font-size: .57rem; max-width: 100%; }
    }

  </style>
</head>
<body>

<div id="book-container">

  <!-- NAVIGATION -->
  <div id="nav-bar">
    <span id="page-indicator">Page 1 / 21</span>
    <div class="nav-buttons">
      <button id="prev-btn" aria-label="Previous page">◀</button>
      <button id="next-btn" aria-label="Next page">▶</button>
    </div>
  </div>

  <!-- SETTINGS (Page 1 only — rendered dynamically) -->
  <div id="settings-panel" style="display:none;">
    <div class="settings-title">✦ READING SETTINGS</div>
    <div class="setting-row">
      <label for="text-size-slider">Text Size</label>
      <input type="range" id="text-size-slider" min="0.9" max="2.0" step="0.05" value="1.15">
      <span class="value-display" id="text-size-value">1.15rem</span>
    </div>
    <div class="setting-row">
      <label for="line-height-slider">Line Spacing</label>
      <input type="range" id="line-height-slider" min="1.2" max="2.8" step="0.05" value="1.8">
      <span class="value-display" id="line-height-value">1.8</span>
    </div>
    <div class="setting-row">
      <label for="word-spacing-slider">Word Spacing</label>
      <input type="range" id="word-spacing-slider" min="0" max="0.3" step="0.01" value="0.04">
      <span class="value-display" id="word-spacing-value">0.04em</span>
    </div>
    <div class="setting-row">
      <label for="letter-spacing-slider">Letter Spacing</label>
      <input type="range" id="letter-spacing-slider" min="0" max="0.12" step="0.005" value="0.01">
      <span class="value-display" id="letter-spacing-value">0.01em</span>
    </div>
    <div class="setting-row" style="justify-content:flex-end;">
      <button class="reset-btn" id="reset-settings">Reset</button>
    </div>
  </div>

  <!-- MARK HINT -->
  <div id="mark-hint" style="display:none;">✦ Click any word to mark your spot · only one mark at a time · saved automatically</div>

  <!-- PAGE CONTENT -->
  <div id="page-content"></div>

</div>

<script>
  // ============================================================
  //  THE TORCHES WIND — SEASON 1 BOOK DATA
  //  21 pages total (0–20)
  //  Page 0: Settings (only page with settings panel)
  //  Page 1: Cover / Front of Book
  //  Page 2–16: Episodes 1–15
  //  Page 17: Trailer Season 2
  //  Page 18: Guess the Imposters
  //  Page 19: Reveal (hidden)
  //  Page 20: End / Credits
  // ============================================================

  // THE TORCHES WIND — THE HOLLOW COUNT. Five chapters; culprit intentionally unrevealed.
  const PAGES = [];
  PAGES.push({type:'settings',title:'READING SETTINGS',body:`Adjust text size, line spacing, word spacing, and letter spacing below. Your reading position, marked word, and settings save automatically on this device. The mystery has no answer key: form your own theory from the evidence.`});
  PAGES.push({type:'cover',title:'THE TORCHES WIND',subtitle:'THE HOLLOW COUNT · FIVE CHAPTERS',body:`Twelve strangers wake beneath a hole in the sky. Two hidden roles. One Torch. A shop full of tools that tell only half the truth.\n\nA victim can be named. A shield can break. The attacker will never be announced.\n\nEvery clue is physical. Every note stays where it was placed. Every explanation has a second explanation.\n\nThe room counts twelve. The evidence remembers thirteen.\n\nRead carefully. Keep your own theory. The story will not tell you who the killer is.`});
  PAGES.push({type:'episode',title:"Chapter 1 — The Room That Counted Backwards",body:"At 6:17, the lights went out in Vey. They returned one second later, but every clock had lost eleven minutes. Nobody noticed until later. Nobody except Elian Voss, who was already standing in a room without a clock.\n\nHe woke on cold tile with the taste of copper in his mouth and the certainty that someone had interrupted him mid-sentence. Above him, a square hole opened into a paper-colored sky. Wind slipped through it, though there were no windows. At the room's center stood the Torch: black metal ribs around a white core, burning without heat.\n\nEleven others woke around him. Twelve people. Elian counted them twice, then counted their shadows. One person seemed to have none. When he blinked, the shadow returned.\n\nA voice began as a thin ringing, climbed until it hurt his teeth, then slowed into a whisper. “Welcome to the Hollow Count. Twelve entered. Two will act against the rest. You are not required to believe this. Belief is not a rule.”\n\nThe voice accelerated. “You may speak only during the voting window. At other times, communicate by writing notes and leaving them where another person can physically find them. Notes do not teleport. If one moves, someone moved it. If you did not see a note being placed, you do not know who wrote it.”\n\nThe rules continued in a pitch that kept changing. Attacking was permitted. Registered kills would be recorded, but the attacker would never be named. A victim would be announced. If a Kill Shield broke, the room would announce that too. Everyone began with one hundred Q Points. The shop sold tools, but their descriptions could be incomplete. At the end of each round, they could vote to remove one player. A tie meant another vote. Damaging the Torch or crossing an unapproved threshold meant immediate removal.\n\n“Rule six,” the voice whispered. “You will be told what happened. You will not necessarily be told what it means.”\n\nA wall opened into a shop. Food and water. Reinforced Fold, a small defense wall. Kill Shield, one blocked registered kill. Identity Lens, eighty points, ten seconds to scan, fifty-fifty chance of a true role result. Witness Glass, thirty-five points, showed the last person to cross a doorway—but the reflection might be delayed. Thread Compass, forty-five points, pointed toward the nearest room that had changed since the last dimming. Echo Chalk, twenty points, copied one sound onto a wall. Memory Token, fifty points, traded one remembered detail for one answer about a place, object, or event. And under a dark cloth: MURDERER TOOL, price zero.\n\n“Free means bait,” said Tamsin Reed, the woman in the yellow coat.\n\n“Or it means they want to know who touches it,” replied Pell, a quiet teenager with a shaved stripe in his hair.\n\nA man in a gray suit introduced himself as Silas Wren. He asked everyone what they remembered before waking, but never wrote down their answers. Orla Venn, a silver-haired archivist, recorded every word. Brant, broad-shouldered and angry, said the only trustworthy clue was one that cost someone something.\n\nElian bought the Thread Compass. Its needle spun, then pointed straight down at the floor beneath the Torch.\n\nAt the base of the Torch, someone had drawn twelve short lines in the dust. Eleven pointed inward. One pointed out. A new line appeared without a hand to draw it.\n\nOrla found a note under the shop. “We have played this round before. One of you remembers. One of you is lying about remembering.”\n\nBeneath the sentence, a number had been scratched out so hard the paper tore. The fibers slowly rearranged themselves.\n\nThe number was 4.\n\nElian's number.\n\nA narrow doorway appeared in the wall. Beyond it stood a chair, a glass of water, and a mirror covered with a sheet. Elian had never been inside that room. He knew the glass was already broken.\n\nFrom behind the wall came three knocks, then two.\n\nThe Torch pulsed. The first round had not officially begun. Yet the room had already placed Elian at the center of a question no one else could see."});
  PAGES.push({type:'episode',title:"Chapter 2 — The Shop of Almost-Answers",body:"The doorway vanished before anyone could agree to enter it. The shop remained, and the players gathered around it as if prices could make the place understandable. Each purchase left a receipt on the floor. The receipt named the item and the remaining balance, but never the buyer. Paper could be moved. Ink could not be changed.\n\nA receipt showed that someone had purchased Echo Chalk. Twenty points remained. That was not enough to identify the buyer; several balances could produce the same number. The chalk's empty slot sat beside the free Murderer Tool, whose cloth cover had shifted a few centimeters.\n\nTamsin insisted that no one touch it. Brant said refusing to touch it was also a choice. Pell asked why the voice had bothered to tell them that attacks were allowed if it planned to conceal the attacker. Silas answered gently: “Because it wants us to confuse an event with a conclusion.”\n\nElian did not like how reasonable Silas sounded.\n\nThe first new door appeared behind Orla. It was marked 6. A white thread hung from the handle, knotted twice. Elian's compass pointed at it. Orla wrote a warning on a sheet and placed it in front of the door: DO NOT ENTER ALONE. Nobody saw her write the last word. Brant had been watching the Torch; Silas had been watching Elian.\n\nThree sharp knocks sounded behind the door. Three seconds later, the same knocks repeated, with a faint scrape at the end. Pell suspected Echo Chalk. No one could prove it.\n\nThe Torch dimmed, opening the voting window. The voice announced a registered kill. No shield had broken. The victim was Player 8.\n\nOrla was Player 8.\n\nShe was still standing beside her note. She looked at the thread, then at the others. Her expression showed recognition before fear, as if the voice had read aloud something she already knew. “I didn't go through the door,” she said.\n\nOrla vanished without a sound. Her pencil rolled in a circle and stopped against the white thread.\n\nNo attacker was named. The voting window remained open.\n\nSilas suggested voting for whoever used the chalk. Tamsin pointed out that they did not know who bought it. Brant said the note might be bait. Pell argued that Orla could have been the target before they woke. Each theory made someone else look guilty.\n\nThe vote tied. Nobody was removed.\n\nWhen the Torch brightened, the thread was gone, but the note remained exactly where Orla had placed it. Beneath her warning, another sentence had appeared in unfamiliar handwriting: THE FIRST VICTIM WAS NOT THE FIRST TARGET.\n\nElian picked up the paper, folded it, and opened it again. The crease split the word FIRST down the middle. The paper remembered the fold. He wondered whether the room remembered the hand.\n\nA new item appeared on the shop shelf: Witness Glass. Its black surface reflected no face, only the ceiling. Its label had changed since the first time they read it: “Shows the last person to cross a doorway. Reflection may be delayed.”\n\nThe rules did not say how long the delay could be. They did not say whether the reflection could show someone who had not crossed yet. They did not say whether the person reflected was the same person who had crossed.\n\nThe second round ended without another victim. At the edge of the shop, a small receipt lay face down. Elian turned it over. It was blank except for one sentence written in Orla's neat hand:\n\nIF YOU FIND THIS BEFORE I DO, THEN I HAVE ALREADY BEEN HERE.\n\nHe looked around. Orla was gone. The note had been placed after her disappearance, but the handwriting belonged to her. Unless someone had copied it. Unless the paper had been waiting. Unless Orla had written it earlier and known where it would be found.\n\nThe room gave them facts, then built a maze around the meaning."});
  PAGES.push({type:'episode',title:"Chapter 3 — The Rooms That Remembered",body:"After Orla vanished, twelve narrow beds appeared beneath twelve lamps. Number 8's bed was neatly made, with a dent in the pillow as if someone had just risen. Nobody wanted to lie down. They took turns staying awake, though no one believed the schedule could be enforced.\n\nDuring the second watch, a library appeared behind a wall. Its shelves continued farther than the lamps could reach. Twelve gray books sat on the first shelf, each labeled with a player's number. Book 8 lay open. Inside were notes about Orla, the white thread, and the first vote. The handwriting changed every few pages: neat cursive, block capitals, then a pattern of marks that resembled a child's attempt at letters.\n\nThe final page said: ORLA WAS REMOVED BEFORE SHE COULD REMEMBER WHAT SHE REMEMBERED.\n\nPell shut the book. “Someone wants us to think her disappearance was planned.”\n\n“Maybe it was,” Elian said.\n\n“Or maybe this book was written afterward.”\n\nAt the end of the library, a door marked ARCHIVE opened into a room of file drawers. Each drawer had a date, mostly dates in the future. Elian found one marked with the current day. Inside lay a photograph of twelve people around the Torch. It was them—the same clothes, the same faces, even Brant's split eyebrow. But the photograph showed thirteen people. Orla stood at the back with her hand on the shoulder of a figure whose face had been scratched away.\n\nThe caption read: THE FIRST GROUP WAS NEVER TWELVE.\n\nPell wanted to take it to the others. Elian wanted to leave it in place. They wrote down every detail and returned the photograph to the drawer. When they looked again, the drawer's date had changed.\n\nIn the corridor outside, their reflections moved a fraction late. Pell raised a hand; his reflection followed. Elian turned away, but his reflection stayed facing forward. Then the reflection lifted one finger to its lips.\n\nA second door appeared in the reflective wall. No handle. A black circle where a keyhole might be. Elian's Thread Compass pointed at it so hard the needle bent.\n\nThey left a note: WE SAW THE REFLECTION MOVE FIRST. When they returned to the sleeping room, the note was already there, folded into a triangle. The writing was theirs. The paper smelled of smoke.\n\nA new shop item appeared: Memory Token. Fifty points. Trade one remembered detail for one answer about the current round. The answer could concern a place, object, or event, but it would not identify a player. The traded memory could never be recovered.\n\nBrant bought it. He traded the memory of his kitchen window. The blue glass clouded, and the voice of a child said, “The window was inside the house.”\n\n“That tells me nothing,” Brant snapped.\n\n“It tells you the answer was technically correct,” Tamsin said.\n\nA kitchen door appeared in the library. Through its window, they could see the Torch from the outside. Brant went pale. He recognized the chipped mug, the folded towel, and the crack in the lower pane. He swore he had never described them.\n\nA figure moved beyond the window and tapped three times, paused, then tapped twice—the same pattern heard behind Door 6.\n\nThe kitchen door closed. On the wall, a sentence appeared: THE MEMORY WAS NOT YOURS TO TRADE.\n\nNo victim was announced at the next vote. Instead, the voice said, “One room has been entered by a person who has not yet arrived.”\n\nElian's book had opened by itself. On the first page was a photograph of him standing in the Hollow Count before he had ever arrived. His mouth was open as if speaking. Beneath it: YOU HAVE ALREADY BROKEN THE RULE THAT HAS NOT BEEN SPOKEN YET.\n\nHe could not remember speaking. He could not remember the photograph being taken. He could not remember the sentence he had lost before waking.\n\nThe Torch dimmed, and one lamp remained lit above Book 4."});
  PAGES.push({type:'episode',title:"Chapter 4 — The Vote With No Accusation",body:"The next room held twelve chairs around a black glass table. The Torch showed through a narrow slit in the ceiling, its light stretched across the floor like a blade. The voice opened the voting window, and after hours of written notes the sudden sound of people talking felt almost obscene.\n\nBrant accused Silas of steering the group. Silas said the group had been steering itself. Tamsin asked who had bought the Echo Chalk. Pell asked why everyone assumed the chalk caused Orla's disappearance. Dev suggested that Orla might have been removed somewhere else and that the door was merely a distraction.\n\nElian laid the photograph on the table. “There were thirteen people in the first group.”\n\nSilas leaned forward. “Where did you get that?”\n\n“The archive.”\n\n“What archive?”\n\n“The room behind the library.”\n\n“There was no archive.”\n\n“There was when we found it.”\n\nSilas looked to Pell for confirmation. Pell said nothing. Beneath the glass table, a pale strip of paper drifted as if underwater.\n\nThe voice explained that a vote was an action, not a finding of fact. They voted. The result tied between Brant and Silas. They voted again. Another tie. A third vote began, and the Torch dimmed almost to darkness.\n\nThen the voice announced: “A shield has broken.”\n\nA line of gold light flashed across the table and dissolved. The voice added, “The shield owner remains alive. The shield was not purchased in this round.”\n\nNobody knew who owned it. Nobody knew who had been targeted. The rules had never said the attacker would be revealed if a shield blocked the kill. The group could not even be certain that the attacker knew a shield was present.\n\nA strip of paper lay beneath the empty chair. It had not been there when they sat down. The message read: THE SHIELD DID NOT SAVE THE PERSON IT WAS BOUGHT FOR.\n\n“That means the owner survived,” Brant said.\n\n“Or the shield was meant for someone else,” Tamsin replied.\n\n“Or the person it was bought for isn't one of us,” Pell added.\n\nA passage lined with five mirrors appeared. Each mirror was labeled BEFORE, DURING, AFTER, INSTEAD, or NEVER. The Witness Glass rested on a pedestal. The label now read: “The reflection may be delayed.”\n\nThe BEFORE mirror showed an empty passage. DURING showed an empty passage. AFTER showed Tamsin crossing the doorway, although she had not moved. INSTEAD showed Silas crossing with one hand hidden in his sleeve. NEVER showed Silas standing still, facing away.\n\n“This proves nothing,” Silas said.\n\n“It proves the glass can show several versions of a moment,” Elian answered.\n\nThe Thread Compass pointed at the empty air between them. All five mirrors flickered at once. For one instant, they showed thirteen people around the Torch. Orla was there. So was the scratched-out figure from the photograph. Someone stood behind Elian, close enough that their faces almost touched.\n\nElian turned. Nobody was there.\n\nThe voice returned in a quiet register. “Some of you search for the person who caused the event. Some search for the person who benefited. Some search for the person who knew it would happen. These are three different searches.”\n\nA card appeared on the pedestal: twelve empty circles and one filled circle marked 13. The filled circle had been crossed out. On the reverse, in Orla's handwriting: IF YOU CAN READ THIS, I WAS NOT THE FIRST TO DISAPPEAR.\n\nElian put the card in his pocket. Behind the mirror marked NEVER came three knocks, a pause, then two. From the other side, someone answered with two knocks, a pause, then three.\n\nThe vote ended with no removal. The room had provided five possible reflections, one broken shield, and a message that could mean almost anything. Everyone left with a different suspect. Everyone had a reason to distrust their own conclusion."});
  PAGES.push({type:'episode',title:"Chapter 5 — The Thirteenth Place",body:"By the fifth round, they had begun recording timestamps beside every note. The timestamps contradicted one another. A message written after the Torch dimmed appeared to have been placed before it. A receipt showed a purchase no one remembered seeing. The Thread Compass pointed toward rooms that had not yet appeared.\n\nThe Hollow Count was not becoming more chaotic. It was measuring the difference between what happened and what the players believed had happened.\n\nThey built a wall chart with three columns: CONFIRMED, CLAIMED, and POSSIBLE. Confirmed facts were few. Orla had been named as a victim. No attacker had been named. A shield had broken and its owner remained alive. The photograph showed thirteen people. A note had appeared with Elian's number before he understood why. The compass pointed toward changing spaces, but nobody knew what counted as a change.\n\nEverything else belonged in the other columns.\n\nThe shop opened with new items. Second Voice cost fifty-five points and could play a recorded sentence in the buyer's own voice, without identifying the owner. Door Nail cost thirty points and held a doorway open for one minute, even if the room tried to remove it. Empty Receipt cost ten points and proved that an item had not been purchased, but did not prove who could have bought it.\n\n“Every tool makes a fact less useful,” Tamsin said.\n\n“Or makes a lie more expensive,” Pell replied.\n\nElian bought the Door Nail and fixed it beside the black-circle door. Beyond it was a room resembling the original chamber, but the Torch was missing. Thirteen chairs stood inside. Twelve faced inward. One faced the wall.\n\nA list of names hung above the thirteenth chair. All twelve players were listed, each beside a date. Orla's date was years earlier than the others. The thirteenth place had no name, only a question mark.\n\nA speaker clicked on. A normal human voice, tired and close to the microphone, said: “If you're hearing this, the round has already started. Don't trust the first count. Don't trust the second count either. The room can count people who aren't present and ignore people who are. The game does not need a thirteenth player. It needs the idea of one.”\n\nThe recording ended. They could not tell who had made it or when. The Door Nail bent. Elian pulled it free, and the room vanished.\n\nBack at the wall chart, someone had added a line under CONFIRMED: THE KILLER IS NOT THE ONLY PERSON WHO CAN MAKE A VICTIM DISAPPEAR.\n\nThe voting window opened. The voice announced a registered kill had been attempted and failed. A shield had broken. The owner remained alive. No one vanished.\n\nThe group argued. Brant wanted to vote for Silas because of the mirror. Tamsin accused Brant of hiding what the Memory Token had taken from him. Silas argued that a reflection was not a confession. Pell asked why Brant still carried the cracked token if its answer had been useless. Brant replied, “Because I want to remember what it cost me.”\n\nThe vote tied. Nobody was removed.\n\nThe lights went out for three seconds. Elian felt a paper placed in his hand. When the lights returned, everyone was still there. The note said: YOU ARE ALLOWED TO GUESS. YOU ARE NOT ALLOWED TO BE CERTAIN.\n\nUnderneath were two empty circles and twelve names in a different order from the wall chart. Read in one direction, the first letters spelled nothing. Read in reverse, nothing. Read by the dates, they formed a word Elian almost recognized, then lost as soon as he tried to say it.\n\nHe looked at the twelve faces. Every person had done something suspicious. Every person had also done something that might be innocent. The clues did not point cleanly to one pair. They formed a web, and every thread passed through more than one hand.\n\nElian wrote two names on the back of the note and folded it away. His guess was not a verdict. He would not let the room turn it into one.\n\nAcross the chamber, Silas watched him—or perhaps watched the Torch, or perhaps the place where the thirteenth chair had been.\n\nThe floor beneath that place gave one quiet knock. Then another. Then three more.\n\nThe voice spoke one final time: “Five chapters. Twelve players. Two hidden roles. No answer key.”\n\nThe Torch dimmed.\n\n“Make your guess.”\n\nAnd in the silence that followed, someone, somewhere in the room, laughed exactly once."});
  PAGES.push({type:'guess',title:'YOUR CASE BOARD — GUESS THE TWO HIDDEN ROLES',body:'Choose two suspects and compare the clues. There is deliberately no correct-answer reveal.',suspects:[{num:1,name:'Elian Voss'},{num:2,name:'Silas Wren'},{num:3,name:'Tamsin Reed'},{num:4,name:'Pell'},{num:5,name:'Brant'},{num:6,name:'Yara'},{num:7,name:'Dev'},{num:8,name:'Orla Venn'},{num:9,name:'The Unnamed Thirteenth'},{num:10,name:'The Person in the Reflection'},{num:11,name:'The Voice'},{num:12,name:'The Person Who Left the First Note'}]});

  PAGES.push({type:'end',title:'THE COUNT CONTINUES',body:`Five chapters. Twelve players. Two hidden roles. No official solution.\n\nThe reader is the detective. The clues are part of the story. The story will not confirm your answer.\n\nThe Torch is still burning. The thirteenth place is still empty. And somewhere, a note is waiting to be found.`});
  // ============================================================
  //  STATE & PERSISTENCE
  // ============================================================

  const STORAGE_KEY_PAGE = 'torches-wind-hollow-count-page';
  const STORAGE_KEY_MARK = 'torches-wind-hollow-count-mark';
  const STORAGE_KEY_SETTINGS = 'torches-wind-settings';

  let currentPage = 0;
  let markedWordData = null;

  function loadState() {
    try {
      const savedPage = localStorage.getItem(STORAGE_KEY_PAGE);
      if (savedPage !== null) {
        const p = parseInt(savedPage, 10);
        if (!isNaN(p) && p >= 0 && p < PAGES.length) {
          currentPage = p;
        }
      }
      const savedMark = localStorage.getItem(STORAGE_KEY_MARK);
      if (savedMark) {
        const parsed = JSON.parse(savedMark);
        if (parsed && typeof parsed.page === 'number' && typeof parsed.wordIndex === 'number') {
          markedWordData = parsed;
        }
      }
    } catch (e) {}
  }

  function savePage() {
    try { localStorage.setItem(STORAGE_KEY_PAGE, String(currentPage)); } catch (e) {}
  }

  function saveMark() {
    try {
      if (markedWordData) {
        localStorage.setItem(STORAGE_KEY_MARK, JSON.stringify(markedWordData));
      } else {
        localStorage.removeItem(STORAGE_KEY_MARK);
      }
    } catch (e) {}
  }

  function loadSettings() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (saved) {
        const s = JSON.parse(saved);
        if (s.textSize) {
          document.documentElement.style.setProperty('--text-size', s.textSize);
          document.getElementById('text-size-slider').value = parseFloat(s.textSize);
          document.getElementById('text-size-value').textContent = s.textSize;
        }
        if (s.lineHeight) {
          document.documentElement.style.setProperty('--line-height', s.lineHeight);
          document.getElementById('line-height-slider').value = parseFloat(s.lineHeight);
          document.getElementById('line-height-value').textContent = s.lineHeight;
        }
        if (s.wordSpacing) {
          document.documentElement.style.setProperty('--word-spacing', s.wordSpacing);
          document.getElementById('word-spacing-slider').value = parseFloat(s.wordSpacing);
          document.getElementById('word-spacing-value').textContent = s.wordSpacing;
        }
        if (s.letterSpacing) {
          document.documentElement.style.setProperty('--letter-spacing', s.letterSpacing);
          document.getElementById('letter-spacing-slider').value = parseFloat(s.letterSpacing);
          document.getElementById('letter-spacing-value').textContent = s.letterSpacing;
        }
      }
    } catch (e) {}
  }

  function saveSettings() {
    try {
      const s = {
        textSize: document.getElementById('text-size-value').textContent,
        lineHeight: document.getElementById('line-height-value').textContent,
        wordSpacing: document.getElementById('word-spacing-value').textContent,
        letterSpacing: document.getElementById('letter-spacing-value').textContent
      };
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(s));
    } catch (e) {}
  }

  // ============================================================
  //  SETTINGS SLIDERS
  // ============================================================

  document.getElementById('text-size-slider').addEventListener('input', function() {
    const val = this.value + 'rem';
    document.documentElement.style.setProperty('--text-size', val);
    document.getElementById('text-size-value').textContent = val;
    saveSettings();
  });

  document.getElementById('line-height-slider').addEventListener('input', function() {
    const val = this.value;
    document.documentElement.style.setProperty('--line-height', val);
    document.getElementById('line-height-value').textContent = val;
    saveSettings();
  });

  document.getElementById('word-spacing-slider').addEventListener('input', function() {
    const val = this.value + 'em';
    document.documentElement.style.setProperty('--word-spacing', val);
    document.getElementById('word-spacing-value').textContent = val;
    saveSettings();
  });

  document.getElementById('letter-spacing-slider').addEventListener('input', function() {
    const val = this.value + 'em';
    document.documentElement.style.setProperty('--letter-spacing', val);
    document.getElementById('letter-spacing-value').textContent = val;
    saveSettings();
  });

  document.getElementById('reset-settings').addEventListener('click', function() {
    document.documentElement.style.setProperty('--text-size', '1.15rem');
    document.documentElement.style.setProperty('--line-height', '1.8');
    document.documentElement.style.setProperty('--word-spacing', '0.04em');
    document.documentElement.style.setProperty('--letter-spacing', '0.01em');
    document.getElementById('text-size-slider').value = '1.15';
    document.getElementById('line-height-slider').value = '1.8';
    document.getElementById('word-spacing-slider').value = '0.04';
    document.getElementById('letter-spacing-slider').value = '0.01';
    document.getElementById('text-size-value').textContent = '1.15rem';
    document.getElementById('line-height-value').textContent = '1.8';
    document.getElementById('word-spacing-value').textContent = '0.04em';
    document.getElementById('letter-spacing-value').textContent = '0.01em';
    saveSettings();
  });

  // ============================================================
  //  RENDER
  // ============================================================

  const pageContentEl = document.getElementById('page-content');
  const pageIndicatorEl = document.getElementById('page-indicator');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const settingsPanelEl = document.getElementById('settings-panel');
  const markHintEl = document.getElementById('mark-hint');

  function renderPage() {
    const page = PAGES[currentPage];
    pageContentEl.innerHTML = '';
    pageContentEl.style.opacity = '0';

    // Reading controls are available only on the first page.
    const isFirstPage = currentPage === 0;
    settingsPanelEl.style.display = isFirstPage ? 'block' : 'none';
    markHintEl.style.display = isFirstPage ? 'none' : 'block';

    setTimeout(() => {
      if (page.type === 'settings') {
        renderSettingsPage(page);
      } else if (page.type === 'cover') {
        renderCoverPage(page);
      } else if (page.type === 'episode') {
        renderEpisodePage(page);
      } else if (page.type === 'trailer') {
        renderTrailerPage(page);
      } else if (page.type === 'guess') {
        renderGuessPage(page);
      } else if (page.type === 'reveal') {
        renderRevealPage(page);
      } else if (page.type === 'end') {
        renderEndPage(page);
      }
      pageContentEl.style.opacity = '1';
    }, 40);

    pageIndicatorEl.textContent = `Page ${currentPage + 1} / ${PAGES.length}`;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage === PAGES.length - 1;

    setTimeout(() => { restoreMark(); }, 60);
  }

  // ---- SETTINGS PAGE ----
  function renderSettingsPage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const bodyDiv = document.createElement('div');
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    pageContentEl.appendChild(wrapper);
  }

  // ---- COVER PAGE ----
  function renderCoverPage(page) {
    const wrapper = document.createElement('div');
    wrapper.className = 'cover-content';
    const h1 = document.createElement('h1');
    h1.textContent = page.title;
    wrapper.appendChild(h1);
    const sub = document.createElement('div');
    sub.className = 'subtitle';
    sub.textContent = page.subtitle;
    wrapper.appendChild(sub);
    const flame = document.createElement('div');
    flame.className = 'flame';
    flame.textContent = '✦';
    wrapper.appendChild(flame);
    const bodyDiv = document.createElement('div');
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      p.style.textIndent = '0';
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    const seasonLabel = document.createElement('div');
    seasonLabel.className = 'season-label';
    seasonLabel.textContent = 'THE HOLLOW COUNT · FIVE CHAPTERS';
    wrapper.appendChild(seasonLabel);
    pageContentEl.appendChild(wrapper);
  }

  // ---- EPISODE PAGE ----
  function renderEpisodePage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'episode-body';
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    pageContentEl.appendChild(wrapper);
  }

  // ---- TRAILER PAGE ----
  function renderTrailerPage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const box = document.createElement('div');
    box.className = 'trailer-box';
    const lines = page.body.split('\n');
    lines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'trailer-line';
      div.textContent = line;
      box.appendChild(div);
    });
    wrapper.appendChild(box);
    pageContentEl.appendChild(wrapper);
  }

  // ---- GUESS PAGE ----
  function renderGuessPage(page) {
    const wrapper = document.createElement('div');
    wrapper.className = 'guess-section';
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const p = document.createElement('p');
    p.textContent = 'Select two suspects to compare clues. There is deliberately no correct-answer reveal.';
    wrapper.appendChild(p);
    const grid = document.createElement('div');
    grid.className = 'suspect-grid';
    const selected = new Set();
    page.suspects.forEach(suspect => {
      const btn = document.createElement('button');
      btn.className = 'suspect-btn';
      btn.dataset.num = suspect.num;
      btn.innerHTML = `<span class="num">${suspect.num}</span> ${escapeHTML(suspect.name)}`;
      btn.addEventListener('click', () => {
        if (selected.has(suspect.num)) {
          selected.delete(suspect.num);
          btn.classList.remove('selected');
        } else {
          if (selected.size >= 2) {
            const first = selected.values().next().value;
            selected.delete(first);
            const firstBtn = grid.querySelector(`[data-num="${first}"]`);
            if (firstBtn) firstBtn.classList.remove('selected');
          }
          selected.add(suspect.num);
          btn.classList.add('selected');
        }
        updateFeedback();
      });
      grid.appendChild(btn);
    });
    wrapper.appendChild(grid);
    const feedback = document.createElement('div');
    feedback.id = 'guess-feedback';
    feedback.textContent = 'Select two players to see the evidence.';
    wrapper.appendChild(feedback);
    const revealBtn = document.createElement('button');
    revealBtn.id = 'reveal-btn';
    revealBtn.textContent = 'KEEP MY THEORY — NO ANSWER KEY';
    revealBtn.style.display = 'none';
    revealBtn.addEventListener('click', () => {
      currentPage = PAGES.findIndex(p => p.type === 'reveal');
      savePage();
      renderPage();
    });
    wrapper.appendChild(revealBtn);
    pageContentEl.appendChild(wrapper);

    const evidenceData = {
      1: 'Elian receives a note marked with his own number before he understands the room. His compass points toward changing spaces, but once points toward Silas and once toward an empty place.',
      2: 'Silas asks careful questions and frames theories as facts. The Witness Glass shows a version of him crossing a doorway, but another mirror shows him never crossing it.',
      3: 'Tamsin distrusts the free Murderer Tool and spots how fear can be manufactured. She also writes the watch schedule, so she knows where everyone claims to be.',
      4: 'Pell notices the Echo Chalk possibility before anyone can prove who bought it. He separates facts from theories, but knows which details the room can exploit.',
      5: 'Brant trades a memory for an answer and keeps the cracked Memory Token. The kitchen resembles his own, although he insists he never described all its details.',
      6: 'Yara challenges the assumptions behind the votes. She notices that a shield announcement does not establish who was targeted or who knew about it.',
      7: 'Dev argues that a victim may have been removed from a different place than the group assumes. He remembers nothing before waking.',
      8: 'Orla is the first named victim, but her notes suggest she expected a disappearance. The archive claims she was part of an earlier count.',
      9: 'The thirteenth person appears in the photograph and archive, but no one can prove that this person is alive, dead, or even a player.',
      10: 'The reflection behaves independently and may be a tool, a recording, a room effect, or a person using the mirrors.',
      11: 'The voice knows about attempts, shields, and hidden roles, but withholds the attacker. It may control the game—or repeat information from another source.',
      12: 'The first note appears after the players wake, but its paper and handwriting suggest an earlier history. The person who placed it may not be the person who wrote it.'
    };

    function updateFeedback() {
      if (selected.size < 2) {
        feedback.textContent = 'Select two players to see the evidence.';
        revealBtn.style.display = 'none';
        return;
      }
      const nums = Array.from(selected);
      let html = '';
      nums.forEach(num => {
        const suspect = page.suspects.find(s => s.num === num);
        html += `<div class="evidence-block"><strong>Player ${num} — ${escapeHTML(suspect.name)}:</strong><br>${escapeHTML(evidenceData[num])}</div>`;
      });
      html += '<div style="margin-top:10px;font-size:0.85em;color:#9a8e78;">This is evidence, not proof. Not everyone is an Imposter. Only two are.</div>';
      feedback.innerHTML = html;
      revealBtn.style.display = 'inline-block';
    }
  }

  // ---- REVEAL PAGE ----
  function renderRevealPage(page) {
    const wrapper = document.createElement('div');
    wrapper.className = 'guess-section';
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const p = document.createElement('p');
    p.textContent = page.body;
    wrapper.appendChild(p);
    const reminder = document.createElement('p');
    reminder.textContent = 'No killer identity is stored in this reader. Your conclusion belongs to you.';
    wrapper.appendChild(reminder);
    const backBtn = document.createElement('button');
    backBtn.textContent = '← BACK TO CASE BOARD';
    backBtn.style.cssText = 'background:#2a2a3a;color:#f0e6d2;border:none;padding:10px 24px;border-radius:30px;font-family:"Courier New",monospace;font-weight:bold;font-size:0.85em;cursor:pointer;margin-top:16px;';
    backBtn.addEventListener('click', () => {
      currentPage = PAGES.findIndex(p => p.type === 'guess');
      savePage();
      renderPage();
    });
    wrapper.appendChild(backBtn);
    pageContentEl.appendChild(wrapper);
  }

  // ---- END PAGE ----
  function renderEndPage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'episode-body';
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    pageContentEl.appendChild(wrapper);
  }

  // ============================================================
  //  WORD MARKING
  // ============================================================

  function getAllTextNodes() {
    const nodes = [];
    const walker = document.createTreeWalker(
      pageContentEl,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: (node) => {
          if (node.parentElement.closest('button, .suspect-btn, .marked-word')) {
            return NodeFilter.FILTER_REJECT;
          }
          if (node.textContent.trim().length === 0) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );
    let node;
    while (node = walker.nextNode()) {
      nodes.push(node);
    }
    return nodes;
  }

  pageContentEl.addEventListener('click', (e) => {
    const target = e.target;
    if (target.classList.contains('marked-word')) {
      unmarkWord();
      return;
    }
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    let range = selection.getRangeAt(0);
    if (!range || range.collapsed) {
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(e.clientX, e.clientY);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
        if (pos) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.setEnd(pos.offsetNode, pos.offset);
        }
      }
    }
    if (!range) return;
    const textNode = range.startContainer;
    if (textNode.nodeType !== Node.TEXT_NODE) return;
    if (textNode.parentElement.closest('button, .suspect-btn, .guess-section, .trailer-box, .reveal-text')) {
      return;
    }
    const text = textNode.textContent;
    const offset = range.startOffset;
    let start = offset;
    let end = offset;
    while (start > 0 && /\S/.test(text[start - 1])) start--;
    while (end < text.length && /\S/.test(text[end])) end++;
    if (start === end) return;
    const word = text.slice(start, end);
    if (!word.trim()) return;
    unmarkWord();
    const before = text.slice(0, start);
    const after = text.slice(end);
    const parent = textNode.parentNode;
    const span = document.createElement('span');
    span.className = 'marked-word';
    span.textContent = word;
    const wordIndex = getWordIndexInPage(word, textNode);
    markedWordData = { page: currentPage, wordIndex: wordIndex, word: word };
    const frag = document.createDocumentFragment();
    if (before) frag.appendChild(document.createTextNode(before));
    frag.appendChild(span);
    if (after) frag.appendChild(document.createTextNode(after));
    parent.replaceChild(frag, textNode);
    saveMark();
  });

  function getWordIndexInPage(word, textNode) {
    const allText = pageContentEl.textContent;
    const beforeText = allText.substring(0, allText.indexOf(word));
    return beforeText.split(/\s+/).length;
  }

  function unmarkWord() {
    const existing = pageContentEl.querySelector('.marked-word');
    if (existing) {
      const parent = existing.parentNode;
      const text = existing.textContent;
      const textNode = document.createTextNode(text);
      parent.replaceChild(textNode, existing);
      parent.normalize();
    }
    markedWordData = null;
    saveMark();
  }

  function restoreMark() {
    if (!markedWordData || markedWordData.page !== currentPage) return;
    const word = markedWordData.word;
    if (!word) return;
    const textNodes = getAllTextNodes();
    let found = false;
    for (const node of textNodes) {
      const text = node.textContent;
      const index = text.indexOf(word);
      if (index !== -1) {
        const before = text.slice(0, index);
        const after = text.slice(index + word.length);
        const span = document.createElement('span');
        span.className = 'marked-word';
        span.textContent = word;
        const parent = node.parentNode;
        const frag = document.createDocumentFragment();
        if (before) frag.appendChild(document.createTextNode(before));
        frag.appendChild(span);
        if (after) frag.appendChild(document.createTextNode(after));
        parent.replaceChild(frag, node);
        found = true;
        break;
      }
    }
    if (!found) {
      markedWordData = null;
      saveMark();
    }
  }

  // ============================================================
  //  UTILITIES
  // ============================================================

  function escapeHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ============================================================
  //  NAVIGATION
  // ============================================================

  function goToPage(index) {
    if (index < 0 || index >= PAGES.length) return;
    currentPage = index;
    savePage();
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    else if (e.key === 'ArrowRight') goToPage(currentPage + 1);
  });

  // ============================================================
  //  INIT
  // ============================================================

  loadSettings();
  loadState();
  renderPage();

</script>
