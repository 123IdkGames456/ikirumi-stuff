<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE TORCHES WIND · THE HOLLOW COUNT</title>
  <style>
    /* ============================================================
       RESET & GLOBAL
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --text-size: 1.15rem;
      --line-height: 1.8;
      --word-spacing: 0.04em;
      --letter-spacing: 0.01em;
      --page-bg: #f8f4e9;
      --page-text: #1a1a1a;
      --accent: #8b2a1a;
      --gold: #b8952a;
      --card-bg: #ece4d4;
      --nav-bg: #1e1e2a;
      --nav-text: #f0e6d2;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
      margin: 0;
    }

    #book-container {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      max-height: 100vh;
      background: var(--page-bg);
      border-radius: 0;
      box-shadow: none;
      padding: 14px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
      overflow: hidden;
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    #nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 2px 64px 10px;
      border-bottom: 1px solid #d4c9b0;
      margin-bottom: 12px;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
      font-size: .7rem;
      color: #3d3d4a;
    }

    #page-indicator {
      font-weight: bold;
      background: var(--nav-bg);
      color: var(--nav-text);
      padding: 7px 15px;
      border-radius: 30px;
      letter-spacing: .7px;
      font-size: .72rem;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .nav-buttons { display: contents; }

    .nav-buttons button {
      position: fixed;
      z-index: 20;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 48px;
      height: 76px;
      padding: 0;
      border: 1px solid rgba(240,230,210,.18);
      border-radius: 14px;
      background: rgba(30,30,42,.88);
      color: var(--nav-text);
      box-shadow: 0 8px 26px rgba(0,0,0,.2);
      backdrop-filter: blur(10px);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s, opacity .2s, transform .2s;
    }

    #prev-btn { left: 12px; }
    #next-btn { right: 12px; }
    .nav-buttons button:hover { background: #48485c; transform: translateY(-50%) scale(1.04); }
    .nav-buttons button:active { transform: translateY(-50%) scale(.96); }
    .nav-buttons button:disabled { opacity: .2; cursor: not-allowed; box-shadow: none; }

    /* ============================================================
       SETTINGS PANEL (Page 1 only)
       ============================================================ */
    #settings-panel {
      background: linear-gradient(135deg, #f1e8d6, #e8ddc8);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 12px;
      flex-shrink: 0;
      border: 1px solid #c8bca4;
      box-shadow: 0 8px 24px rgba(69,48,20,.08);
      font-family: 'Courier New', monospace;
      font-size: .78rem;
      color: #2e2e3a;
    }

    #settings-panel .settings-title {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #0e0e10;
      letter-spacing: 0.5px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .setting-row label {
      min-width: 90px;
      font-weight: bold;
      font-size: 0.7rem;
      color: #3d3d4a;
    }

    .setting-row input[type="range"] {
      flex: 1;
      min-width: 80px;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
    }

    .setting-row .value-display {
      min-width: 42px;
      text-align: right;
      font-weight: bold;
      color: var(--accent);
      font-size: 0.7rem;
    }

    .setting-row .reset-btn {
      background: #d4c9b0;
      border: none;
      border-radius: 20px;
      padding: 4px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
      color: #2e2e3a;
      transition: background 0.2s;
    }

    .setting-row .reset-btn:hover { background: #c8bca4; }

    .cloud-save { margin-top: 12px; padding-top: 12px; border-top: 1px solid #c8bca4; font-family: 'Courier New', monospace; font-size: .7rem; }
    .cloud-save label { display:block; margin:8px 0 4px; font-weight:bold; }
    .cloud-save input { width:100%; min-width:0; padding:9px 10px; border:1px solid #b8ac98; border-radius:8px; background:#fffaf0; color:#24242b; font: .72rem 'Courier New',monospace; }
    .cloud-row { display:flex; gap:7px; align-items:center; margin-top:7px; flex-wrap:wrap; }
    .cloud-row input { flex:1; }
    #cloud-status { margin-top:8px; line-height:1.45; overflow-wrap:anywhere; color:#514536; }
    .cloud-row button { min-height:34px; }
    /* ============================================================
       PAGE CONTENT
       ============================================================ */
    #page-content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: var(--text-size);
      line-height: var(--line-height);
      word-spacing: var(--word-spacing);
      letter-spacing: var(--letter-spacing);
      color: var(--page-text);
      transition: opacity 0.1s;
      padding-right: 6px;
      scroll-behavior: smooth;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    #page-content p {
      margin-bottom: 0.8em;
      text-indent: 1.4em;
    }

    #page-content p:first-of-type { text-indent: 0; }

    #page-content h2 {
      font-size: 1.5em;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 0.4em 0;
      color: #0e0e10;
      text-indent: 0;
      border-left: 5px solid var(--gold);
      padding-left: 12px;
      line-height: 1.25;
    }

    #page-content h3 {
      font-size: 1.15em;
      font-weight: 600;
      margin: 1em 0 0.3em 0;
      color: #2a2a3a;
      text-indent: 0;
    }

    #page-content .divider {
      text-align: center;
      margin: 1.4em 0;
      color: #9a8e78;
      letter-spacing: 6px;
      font-size: 1em;
    }

    /* Marked word */
    .marked-word {
      background: #e8d48b;
      color: #0e0e10;
      padding: 0 3px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 0 1.5px #d4b85c;
      font-weight: 600;
    }

    .marked-word:hover { background: #f0e0a0; }

    /* ============================================================
       MARK HINT
       ============================================================ */
    #mark-hint {
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      color: #5a4e3e;
      background: #ece4d4;
      padding: 3px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 6px;
      letter-spacing: 0.2px;
      border: 1px solid #c8bca4;
      flex-shrink: 0;
      align-self: flex-start;
    }


    @media (max-width:600px) {
    }

    /* ============================================================
       COVER PAGE
       ============================================================ */
    .cover-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 10px;
      min-height: 100%;
    }

    .cover-content h1 {
      font-size: 2.6em;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #0e0e10;
      line-height: 1.15;
      margin-bottom: 0.2em;
      text-indent: 0;
      border: none;
      padding: 0;
    }

    .cover-content .subtitle {
      font-size: 1.1em;
      font-style: italic;
      color: #6a5e4e;
      margin-bottom: 1.6em;
      letter-spacing: 0.04em;
    }

    .cover-content .flame {
      font-size: 2.2em;
      margin: 0.2em 0 0.4em 0;
      color: var(--gold);
    }

    .cover-content .tagline {
      font-size: 0.95em;
      color: #3d3d4a;
      max-width: 460px;
      line-height: 1.7;
      margin-bottom: 1.4em;
      text-indent: 0;
    }

    .cover-content .divider {
      margin: 0.8em 0;
      color: #9a8e78;
      letter-spacing: 8px;
      font-size: 0.9em;
    }

    .cover-content .season-label {
      font-family: 'Courier New', monospace;
      font-size: 0.75em;
      letter-spacing: 3px;
      color: #8b7a5c;
      margin-top: 0.6em;
      text-transform: uppercase;
    }

    /* ============================================================
       TRAILER
       ============================================================ */
    .trailer-box {
      background: #14141e;
      color: #e8e0d0;
      padding: 14px 16px;
      border-radius: 12px;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
      font-size: 0.82em;
      line-height: 1.6;
      border: 2px solid #3a3a4e;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
    }

    .trailer-box h3 {
      color: var(--nav-text);
      font-size: 1.2em;
      margin-bottom: 0.3em;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
      font-family: 'Georgia', serif;
    }

    .trailer-box .trailer-line { margin: 5px 0; }
    .trailer-box em { color: var(--gold); font-style: normal; }

    /* ============================================================
       GUESSING GAME
       ============================================================ */
    .guess-section {
      background: var(--nav-bg);
      color: var(--nav-text);
      padding: 14px 16px;
      border-radius: 12px;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
      font-size: 0.82em;
    }

    .guess-section h2 {
      color: var(--nav-text);
      border-left-color: var(--accent);
      font-size: 1.2em;
    }

    .guess-section p {
      font-size: 0.82em;
      line-height: 1.5;
      margin-bottom: 10px;
      color: #c8c0b0;
      text-indent: 0;
    }

    .suspect-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
      margin: 8px 0 12px 0;
    }

    .suspect-btn {
      background: #2a2a3a;
      border: 2px solid #3a3a4e;
      color: var(--nav-text);
      padding: 6px 8px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.75em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .suspect-btn:hover { background: #3a3a4e; border-color: #6a6a7e; }

    .suspect-btn.selected {
      background: #4a3a2a;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold);
    }

    .suspect-btn .num {
      background: #0e0e10;
      padding: 1px 7px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.7em;
      color: var(--gold);
    }

    #guess-feedback {
      margin-top: 10px;
      background: #0e0e10;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78em;
      line-height: 1.5;
      color: #d4c8b0;
      border-left: 3px solid var(--accent);
      white-space: pre-wrap;
    }

    #guess-feedback .evidence-block {
      margin: 6px 0;
      padding: 6px 10px;
      background: #1a1a26;
      border-radius: 6px;
      border-left: 2px solid var(--gold);
      font-size: 0.95em;
    }

    #guess-feedback .evidence-block strong { color: var(--nav-text); }

    #reveal-btn {
      background: #8b2a1a;
      color: var(--nav-text);
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.8em;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }

    #reveal-btn:hover { background: #a83a2a; }
    #reveal-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .reveal-text {
      margin-top: 10px;
      padding: 12px 16px;
      background: #0e0e10;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      color: #e8e0d0;
      font-size: 0.8em;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .reveal-text .imposter-name {
      color: #e8a060;
      font-weight: bold;
      font-size: 1.1em;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px) {
      #book-container { padding: 10px 14px; }
      #page-content { font-size: var(--text-size); padding: 0 2px; }
      #page-content h2 { font-size: 1.2em; }
      .suspect-grid { grid-template-columns: 1fr 1fr; }
      #nav-bar { font-size: .6rem; padding: 2px 46px 10px; }
      .nav-buttons button { width: 34px; height: 58px; border-radius: 11px; font-size: .8rem; }
      #prev-btn { left: 4px; }
      #next-btn { right: 4px; }
      .setting-row { gap: 7px; }
      .setting-row label { min-width: 74px; font-size: .66rem; }
      .setting-row input[type="range"] { min-width: 70px; }
      .setting-row .value-display { min-width: 42px; font-size: .64rem; }
      #settings-panel { padding: 12px; font-size: .68rem; }
      #settings-panel .settings-title { font-size: .82rem; }
      .cover-content { padding: 14px 4px; }
      .cover-content h1 { font-size: 1.9em; }
      .cover-content .subtitle { font-size: .95em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    /* ============================================================
       SCROLLBAR
       ============================================================ */
    #page-content::-webkit-scrollbar { width: 5px; }
    #page-content::-webkit-scrollbar-track { background: #e8e0d0; border-radius: 10px; }
    #page-content::-webkit-scrollbar-thumb { background: #b8ac98; border-radius: 10px; }
    #page-content::-webkit-scrollbar-thumb:hover { background: #9a8e78; }
  
    /* Navigation stays in the reading flow, before and after the text */
    #book-container {
      width: 100%;
      max-width: 860px;
      min-height: 100dvh;
      height: auto;
      max-height: none;
      padding: 10px clamp(12px, 4vw, 28px) 18px;
      position: relative;
      overflow: visible;
    }
    #nav-bar {
      justify-content: center;
      padding: 2px 4px 9px;
      margin-bottom: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 10px 0;
    }
    .nav-buttons button {
      position: static;
      left: auto;
      top: auto;
      bottom: auto;
      transform: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: min(220px, 100%);
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid rgba(240,230,210,.2);
      border-radius: 24px;
      background: rgba(30,30,42,.97);
      color: var(--nav-text);
      box-shadow: 0 5px 18px rgba(0,0,0,.16);
      font: bold .78rem 'Courier New', monospace;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #prev-btn::after { content: 'PREVIOUS PAGE'; }
    #next-btn::after { content: 'NEXT PAGE'; }
    .nav-buttons button:hover { background: #48485c; transform: none; }
    .nav-buttons button:active { opacity: .8; }
    .nav-buttons button:disabled { opacity: .18; cursor: not-allowed; box-shadow: none; }
    #page-content {
      display: block;
      width: 100%;
      overflow: visible;
      overflow-wrap: anywhere;
      padding: 4px 4px 12px 2px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    #settings-panel {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 14px;
    }
    .setting-row { gap: 8px; }
    .setting-row input[type="range"] { min-width: 0; }
    @media (max-width: 600px) {
      #book-container { padding: 8px 12px 62px; }
      #nav-bar { padding: 2px 0 8px; margin-bottom: 7px; }
      #page-indicator { padding: 6px 12px; font-size: .68rem; }
      #prev-btn { top: 52px; }
      #next-btn { bottom: max(8px, env(safe-area-inset-bottom)); }
      .nav-buttons button { width: min(166px, calc(100vw - 48px)); min-height: 40px; font-size: .7rem; }
      #settings-panel { padding: 11px; font-size: .68rem; }
      #settings-panel .settings-title { font-size: .8rem; }
      .setting-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 44px; gap: 7px; }
      .setting-row label { min-width: 0; font-size: .63rem; }
      .setting-row input[type="range"] { width: 100%; min-width: 0; }
      .setting-row .value-display { min-width: 0; font-size: .61rem; }
      .cover-content { padding: 14px 4px; }
      .cover-content h1 { font-size: clamp(1.6em, 8vw, 2.1em); overflow-wrap: anywhere; }
      #page-content h2 { font-size: 1.25em; }
      #mark-hint { font-size: .57rem; max-width: 100%; }
    }

  
  html, body { height:auto !important; min-height:100%; overflow-x:hidden !important; overflow-y:auto !important; }
  body { display:block !important; }
  #book-container { width:100% !important; max-width:860px !important; min-height:100dvh !important; height:auto !important; max-height:none !important; margin:0 auto !important; overflow:visible !important; display:flex !important; flex-direction:column !important; padding:14px 16px 24px !important; }
  #nav-bar { order:0; padding:2px 8px 10px !important; }
  .nav-buttons { display:flex !important; justify-content:center !important; width:100% !important; margin:10px 0 !important; }
  .nav-buttons button { position:static !important; top:auto !important; right:auto !important; bottom:auto !important; left:auto !important; transform:none !important; width:auto !important; min-width:120px !important; height:auto !important; min-height:46px !important; padding:12px 18px !important; border-radius:12px !important; }
  #prev-btn { margin-bottom:8px !important; }
  #next-btn { margin-top:8px !important; }
  #page-content { flex:0 0 auto !important; min-height:0 !important; overflow:visible !important; }

</style>
</head>
<body>

<div id="book-container">

  <!-- NAVIGATION -->
  <div id="nav-bar">
    <span id="page-indicator">Page 1 / 21</span>
    <div class="nav-buttons">
      <button id="prev-btn" aria-label="Previous page">◀</button>
      <button id="next-btn" aria-label="Next page">▶</button>
    </div>
  </div>

  <!-- SETTINGS (Page 1 only — rendered dynamically) -->
  <div id="settings-panel" style="display:none;">
    <div class="settings-title">✦ READING SETTINGS</div>
    <div class="setting-row">
      <label for="text-size-slider">Text Size</label>
      <input type="range" id="text-size-slider" min="0.9" max="2.0" step="0.05" value="1.15">
      <span class="value-display" id="text-size-value">1.15rem</span>
    </div>
    <div class="setting-row">
      <label for="line-height-slider">Line Spacing</label>
      <input type="range" id="line-height-slider" min="1.2" max="2.8" step="0.05" value="1.8">
      <span class="value-display" id="line-height-value">1.8</span>
    </div>
    <div class="setting-row">
      <label for="word-spacing-slider">Word Spacing</label>
      <input type="range" id="word-spacing-slider" min="0" max="0.3" step="0.01" value="0.04">
      <span class="value-display" id="word-spacing-value">0.04em</span>
    </div>
    <div class="setting-row">
      <label for="letter-spacing-slider">Letter Spacing</label>
      <input type="range" id="letter-spacing-slider" min="0" max="0.12" step="0.005" value="0.01">
      <span class="value-display" id="letter-spacing-value">0.01em</span>
    </div>
    <div class="setting-row" style="justify-content:flex-end;">
      <button class="reset-btn" id="reset-settings">Reset</button>
    </div>
    <div class="cloud-save">
      <div class="settings-title">☁ SAVE TO ALL YOUR BOOKS</div>
      <label for="cloud-url">Google Apps Script Web App URL</label>
      <input id="cloud-url" type="url" placeholder="Paste your deployed URL ending in /exec" autocomplete="url">
      <label for="reader-id">Reader ID (same ID on each device)</label>
      <div class="cloud-row"><input id="reader-id" type="text" autocomplete="off"><button class="reset-btn" id="copy-reader-id" type="button">Copy ID</button></div>
      <div class="cloud-row"><button class="reset-btn" id="connect-cloud" type="button">Save connection &amp; sync</button><button class="reset-btn" id="sync-now" type="button">Sync now</button></div>
      <div id="cloud-status" role="status">Device saving is active. Connect Google Sheets to sync between devices.</div>
    </div>
  </div>

  <!-- MARK HINT -->
  <div id="mark-hint" style="display:none;">✦ Click any word to mark your spot · only one mark at a time · saved automatically</div>

  <!-- PAGE CONTENT -->
  <div id="page-content"></div>

</div>

<script>
  // ============================================================
  //  THE TORCHES WIND — SEASON 1 BOOK DATA
  //  21 pages total (0–20)
  //  Page 0: Settings (only page with settings panel)
  //  Page 1: Cover / Front of Book
  //  Page 2–16: Episodes 1–15
  //  Page 17: Trailer Season 2
  //  Page 18: Guess the Imposters
  //  Page 19: Reveal (hidden)
  //  Page 20: End / Credits
  // ============================================================

  // THE TORCHES WIND — THE HOLLOW COUNT. three chapters; culprit intentionally unrevealed.
  const PAGES = [];
  PAGES.push({type:'settings',title:'READING SETTINGS',body:`Adjust text size, line spacing, word spacing, and letter spacing below. Your reading position, marked word, and settings save automatically on this device. The mystery has no answer key: form your own theory from the evidence.`});
  PAGES.push({type:'cover',title:'THE TORCHES WIND',subtitle:'THE HOLLOW COUNT · THREE CHAPTERS',body:`Ten strangers wake beneath a hole in the sky: two Imposters and eight Innocents. One Torch. Fifteen standard tools divided into five attack tools, five defensive tools, and five utility tools. The free Murderer Tool is separate from those fifteen.\n\nA victim can be named. A shield can break. The attacker will never be announced.\n\nEvery clue is physical. Every note stays where it was placed. Every explanation has a second explanation.\n\nTen people entered: two Imposters and eight Innocents. The evidence remembers a place that should not exist.\n\nRead carefully. Keep your own theory. The story will not tell you who the killer is.`});
  PAGES.push({type:'episode',title:"Chapter 1 — The Room That Counted Backwards",body:"At 6:17, the lights went out in Vey. They returned one second later, but every clock had lost eleven minutes. Nobody noticed until later. Nobody except Elian Voss, who was already standing in a room without a clock.\n\nHe woke on cold tile with the taste of copper in his mouth and the certainty that someone had interrupted him mid-sentence. Above him, a square hole opened into a paper-colored sky. Wind slipped through it, though there were no windows. At the room's center stood the Torch: black metal ribs around a white core, burning without heat.\n\nNine others woke around him. Ten people. Elian counted them twice, then counted their shadows. One person seemed to have none. When he blinked, the shadow returned.\n\nA voice began as a thin ringing, climbed until it hurt his teeth, then slowed into a whisper. “Welcome to the Hollow Count. Ten entered: eight Innocents and two Imposters. You are not required to believe this. Belief is not a rule.”\n\nThe voice accelerated. “You may speak only during the voting window. At other times, communicate by writing notes and leaving them where another person can physically find them. Notes do not teleport. If one moves, someone moved it. If you did not see a note being placed, you do not know who wrote it.”\n\nThe rules continued in a pitch that kept changing. Attacking was permitted. Registered kills would be recorded, but the attacker would never be named. A victim would be announced. If a Kill Shield broke, the room would announce that too. Everyone began with one hundred Q Points. There were exactly fifteen standard tools: five attack tools, five defensive tools, and five utility tools. The free Murderer Tool was outside that count, and its description could be incomplete. At the end of each round, they could vote to remove one player. A tie meant another vote. Damaging the Torch or crossing an unapproved threshold meant immediate removal.\n\n“Rule six,” the voice whispered. “You will be told what happened. You will not necessarily be told what it means.”\n\nA wall opened into a shop. The inventory was divided into three rows of five. ATTACK: Marking Dart, which registered a target but not the person who launched it; Echo Spike, which captured one sound from a room; Threadcutter, which severed one visible tracking thread; Shadow Key, which opened one locked game-door for a single passage; and Red Stamp, which marked a room as the location of an attempted attack without naming an attacker. DEFENSE: Kill Shield, which blocked one registered kill; Reinforced Fold, a small temporary defense wall; Boundary Pin, which marked a threshold and recorded crossings imperfectly; Mirror Veil, which made one person's reflection unreliable for a round; and Safe-Room Seal, which prevented a registered attack inside one chosen room for a single round. UTILITY: Identity Lens, which took ten seconds to use and had only a fifty-fifty chance of returning the true role; Witness Glass, which showed a doorway crossing with a possibly delayed reflection; Thread Compass, which pointed toward the nearest room changed since the last dimming; Echo Chalk, which copied one sound onto a wall; and Memory Token, which traded one remembered detail for one answer about a place, object, or event. And under a dark cloth: MURDERER TOOL, price zero. It was not one of the fifteen standard tools.\n\n“Free means bait,” said Tamsin Reed, the woman in the yellow coat.\n\n“Or it means they want to know who touches it,” replied Pell, a quiet teenager with a shaved stripe in his hair.\n\nA man in a gray suit introduced himself as Silas Wren. He asked everyone what they remembered before waking, but never wrote down their answers. Orla Venn, a silver-haired archivist, recorded every word. Brant, broad-shouldered and angry, said the only trustworthy clue was one that cost someone something.\n\nElian bought the Thread Compass. Its needle spun, then pointed straight down at the floor beneath the Torch.\n\nAt the base of the Torch, someone had drawn ten short lines in the dust. Eleven pointed inward. One pointed out. A new line appeared without a hand to draw it.\n\nOrla found a note under the shop. “We have played this round before. One of you remembers. One of you is lying about remembering.”\n\nBeneath the sentence, a number had been scratched out so hard the paper tore. The fibers slowly rearranged themselves.\n\nThe number was 4.\n\nElian's number.\n\nA narrow doorway appeared in the wall. Beyond it stood a chair, a glass of water, and a mirror covered with a sheet. Elian had never been inside that room. He knew the glass was already broken.\n\nFrom behind the wall came three knocks, then two.\n\nThe Torch pulsed. The first round had not officially begun. Yet the room had already placed Elian at the center of a question no one else could see."});
  PAGES.push({type:'episode',title:"Chapter 2 — The Shop of Almost-Answers",body:"The doorway vanished before anyone could agree to enter it. The shop remained, and the players gathered around it as if prices could make the place understandable. Each purchase left a receipt on the floor. The receipt named the item and the remaining balance, but never the buyer. Paper could be moved. Ink could not be changed.\n\nA receipt showed that someone had purchased Echo Chalk. Twenty points remained. That was not enough to identify the buyer; several balances could produce the same number. The chalk's empty slot sat beside the free Murderer Tool, whose cloth cover had shifted a few centimeters.\n\nTamsin insisted that no one touch it. Brant said refusing to touch it was also a choice. Pell asked why the voice had bothered to tell them that attacks were allowed if it planned to conceal the attacker. Silas answered gently: “Because it wants us to confuse an event with a conclusion.”\n\nElian did not like how reasonable Silas sounded.\n\nThe first new door appeared behind Orla. It was marked 6. A white thread hung from the handle, knotted twice. Elian's compass pointed at it. Orla wrote a warning on a sheet and placed it in front of the door: DO NOT ENTER ALONE. Nobody saw her write the last word. Brant had been watching the Torch; Silas had been watching Elian.\n\nThree sharp knocks sounded behind the door. Three seconds later, the same knocks repeated, with a faint scrape at the end. Pell suspected Echo Chalk. No one could prove it.\n\nThe Torch dimmed, opening the voting window. The voice announced a registered kill. No shield had broken. The victim was Player 8.\n\nOrla was Player 8.\n\nShe was still standing beside her note. She looked at the thread, then at the others. Her expression showed recognition before fear, as if the voice had read aloud something she already knew. “I didn't go through the door,” she said.\n\nOrla vanished without a sound. Her pencil rolled in a circle and stopped against the white thread.\n\nNo attacker was named. The voting window remained open.\n\nSilas suggested voting for whoever used the chalk. Tamsin pointed out that they did not know who bought it. Brant said the note might be bait. Pell argued that Orla could have been the target before they woke. Each theory made someone else look guilty.\n\nThe vote tied. Nobody was removed.\n\nWhen the Torch brightened, the thread was gone, but the note remained exactly where Orla had placed it. Beneath her warning, another sentence had appeared in unfamiliar handwriting: THE FIRST VICTIM WAS NOT THE FIRST TARGET.\n\nElian picked up the paper, folded it, and opened it again. The crease split the word FIRST down the middle. The paper remembered the fold. He wondered whether the room remembered the hand.\n\nA new item appeared on the shop shelf: Witness Glass. Its black surface reflected no face, only the ceiling. Its label had changed since the first time they read it: “Shows the last person to cross a doorway. Reflection may be delayed.”\n\nThe rules did not say how long the delay could be. They did not say whether the reflection could show someone who had not crossed yet. They did not say whether the person reflected was the same person who had crossed.\n\nThe second round ended without another victim. At the edge of the shop, a small receipt lay face down. Elian turned it over. It was blank except for one sentence written in Orla's neat hand:\n\nIF YOU FIND THIS BEFORE I DO, THEN I HAVE ALREADY BEEN HERE.\n\nHe looked around. Orla was gone. The note had been placed after her disappearance, but the handwriting belonged to her. Unless someone had copied it. Unless the paper had been waiting. Unless Orla had written it earlier and known where it would be found.\n\nThe room gave them facts, then built a maze around the meaning."});
  PAGES.push({type:'episode',title:"Chapter 3 — The Rooms That Remembered",body:"After Orla vanished, ten narrow beds appeared beneath ten lamps. Number 8's bed was neatly made, with a dent in the pillow as if someone had just risen. Nobody wanted to lie down. They took turns staying awake, though no one believed the schedule could be enforced.\n\nDuring the second watch, a library appeared behind a wall. Its shelves continued farther than the lamps could reach. Ten gray books sat on the first shelf, each labeled with a player's number. Book 8 lay open. Inside were notes about Orla, the white thread, and the first vote. The handwriting changed every few pages: neat cursive, block capitals, then a pattern of marks that resembled a child's attempt at letters.\n\nThe final page said: ORLA WAS REMOVED BEFORE SHE COULD REMEMBER WHAT SHE REMEMBERED.\n\nPell shut the book. “Someone wants us to think her disappearance was planned.”\n\n“Maybe it was,” Elian said.\n\n“Or maybe this book was written afterward.”\n\nAt the end of the library, a door marked ARCHIVE opened into a room of file drawers. Each drawer had a date, mostly dates in the future. Elian found one marked with the current day. Inside lay a photograph of ten people around the Torch. It was them—the same clothes, the same faces, even Brant's split eyebrow. But the photograph showed thirteen people. Orla stood at the back with her hand on the shoulder of a figure whose face had been scratched away.\n\nThe caption read: THE FIRST GROUP WAS NEVER Ten.\n\nPell wanted to take it to the others. Elian wanted to leave it in place. They wrote down every detail and returned the photograph to the drawer. When they looked again, the drawer's date had changed.\n\nIn the corridor outside, their reflections moved a fraction late. Pell raised a hand; his reflection followed. Elian turned away, but his reflection stayed facing forward. Then the reflection lifted one finger to its lips.\n\nA second door appeared in the reflective wall. No handle. A black circle where a keyhole might be. Elian's Thread Compass pointed at it so hard the needle bent.\n\nThey left a note: WE SAW THE REFLECTION MOVE FIRST. When they returned to the sleeping room, the note was already there, folded into a triangle. The writing was theirs. The paper smelled of smoke.\n\nA new shop item appeared: Memory Token. Fifty points. Trade one remembered detail for one answer about the current round. The answer could concern a place, object, or event, but it would not identify a player. The traded memory could never be recovered.\n\nBrant bought it. He traded the memory of his kitchen window. The blue glass clouded, and the voice of a child said, “The window was inside the house.”\n\n“That tells me nothing,” Brant snapped.\n\n“It tells you the answer was technically correct,” Tamsin said.\n\nA kitchen door appeared in the library. Through its window, they could see the Torch from the outside. Brant went pale. He recognized the chipped mug, the folded towel, and the crack in the lower pane. He swore he had never described them.\n\nA figure moved beyond the window and tapped three times, paused, then tapped twice—the same pattern heard behind Door 6.\n\nThe kitchen door closed. On the wall, a sentence appeared: THE MEMORY WAS NOT YOURS TO TRADE.\n\nNo victim was announced at the next vote. Instead, the voice said, “One room has been entered by a person who has not yet arrived.”\n\nElian's book had opened by itself. On the first page was a photograph of him standing in the Hollow Count before he had ever arrived. His mouth was open as if speaking. Beneath it: YOU HAVE ALREADY BROKEN THE RULE THAT HAS NOT BEEN SPOKEN YET.\n\nHe could not remember speaking. He could not remember the photograph being taken. He could not remember the sentence he had lost before waking.\n\nThe Torch dimmed, and one lamp remained lit above Book 4."});
  PAGES.push({type:'episode',title:"Chapter 4 — The Vote With No Accusation",body:"The next room held ten chairs around a black glass table. The Torch showed through a narrow slit in the ceiling, its light stretched across the floor like a blade. The voice opened the voting window, and after hours of written notes the sudden sound of people talking felt almost obscene.\n\nBrant accused Silas of steering the group. Silas said the group had been steering itself. Tamsin asked who had bought the Echo Chalk. Pell asked why everyone assumed the chalk caused Orla's disappearance. Dev suggested that Orla might have been removed somewhere else and that the door was merely a distraction.\n\nElian laid the photograph on the table. “There were thirteen people in the first group.”\n\nSilas leaned forward. “Where did you get that?”\n\n“The archive.”\n\n“What archive?”\n\n“The room behind the library.”\n\n“There was no archive.”\n\n“There was when we found it.”\n\nSilas looked to Pell for confirmation. Pell said nothing. Beneath the glass table, a pale strip of paper drifted as if underwater.\n\nThe voice explained that a vote was an action, not a finding of fact. They voted. The result tied between Brant and Silas. They voted again. Another tie. A third vote began, and the Torch dimmed almost to darkness.\n\nThen the voice announced: “A shield has broken.”\n\nA line of gold light flashed across the table and dissolved. The voice added, “The shield owner remains alive. The shield was not purchased in this round.”\n\nNobody knew who owned it. Nobody knew who had been targeted. The rules had never said the attacker would be revealed if a shield blocked the kill. The group could not even be certain that the attacker knew a shield was present.\n\nA strip of paper lay beneath the empty chair. It had not been there when they sat down. The message read: THE SHIELD DID NOT SAVE THE PERSON IT WAS BOUGHT FOR.\n\n“That means the owner survived,” Brant said.\n\n“Or the shield was meant for someone else,” Tamsin replied.\n\n“Or the person it was bought for isn't one of us,” Pell added.\n\nA passage lined with five mirrors appeared. Each mirror was labeled BEFORE, DURING, AFTER, INSTEAD, or NEVER. The Witness Glass rested on a pedestal. The label now read: “The reflection may be delayed.”\n\nThe BEFORE mirror showed an empty passage. DURING showed an empty passage. AFTER showed Tamsin crossing the doorway, although she had not moved. INSTEAD showed Silas crossing with one hand hidden in his sleeve. NEVER showed Silas standing still, facing away.\n\n“This proves nothing,” Silas said.\n\n“It proves the glass can show several versions of a moment,” Elian answered.\n\nThe Thread Compass pointed at the empty air between them. All five mirrors flickered at once. For one instant, they showed thirteen people around the Torch. Orla was there. So was the scratched-out figure from the photograph. Someone stood behind Elian, close enough that their faces almost touched.\n\nElian turned. Nobody was there.\n\nThe voice returned in a quiet register. “Some of you search for the person who caused the event. Some search for the person who benefited. Some search for the person who knew it would happen. These are three different searches.”\n\nA card appeared on the pedestal: ten empty circles and one filled circle marked 13. The filled circle had been crossed out. On the reverse, in Orla's handwriting: IF YOU CAN READ THIS, I WAS NOT THE FIRST TO DISAPPEAR.\n\nElian put the card in his pocket. Behind the mirror marked NEVER came three knocks, a pause, then two. From the other side, someone answered with two knocks, a pause, then three.\n\nThe vote ended with no removal. The room had provided five possible reflections, one broken shield, and a message that could mean almost anything. Everyone left with a different suspect. Everyone had a reason to distrust their own conclusion."});
  PAGES.push({type:'episode',title:"Chapter 5 — The Thirteenth Place",body:"By the fifth round, they had begun recording timestamps beside every note. The timestamps contradicted one another. A message written after the Torch dimmed appeared to have been placed before it. A receipt showed a purchase no one remembered seeing. The Thread Compass pointed toward rooms that had not yet appeared.\n\nThe Hollow Count was not becoming more chaotic. It was measuring the difference between what happened and what the players believed had happened.\n\nThey built a wall chart with three columns: CONFIRMED, CLAIMED, and POSSIBLE. Confirmed facts were few. Orla had been named as a victim. No attacker had been named. A shield had broken and its owner remained alive. The photograph showed thirteen people. A note had appeared with Elian's number before he understood why. The compass pointed toward changing spaces, but nobody knew what counted as a change.\n\nEverything else belonged in the other columns.\n\nThe shop opened with the same fifteen standard tools, but their labels had changed. A card called SECOND VOICE appeared beside the free Murderer Tool; the voice insisted it was not an item for sale, but an effect the room could create. A bent Door Nail and an Empty Receipt appeared as evidence objects, not purchasable tools. Neither counted toward the fifteen.\n\n“Every tool makes a fact less useful,” Tamsin said.\n\n“Or makes a lie more expensive,” Pell replied.\n\nElian bought the Door Nail and fixed it beside the black-circle door. Beyond it was a room resembling the original chamber, but the Torch was missing. Thirteen chairs stood inside. Ten faced inward. One faced the wall.\n\nA list of names hung above the thirteenth chair. All ten players were listed, each beside a date. Orla's date was years earlier than the others. The thirteenth place had no name, only a question mark.\n\nA speaker clicked on. A normal human voice, tired and close to the microphone, said: “If you're hearing this, the round has already started. Don't trust the first count. Don't trust the second count either. The room can count people who aren't present and ignore people who are. The game does not need a thirteenth player. It needs the idea of one.”\n\nThe recording ended. They could not tell who had made it or when. The Door Nail bent. Elian pulled it free, and the room vanished.\n\nBack at the wall chart, someone had added a line under CONFIRMED: THE KILLER IS NOT THE ONLY PERSON WHO CAN MAKE A VICTIM DISAPPEAR.\n\nThe voting window opened. The voice announced a registered kill had been attempted and failed. A shield had broken. The owner remained alive. No one vanished.\n\nThe group argued. Brant wanted to vote for Silas because of the mirror. Tamsin accused Brant of hiding what the Memory Token had taken from him. Silas argued that a reflection was not a confession. Pell asked why Brant still carried the cracked token if its answer had been useless. Brant replied, “Because I want to remember what it cost me.”\n\nThe vote tied. Nobody was removed.\n\nThe lights went out for three seconds. Elian felt a paper placed in his hand. When the lights returned, everyone was still there. The note said: YOU ARE ALLOWED TO GUESS. YOU ARE NOT ALLOWED TO BE CERTAIN.\n\nUnderneath were two empty circles and ten names in a different order from the wall chart. Read in one direction, the first letters spelled nothing. Read in reverse, nothing. Read by the dates, they formed a word Elian almost recognized, then lost as soon as he tried to say it.\n\nHe looked at the ten faces. Every person had done something suspicious. Every person had also done something that might be innocent. The clues did not point cleanly to one pair. They formed a web, and every thread passed through more than one hand.\n\nElian wrote two names on the back of the note and folded it away. His guess was not a verdict. He would not let the room turn it into one.\n\nAcross the chamber, Silas watched him—or perhaps watched the Torch, or perhaps the place where the thirteenth chair had been.\n\nThe floor beneath that place gave one quiet knock. Then another. Then three more.\n\nThe voice spoke one final time: “Ten chapters. Ten players. Two hidden roles. No answer key.”\n\nThe Torch dimmed.\n\n“Make your guess.”\n\nAnd in the silence that followed, someone, somewhere in the room, laughed exactly once."});
  PAGES.push({type:'episode',title:"Chapter 6 — The Room Outside the Room",body:"The next round began with a sound no one could locate: a train passing beneath the floor. Wheels rattled, brakes squealed, and a chain dropped somewhere in the dark. Then the Torch went still. A door appeared where the wall chart had been, and the chart itself hung behind the door, visible through a narrow pane of glass. A plate on the door read OUTSIDE.\n\nTamsin wrote down the order of events. Sound first. Torch stillness second. Door third. Chart moved fourth. Brant remembered the Torch dimming before the sound ended. Pell thought the chart had moved before the door appeared. Silas said they had all been watching different things. They agreed on only one point: the chart was behind the door now.\n\nOn the chart, a new column had appeared: NOT HERE. Beneath it were three objects: Orla's pencil, the bent Door Nail, and the Empty Receipt. “They're saying those things are outside,” Pell said.\n\n“Or saying the things are not here,” Tamsin replied. “That isn't the same statement.”\n\nElian used the Thread Compass. Its needle did not point at the door. It pointed toward Brant's coat pocket. Brant turned it inside out. A strip of white thread fell to the floor. He said he had never seen it before. The thread had the same two knots as the one from Door 6, but this piece had three. The last knot was so tight that the fibers had begun to fray.\n\nBrant refused to let anyone touch it. Tamsin asked him to place it on the table so everyone could observe it. He did. The compass swung away from Brant and pointed at the thread. For once, the tool agreed with the obvious.\n\nA new tool appeared beneath a glass dome: the Boundary Pin, priced at sixty Q Points. It could mark a threshold and reveal whether the next person to cross had come from the room, the outside, or somewhere not yet counted. The label warned that the result might arrive after the crossing.\n\nElian bought it and pushed it into the floor. A pale circle spread across the tiles. The door opened by itself. Beyond it was the original chamber, empty. The Torch stood in the center, and the beds were gone. Thirteen lines surrounded the Torch. Every line pointed inward.\n\nElian did not cross. A note lay just inside the threshold: THE OUTSIDE IS A PLACE THE ROOM CAN REMEMBER.\n\nThe voting bell rang. No victim. No shield break. No name. Then the voice said, “A boundary has been crossed.” The Boundary Pin glowed and displayed a single number: 0.\n\nTamsin wrote the result under CONFIRMED. She did not write what it meant."});
  PAGES.push({type:'episode',title:"Chapter 7 — The Witness Who Wasn't There",body:"The number zero stayed on the wall chart until the ink faded around it. Nobody could agree whether it meant nobody had crossed, the boundary had counted nobody, or the person who crossed had no number. The Boundary Pin's instructions did not define zero. The shop offered no refund.\n\nA narrow booth appeared, made of cloudy glass. Inside was a chair, a desk, and a microphone with no cable. One sign read WITNESS INTERVIEW. A second, taped over the first, read NO WITNESS REQUIRED. The booth door opened only when one player stood alone in front of it.\n\nYara stepped forward. She entered and sat down. The glass clouded. After ten seconds, a voice emerged from the microphone. It sounded like Yara, but older and tired. “Tell them what you saw.”\n\n“I don't know what you mean,” Yara replied.\n\nThe voice repeated her sentence using her exact pauses. She left the booth without speaking into the microphone. When she came out, she looked angry, not frightened.\n\n“What did it ask?” Elian said.\n\n“It told me to tell you what I saw.”\n\n“And what did you see?”\n\nYara looked at the others. “A person who wasn't there.”\n\nThe booth went dark. The microphone vanished, leaving only a small hole in the desk. Silas suggested the booth was recording memories instead of testimony. Tamsin wrote three alternatives: a playback, a live impersonation, or an empty room producing the sound everyone expected to hear. Brant said they were avoiding the possibility that Yara had recognized someone.\n\nYara answered, “You want my memory to be a map. It isn't.”\n\nThe shop offered a Witness Ledger for twenty-five points. It could record one observation and conceal the writer's identity, though everyone would see the exact words. Pell bought it and wrote: I HEARD A VOICE IN THE BOOTH. The ledger displayed the sentence. It did not reveal Pell's name, but everyone had watched him buy it. Anonymity had not helped.\n\nAnother line appeared without anyone writing it: I HEARD THE VOICE BEFORE THE BOOTH EXISTED.\n\nThe two statements did not contradict each other, but they suggested that the booth had been built around a sound that was already present. Elian examined the microphone hole. Its inside was lined with paper, layered like book pages. One strip bore Orla's handwriting: A WITNESS IS NOT THE SAME AS A PERSON WHO SAW.\n\nThe booth opened again. Nobody entered. The microphone spoke anyway, in Elian's voice: “I was there.”\n\nHe had not said it. Yet when he tried to remember the train sound beneath the floor, he felt certain he had once sat in a booth like this, answering questions from someone he could not see. He could not tell whether the certainty was a memory or the booth's next trick."});
  PAGES.push({type:'episode',title:"Chapter 8 — The Inventory of Missing Things",body:"The shop stopped selling tools and began selling absences. Its shelves held empty outlines where items should have been, each outlined in faint gold. The labels were ordinary: one cup of water, one pencil, one folded note, one brass counter, one name. The final shelf was marked ONE MINUTE.\n\nThe voice explained that the shop had not run out of supplies. It had begun taking inventory of things the players had lost. “A missing object is not necessarily stolen. A missing memory is not necessarily forgotten. A missing person is not necessarily absent.”\n\nBrant demanded that the shop return his kitchen-window memory. The voice said nothing. He struck the counter, and the sound echoed from the library instead of the shop. A book slid off a shelf and landed open. Its page listed every item that had vanished since the first round: the white thread, Orla's pencil, the first photograph, the Witness Glass reflection, and the sound of the three knocks. The final entry was ELIAN'S FIRST SENTENCE.\n\nElian tried to remember what he had been saying when he woke. He could recall the shape of a word, the feeling of being interrupted, and the certainty that it mattered. He could not retrieve the sentence itself. The blankness felt less like forgetting than like a space shaped for something removed.\n\nA new tool appeared: the Recall Bell, priced at seventy Q Points. It could restore one lost detail to one person, but the bell would take a different detail from someone else in the room. No one could choose whose memory was taken. The label warned: THE BELL DOES NOT DECIDE WHICH MEMORY MATTERS MORE.\n\nTamsin wanted to leave it untouched. Pell argued that the missing information might be the only way to identify whoever had arranged the room. Silas asked whether a restored memory could make a person less reliable if it belonged to a different version of an event. Brant said doing nothing was still a choice.\n\nElian bought the bell. It cost nearly all his points. He rang it once. A tiny sound came out, like a spoon touching a glass. He remembered a sentence: DON'T COUNT THE PERSON WHO OPENS THE DOOR. COUNT THE PERSON WHO KNOWS IT WILL OPEN.\n\nAcross the room, Yara gasped. She said she had forgotten the smell of rain. Now she remembered rain on hot pavement, a metal railing, wet paper. She could not say when she had experienced it. The memory felt complete but had no date.\n\nThe bell's label changed. It had taken a detail, but no one knew whose. Every player checked their memories. Nobody could prove that anything was missing. That was the bell's cruel design: the cost might remain invisible until someone tried to remember.\n\nElian wrote his sentence on the chart. Tamsin placed it under POSSIBLE, not CONFIRMED. “I remember it,” he said.\n\n“You remember hearing it,” she replied. “We don't know when it was first said, or whether it was said to you.”\n\nHe wanted to argue. Instead, he looked at the empty outline labeled ONE MINUTE. For a moment, he thought he saw a hand inside it, holding a watch stopped at 6:17. Then the outline was empty again."});
  PAGES.push({type:'episode',title:"Chapter 9 — The Trial of Ten",body:"The room arranged ten chairs in a straight line and placed a small desk opposite them. No judge appeared. No rules were announced. On the desk lay ten blank cards and one card with a sentence already printed: SOMEONE HERE KNOWS WHY ORLA WAS CHOSEN.\n\nThe voting window opened, but the voice did not ask them to vote. It asked them to testify. Each player could make one statement. Anyone who spoke had to stand beside the desk, and the Torch would brighten while they spoke. If the statement was a lie, the light might change. The voice did not explain what “might” meant.\n\nBrant went first. He said Orla had been chosen because she knew the room from an earlier count. The Torch brightened, but it had brightened when he approached the desk, too. His statement might have been true, false, or simply important to him.\n\nTamsin said Orla had been chosen because the group needed a victim before it could begin suspecting one another. The light did not change. Silas said the room had selected Orla because her number made the first count unstable. The Torch pulsed twice. Pell said he did not know why Orla was chosen. The light stayed still.\n\nYara said, “Orla was not the person I saw.”\n\nThe Torch went out.\n\nNobody moved. In the darkness, the desk scraped across the floor. When the lights returned, Yara stood beside her chair, and the printed card had been turned over. The reverse read: A TRIAL CAN ONLY JUDGE THE QUESTION IT WAS GIVEN.\n\nElian was last. He could have repeated the sentence from the Recall Bell, but he did not know whether it belonged to the past or had been planted to guide him. He said instead: “I don't know why Orla was chosen. I know the room wants us to believe there is one reason.”\n\nThe Torch stayed lit. The voice announced no verdict.\n\nA second card appeared. It listed four possible motives: silence a witness, punish a rule-breaker, move a piece, and create a mystery. Each motive could explain Orla's disappearance. Each could also be a story invented afterward. The room did not offer a fifth option called something else, but the absence of that option did not mean the list was complete.\n\nTamsin arranged the cards by the order in which they had been turned over. The pattern resembled the ten dust lines around the Torch. One card pointed out. Eleven pointed inward. SILENCE A WITNESS sat at the outward point. It looked like a clue. It might have been a clue. It might also have been the room arranging a familiar shape because the players expected one.\n\nAt the end of the round, the voice announced: “A witness has been removed from the record.” No one disappeared. No shield broke. The blank card with Elian's name on it turned gray. He could still read his name, but when he tried to write it elsewhere, his hand paused after the first letter. It took him several attempts to write it on the wall chart.\n\nHe could not tell whether the record had removed his name, or whether fear had made his hand hesitate. The room had turned an ordinary difficulty into a new suspect."});
  PAGES.push({type:'episode',title:"Chapter 10 — The Count That Remains",body:"The last chapter began with the sound of all ten players speaking at once. Their voices came from the ceiling, the floor, the library, and the shop. Each recited a different version of the rules. In one version, attacks were forbidden. In another, voting had never existed. In a third, the two hidden roles were described as “the person who acts” and “the person who knows.” None agreed on what those roles meant.\n\nThe players waited for the voice to correct them. It did not. The Torch burned steadily, and the square of sky above it had turned dark blue, though no stars were visible.\n\nTamsin brought the wall chart to the center. It was covered with facts, claims, alternatives, and crossed-out theories. She asked everyone to read the confirmed column and say whether they still agreed with each entry. They discovered that even confirmed facts had changed meaning. Orla had been named as a victim, but the announcement did not prove what had happened to her. A shield had broken, but the announcement did not prove who had been attacked. The photograph showed thirteen figures, but it did not prove there had been thirteen players.\n\nThey did not erase the facts. They rewrote them more carefully.\n\nElian added the sentence he had recovered: DON'T COUNT THE PERSON WHO OPENS THE DOOR. COUNT THE PERSON WHO KNOWS IT WILL OPEN. Beneath it he wrote three questions. Who expected the door? Who wanted it opened? Who benefited when the others looked at it? Those questions could point toward one person, or three different people.\n\nThe shop opened for one final round. Every tool was available, including the free Murderer Tool. Its label had changed: THIS TOOL HAS NEVER BEEN PURCHASED. THIS TOOL HAS BEEN USED. THIS TOOL MAY NOT BE WHAT YOU THINK IT IS.\n\nBrant said it was a confession. Pell said it was a claim about an object, not a person. Silas asked whether the tool could have been used by the room itself. Tamsin pointed out that the label did not say who had used it, when, or what counted as using it. Nobody touched it.\n\nThe final voting window opened. Each player could write one name on a card and place it face down. They were not required to show their choice. The room would count the cards but would not announce the result. The group agreed that a secret vote was the only way to preserve a private theory without turning it into an accusation.\n\nElian wrote two names on a separate slip, folded it, and kept it in his pocket. On the official card, he wrote only a question mark. He could not decide whether that was honesty, fear, or another way to refuse the room's demand.\n\nWhen the cards were counted, the voice announced: “No conclusion has been reached.”\n\nThe Torch dimmed. For a moment, Elian thought the room would finally show them the thirteenth person. Instead, the empty chair appeared beside the Torch, and the brass counter marked 13 rested on its seat. A hand reached into view from beyond the ceiling opening and took the counter away. No one could see who the hand belonged to.\n\nThe last note appeared on the wall, not on a surface anyone had touched. That broke the rule they had been given at the beginning. Or perhaps the note had been placed there earlier, behind the wall, and the wall had only now opened. The room did not explain.\n\nThe note said: THE KILLER IS A GUESS. THE COUNT IS THE CRIME.\n\nIt could mean the attacker was hidden among the players. It could mean the system itself had caused the disappearances. It could mean the act of counting had made a victim out of someone who was still present. It could mean all three, or none.\n\nThe voice returned to its first pitch, almost gentle. “Ten chapters. Ten players. Two hidden roles. No answer key.”\n\nThe Torch continued burning. The OUTSIDE door remained closed. The mirror marked NEVER showed an empty room. The shop's free tool sat beneath its dark cloth. Somewhere, a note waited where someone had physically placed it.\n\nThe story ended. The count did not."});
  PAGES.push({type:'guess',title:'WHO ARE THE TWO IMPOSTERS? — PICK YOUR TWO SUSPECTS',body:'Choose two of the ten people to compare clues. Exactly two are Imposters and eight are Innocents. There is deliberately no correct-answer reveal.',suspects:[{num:1,name:'Elian Voss'},{num:2,name:'Silas Wren'},{num:3,name:'Tamsin Reed'},{num:4,name:'Pell'},{num:5,name:'Brant'},{num:6,name:'Yara'},{num:7,name:'Dev'},{num:8,name:'Orla Venn'},{num:9,name:'Iona Vale'},{num:10,name:'Marek Sorn'}]});
  PAGES.push({type:'reveal',title:'CASE CLOSED? NO.',body:'There is no answer key here. Your selected suspects are a theory, not a verdict. Compare confirmed facts with claims and possibilities. The attacker is never named by the system. The person who caused a disappearance, the person who benefited, and the person who knew it would happen may not be the same person.'});
  PAGES.push({type:'end',title:'THE COUNT CONTINUES',body:`ten chapters. Ten players. Two hidden roles. No official solution.\n\nThe reader is the detective. The clues are part of the story. The story will not confirm your answer.\n\nThe Torch is still burning. The thirteenth place is still empty. And somewhere, a note is waiting to be found.`});

  // Additional evidence scenes deepen each chapter without exposing a solution.
  PAGES[2].body += "Elian returned to the dust circle when the others began arguing about whether the note had been planted. He knelt beside the ten lines and examined the groove marked with his number. The dust inside it was darker than the dust around it. He rubbed a fingertip over the edge and found a thin residue like graphite. Whoever had drawn the line had used the same material as the notes, or wanted him to think so.\n\nHe wrote three questions on separate slips: WHO DREW THE LINES? WHY DOES NUMBER FOUR POINT OUT? WHO BENEFITS IF I BELIEVE IT IS ABOUT ME? He placed them at three different spots around the Torch, making sure each was visible from the shop. He wanted to see whether any would move. He did not tell anyone why.\n\nDuring the next few minutes, Tamsin paced the room and counted steps between the shop and every visible wall. Brant watched her count and accused her of mapping escape routes. She replied that knowing distances was not the same as planning an escape. Silas offered to help, but Tamsin refused. “If you help, I have to remember which measurements you witnessed and which you could have changed.”\n\nPell crouched beside the Torch and listened. The metal made a faint sound like a kettle about to boil. When he moved away, it stopped. When he returned, it started again. He tried approaching from the other side. Same sound. He tried closing his eyes. The sound seemed to come from inside his head.\n\nHe wrote: THE TORCH REACTS TO ATTENTION. Then he placed the note where everyone could read it.\n\nElian noticed that his three questions remained in place. But the shadows of the slips had changed direction. The light from the Torch was steady, yet the shadow of the first note pointed toward the ceiling. The second pointed toward the shop. The third pointed toward Elian.\n\nHe did not move them. A clue could be made meaningless by touching it, and a trap could be made more convincing by leaving it alone.\n\nWhen the voting window opened, no one had been attacked. Instead, the voice announced that one player had “attempted to leave without crossing a threshold.” The phrase made no sense until a narrow white line appeared around the room. It enclosed the players, the shop, and the Torch, but excluded the dust circle. For a few seconds, the circle appeared to be outside the room, separated from them by a border that had not existed before.\n\nThen the line vanished.\n\nThe voice said, “The boundary has been corrected.”\n\nNobody voted. Nobody knew what the announcement meant. Elian looked at the three slips and wondered whether the room had answered his questions or simply noticed that he had asked them.";
  PAGES[3].body += "After Orla's disappearance, the players began treating every ordinary object as if it were a witness. The pencil was questioned. The receipt was examined under the lamp. The white thread was described so many times that people began disagreeing about its length. Tamsin insisted it had been as long as her hand. Brant remembered it as a short loop. Pell had not seen it clearly, but remembered a knot that looked like a small number eight.\n\nThey drew the thread from memory on the wall. Three drawings emerged. In one, the knots sat close together. In another, the second knot was larger. In the third, the thread formed a shape like an arrow. No drawing matched all the others.\n\nSilas suggested that they compare the drawings to the first note. He said the writer might have been using the thread as a signature. Orla's warning was written in block capitals, but the note beneath it used slanted letters. That could mean two writers. It could also mean one writer changing their hand. The room's rules guaranteed only that a note stayed where it had been placed; they did not guarantee the writing was honest.\n\nYara, who had said very little since waking, asked the question nobody had thought to ask: “Did Orla know the door was going to appear, or did she write the warning because the door had already appeared?”\n\nThe answer depended on what each person remembered seeing first. Tamsin recalled the note before the door. Brant remembered the door before the note. Pell could not remember seeing either until after the knocks. Silas said he had watched the wall the whole time and had seen the door appear first. Elian knew that Silas had been watching him, not the wall.\n\nNo one called him a liar. No one needed to. The difference between a lie and a mistaken memory was already too thin to stand on.\n\nThe shop printed a new receipt without anyone buying anything. It slid out slowly, then fell to the floor. The paper said: **WITNESS GLASS — NOT PURCHASED.** Beneath it, in smaller text, was: **THE ABSENCE OF A RECEIPT IS NOT PROOF OF ABSENCE.**\n\nBrant laughed once. “It is making jokes now.”\n\n“It is teaching us how to argue forever,” said Tamsin.\n\nThey placed the receipt beside the original purchase record. One proved that the Witness Glass had not been purchased in the current round. It did not prove it had never been purchased. Someone might have bought it earlier. Someone might have brought it into the room. The shop might have placed it there. A player might have used it without owning it.\n\nThe voice announced the round's end, and for a moment everyone waited for another victim. None came. The relief was immediate and shameful. Elian realized he had been measuring the silence by whether someone else disappeared, not by whether the group had learned anything.\n\nThen the blank receipt curled at its corners. The ink remained, but the paper darkened until it looked burned. A final line appeared:\n\n**YOU ARE LOOKING FOR A HAND. LOOK AT THE DOOR.**\n\nThere were six doors visible now. No one remembered when the others had appeared.";
  PAGES[4].body += "Elian began testing the library instead of reading it. He counted the shelves, marked the floor with small pencil dots, and returned ten minutes later. The number of shelves had not changed, but the distance between them had. A shelf that had been five steps away now took seven. The dots remained exactly where he had placed them, which meant either the floor had stretched or the room had moved around the marks.\n\nPell helped him measure. They used the length of a receipt as a unit and wrote their results in the notebook. They disagreed by a fraction on the first measurement and by an entire receipt on the second. When they repeated the test, the first result changed. Their notes did not.\n\n“Maybe the room changes when we measure it,” Pell said.\n\n“Then how do we measure the change?”\n\n“By what stays still.”\n\n“What stays still?”\n\nPell held up the notebook. “The fact that we wrote this down.”\n\nElian did not tell him that the notebook's last page had gained a sentence while neither of them was looking: **A RECORD IS NOT THE EVENT. IT IS ANOTHER EVENT.**\n\nThey took the notebook to Tamsin. She read the sentence and asked who had written it. Neither could answer. The ink looked like Pell's, but the final letters were too rounded. The writing could have been copied. It could have been Pell's hand in a moment he did not remember. The notebook could have been altered by someone who never touched it.\n\nOrla's open book still waited on the first shelf. Elian turned to the page that described her disappearance. The wording had changed. Earlier, it had said she was removed before she could remember what she remembered. Now it said: **ORLA WAS REMOVED AFTER SHE REMEMBERED WHO WAS MISSING.**\n\nThat was not a small change. It turned the sentence from a suggestion about memory into a suggestion about a person. But who was missing? The thirteenth figure? Someone from before the game? Or one of the ten whose absence had not yet been noticed?\n\nElian showed the page to Pell. Pell read it twice, then turned back several pages. Every description of Orla had changed. The book now suggested she had been searching for a thirteenth person for years. It described a file she had once handled, a photograph she had hidden, and a name she had refused to write down.\n\nNone of those details appeared in the photograph itself. The archive might be inventing them. Or it might be remembering something the players could not.\n\nThe next room appeared without a door. One moment the end of the library was a blank wall; the next, there was a narrow chamber with a single chair and a lamp. The chair faced the wall. On the wall was a mirror covered by a sheet. Elian recognized the room from the doorway he had seen in the first chapter. He had not entered it then, yet he knew the glass inside was broken.\n\nHe pulled away the sheet. The mirror was whole.\n\nIn its reflection, the mirror was broken.\n\nPell whispered, “Don't touch it.”\n\nElian did not. The reflected crack spread slowly from one corner to the center. In the real mirror, nothing changed. A small object appeared on the reflected chair: a brass counter marked 4. Elian checked his pocket. His own counter was still there.\n\nThe reflection lifted the counter and held it out toward him. The gesture was patient, almost polite.\n\nThen the reflected version of Elian opened its mouth and spoke without sound.\n\nThe lamp went out.\n\nWhen it returned, the mirror was covered again, and the chair was empty. On the floor lay a new note: **THE ROOM REMEMBERS THE VERSION YOU REFUSE TO ENTER.**";
  PAGES[5].body += "The five mirrors did not show the same scene again. The group returned with chalk and marked the floor in front of each one, recording where everyone stood. They wrote the time, the Torch's brightness, and the names of people who had looked into the glass. They tried not to interpret the results until the test was over.\n\nThe AFTER mirror showed Brant entering the passage. Brant had stayed outside. The INSTEAD mirror showed Tamsin with a hand on the black-circle door. Tamsin had never touched it. The BEFORE mirror showed a person standing behind Silas, but the reflection's face was hidden by the label. The NEVER mirror showed an empty room, except for a shadow that belonged to no one.\n\nThey compared the results. The mirrors seemed to disagree, but the disagreement had structure. Each image included an event someone had described, feared, or denied. Perhaps the glass was not predicting the future. Perhaps it was displaying the group's competing memories. Perhaps it was showing events from a previous count. Perhaps someone was using a tool to make the mirrors lie.\n\nNo theory explained everything. That was what made each theory feel powerful.\n\nSilas argued that the mirrors could be used to identify the attacker if everyone stood in the same place and repeated the test. Tamsin refused. “If someone knows we're repeating it, they can change what we see. And if the mirror shows a possibility instead of a fact, repetition doesn't help.”\n\n“Then we never act,” Silas said.\n\n“We can act without pretending we know.”\n\nThe words remained between them longer than the argument.\n\nAt the next dimming, the voice announced a shield break but no victim. A second later, a bell rang from the library. A book fell from a shelf and opened on the floor. The page showed a list of names, each crossed out except one. The remaining name was not one of the ten. It was a blank line.\n\nBrant insisted the shield belonged to him. He said he had purchased it before the first vote and kept quiet because a defense was useless if the others knew it existed. But the voice had said the shield was not purchased in that round, not that it was purchased earlier. His claim fit the announcement. It did not prove he was telling the truth.\n\nTamsin asked him when he had bought it. Brant named a round. Pell pointed out that there had been no receipt for the purchase. Brant replied that receipts could be moved. The argument circled back to the same uncertainty: every clue could be explained away, but some explanations required more assumptions than others.\n\nElian wrote those assumptions down. Beside Brant's story he wrote three questions: why had he hidden the shield, who had he intended to protect, and how had he known the room would announce the break? He did not show the list to anyone.\n\nA note appeared at the foot of the mirror marked BEFORE. It was written in Elian's own handwriting. **YOU ARE COUNTING THE WRONG THING.**\n\nHe checked his fingers for graphite. There was none. He checked his notebook. The page where he had written the questions was still there. He could not prove he had not written the note earlier, or that he would remember doing so.\n\nThe voice announced that the round was complete. Nobody was removed. The group had gathered more evidence and become less certain about what it meant.\n\nThat, Elian began to suspect, was not a side effect of the game. It was the game.";
  PAGES[6].body += "The recording in the thirteenth room left a question they could not avoid: who had known that they would find it? The voice sounded human, not like the Torch. It used ordinary pauses and breathed near the microphone. But the recording could have been old. The speaker might have been a missing player, someone outside the room, or one of the ten speaking before their memory had been altered.\n\nThey tried to copy the sentence word for word. Each person remembered a different phrase. Tamsin wrote “don't trust the first count.” Brant remembered “don't trust the second count either.” Pell remembered the room counting people who were absent. Silas recalled the final sentence about the idea of a thirteenth player. When they played the memory back to one another, the versions did not fit neatly together.\n\nThe Second Voice item remained in the shop, untouched. Nobody wanted to buy it because nobody wanted to hear their own voice saying something they could not remember saying. The Empty Receipt, however, disappeared from its shelf. A receipt fell to the floor, showing that the item had not been purchased. The empty space on the shelf suggested the opposite.\n\nTamsin picked up the receipt with two fingers and placed it on the wall chart. “This is our best example,” she said. “The record says it wasn't bought. The shelf says it's gone. Those facts don't cancel each other out.”\n\nBrant shook his head. “Or someone bought it and left a false receipt.”\n\n“Exactly,” said Tamsin. “That is possible. But it is only one possibility.”\n\nElian added another line to the chart: **A CONTRADICTION MAY MEAN A LIE, A MISTAKE, OR TWO TRUE THINGS THAT DON'T FIT OUR MODEL.**\n\nThe voice remained silent for most of the round. That made every small sound seem important: a shoe shifting, a receipt sliding, the distant knock behind the mirror. At one point Elian heard his own name spoken from the library. He turned and saw no one. He asked the others whether they had heard it. Tamsin had heard a sound, not a name. Brant had heard nothing. Pell said he had heard “number four,” but could not say whether it had been spoken or imagined.\n\nElian went to the library alone. Book 4 lay open beneath the lamp. The page held no story, only a series of short lines like the ones in the dust around the Torch. One line pointed out. Eleven pointed inward. The thirteenth line had been drawn across the page, cutting through the others.\n\nAt the bottom, a sentence appeared as he watched: **THE FIRST COUNT WAS A TEST. THE SECOND COUNT WAS A CORRECTION. THE THIRD COUNT IS YOURS.**\n\nHe wanted to ask what the first count had tested. He wanted to know who had corrected it. Instead, he closed the book and returned to the others. If the room wanted him to ask the question, the question might be the trap.\n\nAt the final vote, no victim was named. The voice announced that a registered kill had been attempted and failed. A shield had broken. The owner remained alive. This time, the Torch did not brighten after the announcement. Its light stayed low, and the shadows of the players stretched toward the empty thirteenth chair.\n\nElian wrote two names on a slip. He folded it and put it away. He did not show it to anyone, not even Pell. A guess was not proof, and he was no longer certain the room wanted them to discover the truth. Perhaps it wanted them to choose a story and live inside it.\n\nThe last note arrived during the blackout. He felt the paper placed in his hand. It was warm, as if someone had been holding it for a long time. When the lights returned, the note read: **YOU MAY BE RIGHT FOR THE WRONG REASON.**\n\nElian looked at Silas, then at Tamsin, then at the empty space beside the Torch. He could not tell whether the note had challenged his theory or confirmed it. That was the final trick of the Hollow Count: even the clues about clues were clues.\n\nThe voice spoke: “ten chapters. Ten players. Two hidden roles. No answer key.”\n\nThen someone laughed once, from a place no one could see.";

  // Additional scenes: deeper evidence, no culprit reveal.
