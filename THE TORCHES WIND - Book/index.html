  PAGES[2].body += "Elian waited until the others had spread out before checking the three questions again. The first slip had a new mark on it, a tiny diagonal line beside the word WHO. The second had been turned over, though it still lay in the same place. The third had a damp corner, as if it had been pressed against a cold glass. No one admitted touching them.\n\nHe asked the group to stand around the slips without speaking. It was not a formal test, only a way to see who looked at which question first. Brant stared at the one about the number pointing out. Tamsin studied the damp corner. Silas looked at Elian instead of the paper. Pell kept his eyes on the Torch, while Yara watched the people watching the Torch. Dev stood where he could see all three slips without turning his head.\n\nThe pattern meant nothing by itself. Elian wrote that down. He had begun to fear the ease with which a human mind could turn a small observation into a story. If Silas looked at him, perhaps he suspected him. Perhaps he was waiting for Elian to look back. Perhaps he had noticed the same thing and was trying not to react.\n\nWhen the voice opened the voting window, it did not ask them to vote. It announced a new condition: “For this round, the room will count what you leave behind.”\n\nEveryone looked at the floor. The note, the receipt, the pencil, and the white thread were all still there. Then the Torch pulsed, and a thin white outline appeared around every object that had been touched by a player. The outline around Elian's three slips was brighter than the others.\n\n“You touched them,” Brant said.\n\n“I wrote them.”\n\n“You moved them.”\n\n“I placed them.”\n\nThe distinction mattered to Elian. The room had not said that the outlines identified owners. It had said only that they marked objects that had been touched. Yet within seconds, the group was discussing whether Elian had been caught leaving evidence. The voice had offered a fact; fear had supplied the accusation.\n\nTamsin stepped beside the slips. Her outline appeared too. So did the outline around the Torch's base, the shop receipt, and the floor beside the missing doorway. Nearly every important object glowed.\n\nThe condition ended. The outlines disappeared. The voice said, “A record of contact is not a record of intent.”\n\nElian copied the sentence onto the wall. He did not know whether it was a warning, a clue, or the room's way of making fun of them. He only knew it was true.";
  PAGES[3].body += "They made a rule of their own: nobody could accuse another player without naming the observation and at least one alternative explanation. It lasted less than ten minutes. Brant accused Pell of hiding the chalk because Pell had mentioned it before the receipt was found. Pell replied that he had mentioned it because the sound matched the tool's description. Brant said that was exactly what a person who had bought it would say. Pell asked what an innocent person would say. Brant had no answer that did not sound suspicious.\n\nTamsin wrote the exchange down as a case study. She placed it beside Orla's note, then deliberately stepped away so nobody could claim she had hidden it. When she returned, both notes remained in place, but a third sheet lay between them. It read: **THE ALTERNATIVE EXPLANATION IS ALSO A STORY.**\n\nSilas read it and said, “That is true, but it doesn't mean all explanations are equally likely.”\n\n“Then show us the evidence that makes one more likely,” Tamsin replied.\n\nHe pointed at the receipt. The Echo Chalk had been purchased. The knocks had occurred. Orla had approached the door. The victim announcement followed. It was a sequence, he said, and sequences were how events became evidence.\n\nPell objected that the sequence did not prove cause. The chalk might have copied the sound after the knocks happened. The door might have appeared because Orla was nearby, not because someone had lured her. The attacker might not have known Orla would be there. Orla might have known the door would appear and approached it for her own reason.\n\nThe argument did not end. It became more precise, which made it more uncomfortable. They were no longer arguing about whether Silas was suspicious. They were arguing about how much suspicion a sequence deserved.\n\nAt the next dimming, the shop offered a blank card called the **Witness Ledger**. It cost twenty-five points. The description said it could record one observation, but the recorded line would be visible to everyone and the identity of the writer would be hidden. Tamsin wanted it. Brant said it would create another anonymous note that could not be trusted. Pell pointed out that the ledger might still help them compare observations without knowing who had written them.\n\nNo one bought it. The decision was not a refusal; it was a delay. They had learned that a tool could shape the group even when no one used it.\n\nThat night, Elian dreamed of the train he could not remember. He saw a folder on his lap, ten photographs inside, and one empty sleeve. A hand reached across the aisle and placed a thirteenth photograph on top. He woke before he could see the face.\n\nOn the floor beside his bed lay a blank receipt. There was no ink, no number, no shop mark. He held it under the lamp. A faint impression showed through from the paper beneath it: the shape of a face scratched out of a photograph.";
  PAGES[4].body += "Pell insisted they test whether the books changed when no one watched them. They chose Book 8, closed it, and placed it on a table in the middle of the library. Then they left the room together and stood in the corridor where they could see the doorway. No one entered. No one approached the book. They waited until the Torch dimmed.\n\nWhen they returned, the book was still closed. The page edges were undisturbed. But the title on the cover had changed from PLAYER 8 to THE PERSON WHO LEFT. The number had not been erased; it remained faintly visible beneath the new words.\n\n“Orla left the note,” Tamsin said. “Maybe that's what it means.”\n\n“Or someone wants us to think that,” Brant replied.\n\nElian opened the book. The first page was blank. The second contained a list of objects: a pencil, a receipt, a white thread, a brass counter, a cracked token, a door nail. Beside each object was a short description of where it had last been seen. The list was accurate until the final entry. It said the Door Nail had been left inside the thirteenth room.\n\nElian had carried it out. He still had it in his pocket.\n\nHe held the nail up. Everyone could see it. The book's record was wrong, unless the nail had somehow been duplicated or the room considered the nail to be in two places at once. The group searched the room. No second nail appeared. The page remained unchanged.\n\nDev asked whether the book recorded physical locations or intended locations. Nobody understood the difference, but the question stayed with them.\n\nThey returned to the archive. The photograph of thirteen people was still in its drawer. This time, Elian noticed that the scratched-out face was not the only damaged area. A shallow cut ran through the corner where Orla's hand rested on the unknown person's shoulder. The cut ended at her sleeve. Whoever had scratched the face had also tried to separate their hands.\n\nOrla might have been holding the person in place. She might have been trying to pull them away. She might have been pointing at them. The photograph could not tell them which.\n\nPell looked at the caption again. “The first group was never ten. That doesn't necessarily mean there were thirteen players. It might mean the count includes someone who wasn't a player.”\n\n“Like the person running the game?” asked Yara.\n\n“Or the person taking the photograph,” Dev said.\n\nElian added another line to the wall chart: **THE NUMBER THIRTEEN MAY COUNT A PERSON, A ROLE, A WITNESS, OR A MISTAKE.**\n\nThe sentence made the mystery larger instead of smaller. But it also prevented them from treating the scratched face as a simple answer. The unknown person might be the killer. They might be a victim. They might be the person who had created the game. Or the photograph might be a warning built to make them invent a person who never existed.\n\nThat evening, Book 8 opened on its own. A new sentence had appeared at the bottom of the page: **ORLA WAS NOT PLAYER EIGHT IN THE FIRST COUNT.**\n\nElian read it aloud during the next voting window. The voice did not confirm it. The group could not decide whether it explained her disappearance or merely changed the meaning of her number.";
  PAGES[5].body += "The group decided to use the Witness Glass as carefully as possible. They would not ask it who the killer was. Instead, they would ask it to show a single doorway, then record exactly what appeared without interpreting it. They chose the doorway that led to the thirteenth room and took turns standing outside it.\n\nWhen Yara stood there, the glass showed an empty corridor. When Brant stood there, it showed Yara walking away. When Tamsin stood there, it showed Brant holding a folded note. Brant denied having one. His hands were empty, but he checked his sleeves anyway. When Silas stood there, the glass showed no person at all—only a shadow stretching toward the door.\n\nThe test produced no shared image. It did produce a shared reaction: each person seemed most disturbed by the reflection that contradicted their own memory. Elian wrote that observation down. The glass might have been showing the last person to cross a doorway, as its label claimed. Or it might have been showing the last person each viewer expected to see. Or the delay might have been long enough to turn a past event into a present-looking one.\n\nThey considered buying a second Witness Glass. The shop had none. They considered using the Identity Lens on Silas. It would take ten seconds and might return a false result. They considered buying the Memory Token again, but the shelf was empty. No one knew whether the item had sold out or had never existed in this round.\n\nAt the next vote, Brant accused Silas of hiding a note. Silas replied that the mirror had shown him carrying nothing, which was not proof that he had carried nothing before or after. Brant said that was convenient. Silas said convenience was not guilt. The vote split evenly, then split again.\n\nAs the Torch dimmed, a second sound came from the mirror passage. It was not the familiar knock pattern. It was a soft dragging noise, followed by a breath and a whisper that sounded like Elian's own voice.\n\n“Not that door.”\n\nElian had not spoken. The others had heard the same words, though each described the voice differently. Tamsin said it sounded young. Brant said it sounded old. Pell said it sounded like someone speaking through a wall with their mouth pressed against the stone.\n\nThe room did not announce a kill. It did not announce a shield break. It only opened a narrow doorway behind the mirror marked AFTER. Beyond it was a room with a chair, a glass of water, and a mirror covered by a sheet.\n\nElian recognized it as the room from his first glimpse. He could not tell whether this was the same room or a replica built from his memory. He did not enter. He wrote a note and left it on the floor: **I HAVE SEEN THIS ROOM BEFORE.**\n\nWhen he returned, the note remained, but someone had written a reply on the reverse: **THEN WHY DID YOU LOOK SURPRISED?**\n\nElian folded the paper and put it away. He was beginning to understand why the game did not name the attacker. A name would make the mystery smaller. The room wanted every event to implicate more than one person.";
  PAGES[6].body += "The final hour did not feel like an ending. The players were exhausted, but the Torch showed no sign of going out. The shop had closed. The doors were still changing. The wall chart had become crowded with contradictions, arrows, and notes that no one could agree how to classify.\n\nElian asked everyone to make one final list: three things they believed, and one thing they were willing to change their mind about. Tamsin believed the room used physical clues deliberately, that Orla had known something important, and that the voice withheld names to force the players to interpret events. She was willing to reconsider whether the voice controlled the game. Brant believed Silas was hiding something, the shield belonged to someone among them, and the thirteenth person was real. He was willing to reconsider the shield. Pell believed the room could alter memories, the mirrors were not reliable witnesses, and the notes had never moved without a physical cause. He was willing to reconsider whether the person who placed a note had written it.\n\nSilas wrote only two statements. First: “The most suspicious explanation is not always the most likely.” Second: “Someone is counting on us to treat uncertainty as permission to accuse anyone.” He left the third line blank.\n\nElian did not ask him why.\n\nThey compared their lists. No two people had written the same three beliefs. No two people had chosen the same uncertainty to reconsider. The game had given them the same evidence, but the evidence had become different stories in their minds.\n\nA final receipt emerged from the closed shop. It slid across the floor and stopped at the foot of the empty thirteenth chair. The paper was not blank this time. It listed every tool in the shop: Reinforced Fold, Kill Shield, Identity Lens, Witness Glass, Thread Compass, Echo Chalk, Memory Token, Second Voice, Door Nail, Empty Receipt. Beside each item was a time of purchase. Some times belonged to rounds that had not happened yet.\n\nOne item had no time at all.\n\nMURDERER TOOL.\n\nUnder the list was a single line: **A TOOL CAN BE USED WITHOUT BEING BOUGHT. A TOOL CAN BE BOUGHT WITHOUT BEING USED.**\n\nTamsin read it, then looked at the group. “That means the shop receipts will never tell us who attacked.”\n\n“Not by themselves,” Elian said.\n\n“And the victim announcement will never tell us who chose the victim,” Pell added.\n\nSilas nodded. “Then our task isn't to find one clue that proves everything. It's to find the theory that requires the fewest impossible assumptions.”\n\n“Unless the room is designed to make the simplest theory wrong,” Brant said.\n\nNobody argued. Both statements could be true.\n\nThe voice called the final voting window. No victim was named. No attacker was named. No shield broke. The group could vote, but they could not agree on what the vote was meant to accomplish. They chose not to remove anyone. The voice recorded the result without praise or disappointment.\n\nWhen the Torch brightened, the thirteenth chair was gone. In its place lay a brass counter marked 13. The number was scratched into the metal so deeply that the edges were sharp.\n\nElian picked it up. It was cold. He did not put it in his pocket. He placed it beside the wall chart, where everyone could see it.\n\nFor the first time, the room offered no new note.\n\nThat absence frightened him more than any message.";

  // Final clue sequences for the ten chapters.
  PAGES[2].body += "The room's last trick that night was small. It changed the order of the chairs without moving them. The numbers stitched into the backs remained the same, but when the players sat down, each found a different number facing the table. Elian's chair said 4 from the front and 9 from the back. Tamsin's said 11 on both sides. Silas's showed no number at all. They stood up and inspected the chairs, but the numbers returned to their first positions when no one was looking directly at them.\n\nThey began to suspect that the room was not changing objects. It was changing which side of an object counted as its front. A door could be an entrance from one direction and a wall from another. A note could be a warning to the person who found it and a confession to the person who wrote it. A victim could be someone who had disappeared, or someone the group had failed to notice was missing.\n\nElian added this to his notebook, then crossed it out. He did not want the room to know which idea he was willing to keep. That was irrational, he knew. The notebook was visible. The room had already shown it could write into its pages. But he kept the crossed-out sentence anyway.\n\nWhen the lights dimmed again, a soft wind moved through the ceiling opening. It carried a smell of rain and train brakes. For a moment, Elian remembered the folder in his lap and the empty photograph sleeve. He tried to hold the memory still, but it broke into details: a yellow ticket, a hand on the seat opposite, a voice saying his name. He could not remember the face.\n\nHe wrote one final question on a fresh sheet: **WHO WAS SITTING OPPOSITE ME?** Then he folded the note before placing it. He did not leave it by the Torch. He placed it beside his bed, where nobody could reach it without stepping across the light.\n\nIn the morning—or what the room called morning—the note was still folded. A second piece of paper lay beside it. It had no writing, only the impression of a face pressed into the fibers from the other side.";
  PAGES[3].body += "At the start of the next round, they tried a different method. Each person would write a statement about the previous round that they believed was certainly true. They would not write theories or suspicions. They would write only what they had personally witnessed. The sheets were placed in a circle on the floor.\n\nTamsin wrote that Orla had stood beside the note when the victim announcement came. Brant wrote that the thread had been on the door handle. Pell wrote that he had heard the knocks before the voice named the victim. Dev wrote that no one had seen Orla cross the threshold. Yara wrote that Silas had been looking at Elian before the door appeared. Silas wrote that he had heard Orla say, “I didn't go through the door.” Elian wrote that the note had remained in the same physical place after Orla vanished.\n\nThey compared the statements. Some overlapped, but none described the whole event. The group had been in one room, watching one occurrence, and had still experienced different pieces of it. Nobody had to be lying for the record to fracture.\n\nThen they found a thirteenth sheet in the circle. It contained a sentence no one remembered writing: **I SAW THE PERSON WHO DID IT.**\n\nThe handwriting did not match any of the others. The sentence did not name a person, describe a face, or say what “it” referred to. It could be a claim about Orla's disappearance, the use of Echo Chalk, the broken shield, or the person in the photograph. The statement was impossible to test because the witness had provided no detail that could be checked.\n\nBrant wanted to vote for whoever had written it. Tamsin asked how they could vote for an unknown writer when the point of the exercise had been to record witnessed facts. Silas suggested that the sentence itself might be bait, intended to make them search for a hidden witness.\n\nElian stared at the paper. It was folded along two lines, as if it had been carried in a pocket. One corner was worn smooth. The page had existed before it entered their circle. That did not tell them who wrote it, but it told them something about its history.\n\nHe wrote a small mark on the back and placed it in the confirmed column: **THE SHEET WAS FOLDED BEFORE WE FOUND IT.** He did not write that the statement was true. He did not write that it was false.\n\nFor the first time, everyone let the note remain unexplained. The room did not punish them for it. It did not reward them either. It simply dimmed the Torch and began the next round.";
  PAGES[4].body += "The archive had one more drawer that Elian had not noticed. It was set low in the wall, beneath the row of future dates, and its label was not a date at all. It read **BEFORE THE COUNT**. The drawer was locked, but the brass counter marked 4 fit into the keyhole. Elian did not use it immediately. He asked Pell to watch the lock and Tamsin to watch his hands, so that at least two people could agree on what happened.\n\nWhen he inserted the counter, it turned without resistance. The drawer opened to reveal ten empty folders and a thirteenth folder with a photograph tucked inside. The picture showed the Torch from above, looking down through the hole in the ceiling. Around its base stood ten people, but their faces were blurred. At the edge of the image, a hand reached in from outside the frame, holding a small card marked 4.\n\nElian turned the photograph over. On the back were four words: **THE NUMBER WAS ASSIGNED LATER.**\n\nHis counter had not identified him when he woke. The number could have been given to him by the room, by the person who made the photograph, or by someone who had already known him. If the number was assigned later, then the note with his number might not have been about him when it was written.\n\nPell asked whether the photograph showed a previous game. Elian said it might. Tamsin pointed out that the Torch's shape matched the one above them, but the floor around it was different. There were no beds, no shop, no visible doors. The room might have been at an earlier stage—or the photograph might show a different place built to resemble it.\n\nThey returned the photograph to the folder, but the counter would not turn back. The drawer stayed open. A thin strip of paper emerged from the back panel, where there was no gap large enough to hold it. The paper said: **THE ARCHIVE DOES NOT STORE THE PAST. IT STORES WHAT THE ROOM HAS DECIDED TO CALL THE PAST.**\n\nElian felt the familiar copper taste return. He wondered whether the memory of the train had happened before the game, or whether the room had placed that memory in him because it needed him to believe he had come from somewhere else.\n\nHe did not tell the others. Not because he wanted to hide evidence, but because he could not separate the thought from the fear that had produced it. Instead, he wrote the sentence on the wall chart under POSSIBLE, where it could be questioned by anyone.\n\nThe drawer closed itself. The label changed to a date in the future.";
  PAGES[5].body += "The next time the voting window opened, Elian tried not to look at the suspects. He looked at the evidence instead. The receipts, the folded note, the photograph, the Thread Compass, the five mirrors, the empty shield announcement. He asked himself which facts would remain true if every person in the room were innocent, and which would remain true if two of them were hiding something.\n\nThe answer was uncomfortable: nearly all of them.\n\nThe clues established that the room had withheld information. They established that the tools could mislead. They established that someone had written notes whose origins could not be proven. But none of those facts named the attacker. The room had not simply hidden the killer's face. It had built a system where every action could be separated from its meaning.\n\nTamsin proposed that they choose a suspect only when two independent clues pointed toward the same person. Brant asked what counted as independent. If two clues came from the same tool, were they separate? If one clue came from a note and another from a mirror that might have been influenced by the note, were they independent? If two people remembered the same event, had they truly witnessed it separately, or had they influenced each other's memory?\n\nThe proposal collapsed under its own definitions. But the discussion revealed something useful: they could not simply count clues. They had to judge how each clue had been produced.\n\nPell suggested making a map of who had access to each item and location. They drew the shop, the library, the archive, the mirror passage, and the thirteenth room. Then they marked who had seen each place, who had entered it, and who merely claimed to have been there. The map was full of gaps. Some doors had appeared while no one watched. Some people had entered rooms alone. Some objects had moved without a witness.\n\nThe gaps were not proof of guilt. They were the places where a careful theory had to remain uncertain.\n\nThe voice seemed to listen. When they finished, it announced: “A complete map can still leave out the most important place.”\n\nA small doorway appeared in the middle of the wall chart, exactly where the map had no room. It was too small for a person to enter. Through it, they could see another wall chart, with the same names, the same rooms, and a different arrangement of notes.\n\nSomeone on the other side was making the same map.\n\nThe figure's hand entered the frame and pointed at the note in CONFIRMED. When the image ended, the note remained exactly where it had been placed, but a new line of ink appeared beneath it: POSSIBLE. Then the doorway shut.";
  PAGES[6].body += "When the Torch finally grew bright enough to cast normal shadows, the players stood around the wall chart and read the whole thing aloud. It took a long time. The list contained dozens of facts and theories, many crossed out, many revised. No one tried to make the chart neat. The mess was part of the record.\n\nElian noticed that the first line—THE ROOM COUNTS Ten—had been written in a different hand from the rest. Beneath it, in smaller letters, someone had added: **UNLESS IT COUNTS THE PERSON WHO IS READING.**\n\nHe did not say the thought aloud. He was tired of giving the room words it could reuse.\n\nA new doorway opened above the beds. Beyond it was a narrow staircase rising toward the square hole in the ceiling. The wind moved down the stairs, carrying the smell of rain. For the first time, the sky looked close enough to touch. Tamsin took one step toward it, then stopped at the invisible threshold.\n\nThe voice did not forbid her. It did not invite her. It remained silent.\n\nThat silence was different from the other silences. It did not seem to be waiting for a question. It seemed to be waiting for a decision.\n\nNo one went up the stairs.\n\nThey had learned that an open door was not necessarily an exit, a closed door was not necessarily a barrier, and a missing person was not necessarily the person the room had named. They had learned that the most suspicious action might have an innocent explanation, and that the most ordinary action might have been planned in advance. They had learned that the game could make a fact true and still make the truth impossible to use.\n\nElian kept his folded guess in his pocket. He had written two names, but he had also written a question mark beside each one. He could imagine explanations that implicated them and explanations that cleared them. He could not decide whether that made his theory careful or useless.\n\nThe Torch pulsed once. The stairs vanished, leaving only the square opening above.\n\nA last receipt slid from the shop and stopped at Elian's feet. It was blank on the front. On the back was a sentence:\n\n**THE STORY ENDS WHERE YOUR CERTAINTY BEGINS.**\n\nHe folded it beside his guess. He would keep both papers. He would not show them to the room or to the others. The choice was not proof of anything. It was only the one choice that still belonged to him.\n\nThe voice returned, quiet and almost kind.\n\n“Round complete.”\n\nNo one disappeared. No one was named. The count remained unfinished.";

  // Extra scenes for chapters six through ten; the culprit remains unresolved.
  PAGES[7].body += "At the threshold, Elian placed three scraps of paper: ROOM, OUTSIDE, and one left blank. The Boundary Pin glowed, then displayed three numbers in succession: 0, 12, 13. The blank paper lifted at one corner in the wind. When it settled, a faint indentation had appeared on its underside, as if someone had written on a sheet above it. The words could not be read from the front.\n\nTamsin photographed the scraps. The image showed only the floor. In the reflection of the phone screen, however, the blank scrap had a name on it. Yara leaned closer, then immediately looked away. She would not tell them what she had seen.\n\nThey tried again with the phone held by another person. This time the reflection showed a drawing of a door. On the third attempt, it showed a number that changed whenever someone blinked. The images were not stable enough to serve as evidence, but they were stable enough to make the players disagree about whether they had seen the same thing.\n\nPell proposed that the camera was recording the viewer's expectation, not the paper. Brant said that explanation could excuse anything. Tamsin replied that it was only a theory, not an excuse.\n\nThe OUTSIDE door closed. The chart behind the glass was gone. In its place stood a figure with its back to them. It did not turn when they called. Its shoulders looked like Orla's, but its height seemed wrong. Elian did not approach. The compass needle pointed at the space where the figure's shadow should have been.\n\nWhen the figure moved, it did not walk away. It became a dark mark on the glass, as if drawn there with charcoal. The mark resembled a person standing outside a door. Underneath it appeared a sentence: YOU HAVE ALREADY MET THE WITNESS.";
  PAGES[8].body += "The booth produced a second recording after nobody entered it. Several voices spoke through one mouth, each finishing the previous speaker's sentence. They described the same moment in different orders: the knock, the note, the door, the victim announcement. The sequence changed each time they listened.\n\nPell wrote down the order he heard first. Tamsin wrote the order she heard last. Brant refused to write anything until he could hear a version that stayed the same. Silas listened with his eyes closed and said he had heard a fifth event no one else mentioned: a chair being pulled back before the first knock.\n\nThe booth's glass cleared. The chair inside was turned away from the microphone. A strip of paper lay on its seat, folded twice and tucked beneath one leg, as if someone wanted the chair to sit unevenly.\n\nElian used the Door Nail to hold the door open. The nail bent but did not break. When he leaned inside, the microphone was gone. The desk remained, and beneath it he found a second strip of paper in his handwriting: I WAS NOT THE FIRST PERSON TO ANSWER.\n\nHe had no memory of writing it. It could have been copied from his notebook, written by someone imitating him, or recorded from an event he had forgotten. The booth had given them another object, but not a way to identify its author.\n\nYara finally explained what she meant by seeing a person who wasn't there. She had seen a figure in the glass, standing behind her own reflection. When she turned, the booth had been empty. She could not say whether the figure was a person, a shadow, or the memory of someone who had stood there earlier. She had kept quiet because the others would have asked for a name. She had none, and she was beginning to suspect that the room could use a name as a doorway.";
  PAGES[9].body += "The inventory changed at midnight—or at whatever moment the room considered midnight. The empty outline labeled ONE MINUTE now held a tiny brass clock. Its hands moved backward, but the ticking sounded forward. The outline labeled ONE NAME held a paper tag. It was blank until someone looked away, then showed a different name each time they looked back.\n\nThey recorded the names in order: Brant, Orla, Elian, Yara, Silas, then a string of letters none recognized. The unknown name appeared nowhere on the wall chart. Yet when Elian searched his memory of the archive photograph, he felt sure he had seen those letters beneath the scratched-out face. The memory was too vague to trust.\n\nA paper marked MISSING LABEL appeared beside the shop ledger. It was a clue, not a purchasable tool: it could attach a temporary label to an object that had no name. The label would remain until someone correctly described the object's history. They attached it to the brass counter marked 13. It read: THIS COUNTER HAS BEEN CARRIED.\n\nThey tried to describe its history. It had been on the chair, then taken by a hand from beyond the ceiling. It had appeared in the photograph, or something like it had. Elian had carried a different counter marked 4. The object might have belonged to the unknown person, to the room, or to the game itself.\n\nAt last, Tamsin wrote: WE DO NOT KNOW WHO CARRIED IT, ONLY THAT IT WAS CARRIED. The label peeled away and fell to the floor. The object had not been named, but the record had become more accurate.\n\nBrant stared at the blank shelf. “If we keep narrowing every statement, we will end with nothing.”\n\n“Maybe nothing is what the evidence supports,” Pell said.\n\n“Then how do we catch anyone?”\n\n“We keep looking,” Tamsin said. “We just stop pretending the looking is the same as knowing.”";
  PAGES[10].body += "The trial's desk appeared again, but this time it had thirteen cards instead of ten. One card was already filled: I BENEFITED FROM ORLA'S DISAPPEARANCE. The handwriting was plain and unremarkable. No name appeared at the bottom.\n\nBrant called it a confession. Tamsin pointed out that benefiting from an event did not prove causing it. Silas said someone might benefit accidentally. Pell added that the writer might be lying to draw suspicion. Yara asked whether the card had been written before or after the disappearance. The desk offered no answer.\n\nThey placed the card beside the photograph. The scratched-out figure's hand rested on Orla's shoulder. In the card's reflection, the hand appeared to be holding her wrist. In the real photograph, it was impossible to tell where the fingers ended. A tiny tear crossed the edge of the sleeve.\n\nElian noticed that the tear resembled the one in the first note, where the number 4 had been scratched out. The papers were different. The similarity might be accidental, or someone might have copied the damage deliberately. He wrote the observation without naming a suspect. The Torch did not pulse. The room gave no reward for carefulness.\n\nThe thirteenth card turned over by itself. On the back was a question: IF YOU COULD PREVENT THE DISAPPEARANCE, WOULD YOU STILL WANT TO KNOW WHO CAUSED IT?\n\nNobody answered. They could want both things: to stop future victims and understand what happened to Orla. The card tried to make curiosity look like cruelty, or perhaps it warned them that knowledge had a cost.\n\nThe voice announced the end of the trial. No verdict was recorded. The cards were collected and returned to the desk in a neat stack. The top card now read: A BENEFICIARY IS NOT ALWAYS AN AUTHOR.";
  PAGES[11].body += "After the final count, the players sat beneath the Torch and compared the private guesses they had chosen not to submit. Some had written one name. Some had written two. Elian had written a question mark on the official card and kept two names folded in his pocket. Nobody asked him to show them.\n\nThey agreed on a last rule for themselves: a theory had to explain not only the clues that supported it, but also the clues that seemed to contradict it. If a theory made every event fit by inventing a new exception each time, it was not strong. If it depended on one unreliable reflection, one unsigned note, or one memory no one else could confirm, it had to remain provisional.\n\nThe rule did not reveal the killer. It gave them a way to keep thinking without turning suspicion into certainty.\n\nThe Torch's light spread across the wall chart. The phrase about the person who knew the door would open was still visible, but a second line had appeared beneath it: KNOWING IS NOT THE SAME AS CAUSING. The room had added it, or someone had written it while they looked elsewhere. Either way, the distinction mattered.\n\nThe OUTSIDE door opened a fraction. Rain could be heard beyond it. None of them had heard rain since waking, and no one knew whether the sound came from outside or from a memory stored in the walls. The door did not open far enough to show a view.\n\nYara placed Orla's pencil beside the threshold. It rolled toward the room instead of toward the opening. Brant said the floor must be sloped. Tamsin measured the tiles and found no obvious incline. Elian wrote the movement under OBSERVED and left the explanation blank.\n\nThe voice spoke one final sentence: A COUNT CAN BE FINISHED WITHOUT BECOMING TRUE.\n\nThe sky opening brightened. The empty chair vanished. The brass counter was gone. No one was named, and no one received a message confirming their guess. They had ten chapters of evidence, ten ways to misunderstand it, and no answer key. That was not a failure to finish the story. It was the last condition of the game.";

  // The ten original sections are assembled above so their clues and added scenes stay intact.
  // The reader presents them as three longer chapters without revealing the Imposters.
  for (const p of PAGES) {
    if (typeof p.body === 'string') {
      p.body = p.body.replace(/ten chapters/gi, match => match[0] === 'T' ? 'Three chapters' : 'three chapters');
      p.body = p.body.replace('If one moves, someone moved it. If you did not see a note being placed, you do not know who wrote it.', 'Once a note is placed, it cannot be moved. It stays exactly where it was left. If you did not see it being placed, you do not know who wrote it.');
      p.body = p.body.replace('Attacking was permitted. Registered kills would be recorded, but the attacker would never be named. A victim would be announced. If a Kill Shield broke, the room would announce that too.', 'Attacking was permitted only within the conditions assigned to the hidden roles. A kill attempted outside the Imposters’ permitted conditions is a rule-breach kill: the target dies even if a Kill Shield is active. The shield cannot overrule this rule. The victim may be announced, but the attacker will never be named. If a shield breaks during an ordinary attack, the room announces that too.');
      p.body = p.body.replace('He wanted to see whether any would move.', 'He wanted to see whether their shadows would change.');
      p.body = p.body.replace('The second had been turned over, though it still lay in the same place.', 'The ink on the second looked different, though it remained face-up in the same place.');
      p.body = p.body.replace('They left a note: WE SAW THE REFLECTION MOVE FIRST. When they returned to the sleeping room, the note was already there, folded into a triangle. The writing was theirs.', 'They placed a note: WE SAW THE REFLECTION MOVE FIRST. When they returned to the sleeping room, it remained exactly where they had left it. The writing was theirs, though the sentence seemed to read differently under the lamp.');
      p.body = p.body.replace('The figure’s hand entered the frame and moved one note from CONFIRMED to POSSIBLE. Then the doorway shut.', 'The figure’s hand entered the frame and pointed at the note in CONFIRMED. When the image ended, the note remained exactly where it had been placed, but a new line of ink appeared beneath it: POSSIBLE. Then the doorway shut.');
      p.body = p.body.replace('Tamsin wrote it beside Orla’s note, then deliberately stepped away so nobody could claim she had hidden it. When she returned, both notes remained in place, but a third sheet lay between them.', 'Tamsin wrote it beside Orla’s note, then deliberately stepped away so nobody could claim she had hidden it. When she returned, both notes remained in place, and a third sheet was visible in the gap between them—a gap nobody remembered examining before.');
    }
  }
  PAGES[1].subtitle = 'THE HOLLOW COUNT · THREE CHAPTERS';
  PAGES[1].body = PAGES[1].body.replace(/Ten strangers/g, 'Ten strangers').replace(/Ten people entered/g, 'Ten people entered');
  const allStoryChapters = PAGES.filter(p => p.type === 'episode');
  if (allStoryChapters.length !== 10) throw new Error('Expected ten source sections before combining.');
  const combinedChapters = [
    { title: 'Chapter 1 — The Room That Counted Backwards', body: allStoryChapters.slice(0, 4).map(p => p.body).join('\n\n') },
    { title: 'Chapter 2 — The Thirteenth Place', body: allStoryChapters.slice(4, 7).map(p => p.body).join('\n\n') },
    { title: 'Chapter 3 — The Count That Remains', body: allStoryChapters.slice(7, 10).map(p => p.body).join('\n\n') }
  ];
  const readingPages = [];
  combinedChapters.forEach((chapter, chapterIndex) => {
    const paragraphs = chapter.body.split(/\n\n+/).map(part => part.trim()).filter(Boolean);
    const pagesForChapter = 5;
    for (let part = 0; part < pagesForChapter; part++) {
      const from = Math.floor(part * paragraphs.length / pagesForChapter);
      const to = Math.floor((part + 1) * paragraphs.length / pagesForChapter);
      readingPages.push({
        type: 'episode',
        title: chapter.title + ' · Part ' + (part + 1) + ' of ' + pagesForChapter,
        chapterTitle: chapter.title,
        chapterNumber: chapterIndex + 1,
        chapterPart: part + 1,
        chapterParts: pagesForChapter,
        body: paragraphs.slice(from, to).join('\n\n')
      });
    }
  });
  const otherPages = PAGES.filter(p => p.type !== 'episode');
  PAGES.splice(0, PAGES.length, ...otherPages.slice(0, 2), ...readingPages, ...otherPages.slice(2));

  // ============================================================
  //  STATE & PERSISTENCE
  // ============================================================

  const BOOK_ID = 'the-hollow-count-season-1';
  const STORAGE_KEY_PAGE = 'torches-wind-' + BOOK_ID + '-page-v5';
  const STORAGE_KEY_MARK = 'torches-wind-' + BOOK_ID + '-mark-v5';
  const STORAGE_KEY_SETTINGS = 'torches-wind-' + BOOK_ID + '-settings-v5';
  const STORAGE_KEY_STATE = 'torches-wind-' + BOOK_ID + '-full-state-v1';
  const STORAGE_KEY_READER = 'torches-wind-reader-id';
  const STORAGE_KEY_CLOUD_URL = 'torches-wind-google-sheets-url';

  let currentPage = 0;
  let markedWordData = null;

  function loadState() {
    try {
      const savedPage = localStorage.getItem(STORAGE_KEY_PAGE) || localStorage.getItem('torches-wind-hollow-count-page-v4');
      if (savedPage !== null) {
        const p = parseInt(savedPage, 10);
        if (!isNaN(p) && p >= 0 && p < PAGES.length) {
          currentPage = p;
        }
      }
      const savedMark = localStorage.getItem(STORAGE_KEY_MARK) || localStorage.getItem('torches-wind-hollow-count-mark-v4');
      if (savedMark) {
        const parsed = JSON.parse(savedMark);
        if (parsed && typeof parsed.page === 'number' && typeof parsed.wordIndex === 'number') {
          markedWordData = parsed;
        }
      }
    } catch (e) {}
  }

  function savePage() {
    try { localStorage.setItem(STORAGE_KEY_PAGE, String(currentPage)); } catch (e) {}
    saveAllState();
  }

  function saveMark() {
    try {
      if (markedWordData) {
        localStorage.setItem(STORAGE_KEY_MARK, JSON.stringify(markedWordData));
      } else {
        localStorage.removeItem(STORAGE_KEY_MARK);
      }
    } catch (e) {}
    saveAllState();
  }

  function loadSettings() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY_SETTINGS) || localStorage.getItem('torches-wind-settings');
      if (saved) {
        const s = JSON.parse(saved);
        if (s.textSize) {
          document.documentElement.style.setProperty('--text-size', s.textSize);
          document.getElementById('text-size-slider').value = parseFloat(s.textSize);
          document.getElementById('text-size-value').textContent = s.textSize;
        }
        if (s.lineHeight) {
          document.documentElement.style.setProperty('--line-height', s.lineHeight);
          document.getElementById('line-height-slider').value = parseFloat(s.lineHeight);
          document.getElementById('line-height-value').textContent = s.lineHeight;
        }
        if (s.wordSpacing) {
          document.documentElement.style.setProperty('--word-spacing', s.wordSpacing);
          document.getElementById('word-spacing-slider').value = parseFloat(s.wordSpacing);
          document.getElementById('word-spacing-value').textContent = s.wordSpacing;
        }
        if (s.letterSpacing) {
          document.documentElement.style.setProperty('--letter-spacing', s.letterSpacing);
          document.getElementById('letter-spacing-slider').value = parseFloat(s.letterSpacing);
          document.getElementById('letter-spacing-value').textContent = s.letterSpacing;

    } catch (e) {}
  }

  function saveSettings() {
    try {
      const s = {
        textSize: document.getElementById('text-size-value').textContent,
        lineHeight: document.getElementById('line-height-value').textContent,
        wordSpacing: document.getElementById('word-spacing-value').textContent,
        letterSpacing: document.getElementById('letter-spacing-value').textContent
      };
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(s));
    } catch (e) {}
    saveAllState();
  }

  function getReaderId() {
    let id = '';
    try { id = localStorage.getItem(STORAGE_KEY_READER) || ''; } catch (e) {}
    if (!id) {
      id = 'reader-' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
      try { localStorage.setItem(STORAGE_KEY_READER, id); } catch (e) {}
    }
    return id;
  }

  function getCurrentSettings() {
    return {
      textSize: document.getElementById('text-size-value').textContent,
      lineHeight: document.getElementById('line-height-value').textContent,
      wordSpacing: document.getElementById('word-spacing-value').textContent,
      letterSpacing: document.getElementById('letter-spacing-value').textContent
    };
  }

  function saveAllState() {
    const state = {
      bookId: BOOK_ID,
      page: currentPage,
      pageTitle: (PAGES[currentPage] && PAGES[currentPage].title) || '',
      markedWord: markedWordData,
      settings: getCurrentSettings(),
      updatedAt: new Date().toISOString()
    };
    try { localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(state)); } catch (e) {}
    syncStateToCloud(state);
  }

  function setCloudStatus(message) {
    const el = document.getElementById('cloud-status');
    if (el) el.textContent = message;
  }

  let cloudSyncBusy = false;
  let queuedCloudState = null;
  let cloudRetryTimer = null;
  let cloudLoadComplete = false;
  let lastCloudSyncAt = 0;

  function syncStateToCloud(state) {
    const url = (document.getElementById('cloud-url') && document.getElementById('cloud-url').value.trim()) || '';
    const readerId = (document.getElementById('reader-id') && document.getElementById('reader-id').value.trim()) || getReaderId();
    if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)) return;
    queuedCloudState = state;
    if (!navigator.onLine) {
      setCloudStatus('Saved on this device. Cloud sync is waiting for internet.');
      return;
    }
    if (cloudSyncBusy) return;
    cloudSyncBusy = true;
    const stateBeingSent = queuedCloudState;
    queuedCloudState = null;
    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ readerId, bookId: BOOK_ID, state: stateBeingSent })
    }).then(() => {
      lastCloudSyncAt = Date.now();
      setCloudStatus('Auto-sync sent. Device copy is saved.');
    }).catch(() => {
      queuedCloudState = queuedCloudState || stateBeingSent;
      setCloudStatus('Google Sheets is unreachable. Your save is safe on this device; sync will retry.');
    }).finally(() => {
      cloudSyncBusy = false;
      if (queuedCloudState && navigator.onLine) {
        const next = queuedCloudState;
        queuedCloudState = null;
        syncStateToCloud(next);
      }
    });
  }

  function scheduleCloudRetry() {
    if (cloudRetryTimer) clearTimeout(cloudRetryTimer);
    cloudRetryTimer = setTimeout(() => {
      cloudRetryTimer = null;
      if (!navigator.onLine) return;
      if (queuedCloudState) syncStateToCloud(queuedCloudState);
      else if (document.getElementById('cloud-url').value.trim() && !cloudLoadComplete) loadCloudState();
    }, 15000);
  }

  function autoSaveNow() {
    const state = {
      bookId: BOOK_ID,
      page: currentPage,
      pageTitle: (PAGES[currentPage] && PAGES[currentPage].title) || '',
      markedWord: markedWordData,
      settings: getCurrentSettings(),
      updatedAt: new Date().toISOString()
    };
    try {
      localStorage.setItem(STORAGE_KEY_PAGE, String(currentPage));
      if (markedWordData) localStorage.setItem(STORAGE_KEY_MARK, JSON.stringify(markedWordData));
      else localStorage.removeItem(STORAGE_KEY_MARK);
      localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(state));
    } catch (e) {}
    if (navigator.onLine) syncStateToCloud(state);
    else setCloudStatus('Auto-saved on this device. Cloud sync will resume when internet returns.');
  }

  setInterval(() => {
    autoSaveNow();
  }, 15000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') autoSaveNow();
  });
  window.addEventListener('pagehide', autoSaveNow);
  window.addEventListener('beforeunload', autoSaveNow);

  let missingSaveTimer = null;
  let missingSaveCheckPending = false;

  function scheduleMissingSaveCheck() {
    missingSaveCheckPending = true;
    if (missingSaveTimer) clearTimeout(missingSaveTimer);
    if (!navigator.onLine) {
      setCloudStatus('Offline. This book is saved on this device; cloud save check will wait until Wi-Fi returns.');
      return;
    }
    setCloudStatus('No cloud save found yet. Waiting 15 seconds, then checking again before creating one…');
    missingSaveTimer = setTimeout(() => {
      missingSaveTimer = null;
      if (!navigator.onLine) {
        setCloudStatus('Offline. Waiting for Wi-Fi before checking or creating a cloud save.');
        return;
      }
      loadCloudState(true);
    }, 15000);
  }

  window.addEventListener('online', () => {
    setCloudStatus('Internet returned. Resuming automatic save and sync…');
    if (missingSaveCheckPending) scheduleMissingSaveCheck();
    else if (document.getElementById('cloud-url').value.trim()) loadCloudState();
    if (queuedCloudState) syncStateToCloud(queuedCloudState);
  });
  window.addEventListener('offline', () => {
    setCloudStatus('Offline. Automatic saving continues on this device; cloud sync will resume online.');
  });

  function loadCloudState(createIfStillMissing = false) {
    const url = (document.getElementById('cloud-url') && document.getElementById('cloud-url').value.trim()) || '';
    const readerId = (document.getElementById('reader-id') && document.getElementById('reader-id').value.trim()) || getReaderId();
    if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)) {
      setCloudStatus('Device saving is active. Add your deployed Google Apps Script URL to enable cloud sync.');
      return;
    }
    if (!navigator.onLine) {
      missingSaveCheckPending = true;
      setCloudStatus('Offline. Using the last save on this device; cloud checks wait until Wi-Fi returns.');
      return;
    }
    setCloudStatus('Checking Google Sheets for this book…');
    const callback = 'twSheetCallback' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[callback];
      script.remove();
      setCloudStatus('Google Sheets is unreachable. Using the last save on this device; automatic retry scheduled.');
      scheduleCloudRetry();
    }, 9000);
    window[callback] = result => {
      clearTimeout(timeout);
      script.remove();
      delete window[callback];
      if (!result || !result.ok) {
        setCloudStatus('Google Sheets is unreachable. Using the last save on this device; automatic retry scheduled.');
        scheduleCloudRetry();
        return;
      }
      if (!result.state) {
        if (!createIfStillMissing) {
          scheduleMissingSaveCheck();
          return;
        }
        missingSaveCheckPending = false;
        if (missingSaveTimer) clearTimeout(missingSaveTimer);
        let local = null;
        try { local = JSON.parse(localStorage.getItem(STORAGE_KEY_STATE) || 'null'); } catch (e) {}
        if (local && local.bookId === BOOK_ID) {
          syncStateToCloud(local);
        } else {
          saveAllState();
        }
        setCloudStatus('Created the first save for this book. Device saving remains active.');
        return;
      }
      missingSaveCheckPending = false;
      cloudLoadComplete = true;
      if (cloudRetryTimer) clearTimeout(cloudRetryTimer);
      if (missingSaveTimer) clearTimeout(missingSaveTimer);
      let local = null;
      try { local = JSON.parse(localStorage.getItem(STORAGE_KEY_STATE) || 'null'); } catch (e) {}
      const remoteTime = Date.parse(result.state.updatedAt || 0) || 0;
      const localTime = Date.parse((local && local.updatedAt) || 0) || 0;
      if (remoteTime > localTime) {
        const s = result.state;
        if (Number.isInteger(s.page) && s.page >= 0 && s.page < PAGES.length) currentPage = s.page;
        markedWordData = s.markedWord && typeof s.markedWord.page === 'number' ? s.markedWord : null;
        if (s.settings) {
          try { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(s.settings)); } catch (e) {}
          applySettings(s.settings);
        }
        try {
          localStorage.setItem(STORAGE_KEY_PAGE, String(currentPage));
          if (markedWordData) localStorage.setItem(STORAGE_KEY_MARK, JSON.stringify(markedWordData));
          localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(s));
        } catch (e) {}
        renderPage();
        setCloudStatus('Loaded the newer save from Google Sheets. This book has its own separate save.');
      } else {
        if (local) syncStateToCloud(local);
        setCloudStatus('This device has the newest save, or the cloud save is up to date.');
      }
    };
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[callback];
      setCloudStatus('Google Sheets is unreachable. Using the last save on this device; automatic retry scheduled.');
      scheduleCloudRetry();
    };
    script.src = url + (url.includes('?') ? '&' : '?') + 'readerId=' + encodeURIComponent(readerId) + '&bookId=' + encodeURIComponent(BOOK_ID) + '&callback=' + callback;
    document.body.appendChild(script);
  }

  function applySettings(s) {
    if (s.textSize) { document.documentElement.style.setProperty('--text-size', s.textSize); document.getElementById('text-size-slider').value = parseFloat(s.textSize); document.getElementById('text-size-value').textContent = s.textSize; }
    if (s.lineHeight) { document.documentElement.style.setProperty('--line-height', s.lineHeight); document.getElementById('line-height-slider').value = parseFloat(s.lineHeight); document.getElementById('line-height-value').textContent = s.lineHeight; }
    if (s.wordSpacing) { document.documentElement.style.setProperty('--word-spacing', s.wordSpacing); document.getElementById('word-spacing-slider').value = parseFloat(s.wordSpacing); document.getElementById('word-spacing-value').textContent = s.wordSpacing; }
    if (s.letterSpacing) { document.documentElement.style.setProperty('--letter-spacing', s.letterSpacing); document.getElementById('letter-spacing-slider').value = parseFloat(s.letterSpacing); document.getElementById('letter-spacing-value').textContent = s.letterSpacing; }
  }

  function connectCloud() {
    const url = document.getElementById('cloud-url').value.trim();
    const readerId = document.getElementById('reader-id').value.trim() || getReaderId();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)) {
      setCloudStatus('Paste a valid Google Apps Script Web App URL ending in /exec.');
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY_CLOUD_URL, url);
      localStorage.setItem(STORAGE_KEY_READER, readerId);
    } catch (e) {}
    document.getElementById('reader-id').value = readerId;
    saveAllState();
    loadCloudState();
  }

  document.getElementById('cloud-url').value = localStorage.getItem(STORAGE_KEY_CLOUD_URL) || 'https://script.google.com/macros/s/AKfycbwXuPAXVrLcOODHijeAzQ4pAfMaLbT4lf84AnbUl53_rN8VIzZSGTMXKeATykapf7lx/exec';
  document.getElementById('reader-id').value = getReaderId();
  document.getElementById('connect-cloud').addEventListener('click', connectCloud);
  document.getElementById('sync-now').addEventListener('click', () => { saveAllState(); loadCloudState(); });
  document.getElementById('copy-reader-id').addEventListener('click', async () => {
    const id = document.getElementById('reader-id').value.trim() || getReaderId();
    try { await navigator.clipboard.writeText(id); setCloudStatus('Reader ID copied. Use the same ID and web app URL on your other devices.'); }

  // ============================================================

  const pageContentEl = document.getElementById('page-content');
  const pageIndicatorEl = document.getElementById('page-indicator');

  const nextBtn = document.getElementById('next-btn');

  const previousWrap = document.createElement('div');
  previousWrap.className = 'nav-buttons nav-buttons-top';
  previousWrap.appendChild(prevBtn);
  const nextWrap = document.createElement('div');
  nextWrap.className = 'nav-buttons nav-buttons-bottom';

  function renderPage() {
    const page = PAGES[currentPage];
    pageContentEl.innerHTML = '';
    pageContentEl.style.opacity = '0';

    // Reading controls are available only on the first page.
    const isFirstPage = currentPage === 0;
    settingsPanelEl.style.display = isFirstPage ? 'block' : 'none';
    markHintEl.style.display = isFirstPage ? 'none' : 'block';

    setTimeout(() => {
      if (page.type === 'settings') {
        renderSettingsPage(page);
      } else if (page.type === 'cover') {
        renderCoverPage(page);
      } else if (page.type === 'episode') {
        renderEpisodePage(page);
      } else if (page.type === 'trailer') {
        renderTrailerPage(page);
      } else if (page.type === 'guess') {
        renderGuessPage(page);
      } else if (page.type === 'reveal') {
        renderRevealPage(page);
      } else if (page.type === 'end') {
        renderEndPage(page);
      }
      pageContentEl.style.opacity = '1';
    }, 40);

    pageIndicatorEl.textContent = `Page ${currentPage + 1} / ${PAGES.length}`;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage === PAGES.length - 1;

    setTimeout(() => { restoreMark(); }, 60);
  }

  // ---- SETTINGS PAGE ----
  function renderSettingsPage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const bodyDiv = document.createElement('div');
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    pageContentEl.appendChild(wrapper);
  }

  // ---- GUESS PAGE ----
  function renderGuessPage(page) {
    const wrapper = document.createElement('div');
    wrapper.className = 'guess-section';
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const p = document.createElement('p');
    p.textContent = 'Select two suspects to compare clues. There is deliberately no correct-answer reveal.';
    wrapper.appendChild(p);
    const grid = document.createElement('div');
    grid.className = 'suspect-grid';
    const selected = new Set();
    page.suspects.forEach(suspect => {
      const btn = document.createElement('button');
      btn.className = 'suspect-btn';
      btn.dataset.num = suspect.num;
      btn.innerHTML = `<span class="num">${suspect.num}</span> ${escapeHTML(suspect.name)}`;
      btn.addEventListener('click', () => {
        if (selected.has(suspect.num)) {
          selected.delete(suspect.num);
          btn.classList.remove('selected');
        } else {
          if (selected.size >= 2) {
            const first = selected.values().next().value;
            selected.delete(first);
            const firstBtn = grid.querySelector(`[data-num="${first}"]`);
            if (firstBtn) firstBtn.classList.remove('selected');
          }
          selected.add(suspect.num);
          btn.classList.add('selected');
        }
        updateFeedback();
      });
      grid.appendChild(btn);
    });
    wrapper.appendChild(grid);
    const feedback = document.createElement('div');
    feedback.id = 'guess-feedback';
    feedback.textContent = 'Select two players to see the evidence.';
    wrapper.appendChild(feedback);
    const revealBtn = document.createElement('button');
    revealBtn.id = 'reveal-btn';
    revealBtn.textContent = 'KEEP MY THEORY — NO ANSWER KEY';
    revealBtn.style.display = 'none';
    revealBtn.addEventListener('click', () => {
      currentPage = PAGES.findIndex(p => p.type === 'reveal');
      savePage();
      renderPage();
    });
    wrapper.appendChild(revealBtn);
    pageContentEl.appendChild(wrapper);

    const evidenceData = {
      1: 'Elian receives a note marked with his own number before he understands the room. His compass points toward changing spaces, but once points toward Silas and once toward an empty place.',
      2: 'Silas asks careful questions and frames theories as facts. The Witness Glass shows a version of him crossing a doorway, but another mirror shows him never crossing it.',
      3: 'Tamsin distrusts the free Murderer Tool and spots how fear can be manufactured. She also writes the watch schedule, so she knows where everyone claims to be.',
      4: 'Pell notices the Echo Chalk possibility before anyone can prove who bought it. He separates facts from theories, but knows which details the room can exploit.',
      5: 'Brant trades a memory for an answer and keeps the cracked Memory Token. The kitchen resembles his own, although he insists he never described all its details.',
      6: 'Yara challenges the assumptions behind the votes. She notices that a shield announcement does not establish who was targeted or who knew about it.',
      7: 'Dev argues that a victim may have been removed from a different place than the group assumes. He remembers nothing before waking.',
      8: 'Orla is the first named victim, but her notes suggest she expected a disappearance. The archive claims she was part of an earlier count.',
      9: 'The thirteenth person appears in the photograph and archive, but no one can prove that this person is alive, dead, or even a player.',
      10: 'The reflection behaves independently and may be a tool, a recording, a room effect, or a person using the mirrors.',
      11: 'The voice knows about attempts, shields, and hidden roles, but withholds the attacker. It may control the game—or repeat information from another source.',
      12: 'The first note appears after the players wake, but its paper and handwriting suggest an earlier history. The person who placed it may not be the person who wrote it.'
    };

    function updateFeedback() {
      if (selected.size < 2) {
        feedback.textContent = 'Select two players to see the evidence.';
        revealBtn.style.display = 'none';
        return;
      }
      const nums = Array.from(selected);
      let html = '';
      nums.forEach(num => {
        const suspect = page.suspects.find(s => s.num === num);
        html += `<div class="evidence-block"><strong>Player ${num} — ${escapeHTML(suspect.name)}:</strong><br>${escapeHTML(evidenceData[num])}</div>`;
      });
      html += '<div style="margin-top:10px;font-size:0.85em;color:#9a8e78;">This is evidence, not proof. Not everyone is an Imposter. Only two of the ten are Imposters.</div>';
      feedback.innerHTML = html;
      revealBtn.style.display = 'inline-block';
    }
  }

  // ---- REVEAL PAGE ----
  function renderRevealPage(page) {
    const wrapper = document.createElement('div');
    wrapper.className = 'guess-section';
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const p = document.createElement('p');
    p.textContent = page.body;
    wrapper.appendChild(p);
    const reminder = document.createElement('p');
    reminder.textContent = 'No killer identity is stored in this reader. Your conclusion belongs to you.';
    wrapper.appendChild(reminder);
    const backBtn = document.createElement('button');
    backBtn.textContent = '← BACK TO CASE BOARD';
    backBtn.style.cssText = 'background:#2a2a3a;color:#f0e6d2;border:none;padding:10px 24px;border-radius:30px;font-family:"Courier New",monospace;font-weight:bold;font-size:0.85em;cursor:pointer;margin-top:16px;';
    backBtn.addEventListener('click', () => {
      currentPage = PAGES.findIndex(p => p.type === 'guess');
      savePage();
      renderPage();
    });
    wrapper.appendChild(backBtn);
    pageContentEl.appendChild(wrapper);
  }

  // ---- END PAGE ----
  function renderEndPage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'episode-body';
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    pageContentEl.appendChild(wrapper);
  }

  // ============================================================
  //  SENTENCE-BY-SENTENCE TEXT TO SPEECH
  // ============================================================
  // ============================================================
  //  WORD MARKING
  // ============================================================

  function getAllTextNodes() {
    const nodes = [];
    const walker = document.createTreeWalker(
      pageContentEl,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: (node) => {
          if (node.parentElement.closest('button, .suspect-btn, .marked-word')) {
            return NodeFilter.FILTER_REJECT;
          }
          if (node.textContent.trim().length === 0) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );
    let node;
    while (node = walker.nextNode()) {
      nodes.push(node);
    }
    return nodes;
  }

  pageContentEl.addEventListener('click', (e) => {
    const target = e.target;
    if (target.classList.contains('marked-word')) {
      unmarkWord();
      return;
    }
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    let range = selection.getRangeAt(0);
    if (!range || range.collapsed) {
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(e.clientX, e.clientY);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
        if (pos) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.setEnd(pos.offsetNode, pos.offset);
        }
      }
    }
    if (!range) return;
    const textNode = range.startContainer;
    if (textNode.nodeType !== Node.TEXT_NODE) return;
    if (textNode.parentElement.closest('button, .suspect-btn, .guess-section, .trailer-box, .reveal-text')) {
      return;
    }
    const text = textNode.textContent;
    const offset = range.startOffset;
    let start = offset;
    let end = offset;
    while (start > 0 && /\S/.test(text[start - 1])) start--;
    while (end < text.length && /\S/.test(text[end])) end++;
    if (start === end) return;
    const word = text.slice(start, end);
    if (!word.trim()) return;
    unmarkWord();
    const before = text.slice(0, start);
    const after = text.slice(end);
    const parent = textNode.parentNode;
    const span = document.createElement('span');
    span.className = 'marked-word';
    span.textContent = word;
    const wordIndex = getWordIndexInPage(word, textNode);
    markedWordData = { page: currentPage, wordIndex: wordIndex, word: word };
    const frag = document.createDocumentFragment();
    if (before) frag.appendChild(document.createTextNode(before));
    frag.appendChild(span);
    if (after) frag.appendChild(document.createTextNode(after));
    parent.replaceChild(frag, textNode);
    saveMark();
  });

  function getWordIndexInPage(word, textNode) {
    const allText = pageContentEl.textContent;
    const beforeText = allText.substring(0, allText.indexOf(word));
    return beforeText.split(/\s+/).length;
  }

  function unmarkWord() {
    const existing = pageContentEl.querySelector('.marked-word');
    if (existing) {
      const parent = existing.parentNode;
      const text = existing.textContent;
      const textNode = document.createTextNode(text);
      parent.replaceChild(textNode, existing);
      parent.normalize();
    }
    markedWordData = null;
    saveMark();
  }

  function restoreMark() {
    if (!markedWordData || markedWordData.page !== currentPage) return;
    const word = markedWordData.word;
    if (!word) return;
    const textNodes = getAllTextNodes();
    let found = false;
    for (const node of textNodes) {
      const text = node.textContent;
      const index = text.indexOf(word);
      if (index !== -1) {
        const before = text.slice(0, index);
        const after = text.slice(index + word.length);
        const span = document.createElement('span');
        span.className = 'marked-word';
        span.textContent = word;
        const parent = node.parentNode;
        const frag = document.createDocumentFragment();
        if (before) frag.appendChild(document.createTextNode(before));
        frag.appendChild(span);
        if (after) frag.appendChild(document.createTextNode(after));
        parent.replaceChild(frag, node);
        found = true;
        break;
      }
    }
    if (!found) {
      markedWordData = null;
      saveMark();
    }
  }

  // ============================================================
  //  UTILITIES
  // ============================================================

  function escapeHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ============================================================
  //  NAVIGATION
  // ============================================================

  function goToPage(index) {
    if (index < 0 || index >= PAGES.length) return;
    currentPage = index;
    savePage();
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    else if (e.key === 'ArrowRight') goToPage(currentPage + 1);
  });

  // ============================================================
  //  INIT
  // ============================================================

  loadSettings();
  loadState();
  try {
    const savedFull = JSON.parse(localStorage.getItem(STORAGE_KEY_STATE) || 'null');
    if (savedFull && Number.isInteger(savedFull.page) && savedFull.page >= 0 && savedFull.page < PAGES.length) currentPage = savedFull.page;
    if (savedFull && savedFull.markedWord) markedWordData = savedFull.markedWord;
  } catch (e) {}
  renderPage();
  if (document.getElementById('cloud-url').value.trim()) loadCloudState();

</script>
