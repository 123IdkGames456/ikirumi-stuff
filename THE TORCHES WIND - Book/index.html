<script>

    body: `Twelve strangers.

One Torch.

Two Imposters.

No one knows who.

---

The game is simple.

Talk. Move. Buy. Vote.

Everything is allowed.

Except damaging the Torch.

That makes you disappear.

From nothing.

Into nothing.

---

The Torch is warm.

The room is watching.

The game has begun.`

  // -------------------------------------------------------

  // --- EPISODE 1 ---
  PAGES.push({
    type: 'episode',
    title: 'Episode 1 — The Wake',
    body: `Mara Vale woke to the smell of stone and cold air.

She did not remember falling asleep. She remembered a train, the shudder of it, a folder on her lap with photographs she had not yet looked at. Then nothing. Now this.

She lay on her back on a smooth gray floor. Above her, far above, a hole opened in the ceiling, and through it she could see sky — pale, overcast, the color of dishwater. Light poured down from somewhere above the hole, or perhaps from the thing that stood beneath it.

The Torch.

It rose from the center of the room like a monument, taller than a house, its metal blackened and old. No flame she could name burned at its top. Instead the light gathered there, white and steady, and cast no flickering shadows. The room around it was vast and bare — gray walls, gray floor, a few benches, and nothing else.

Eleven other people were waking up.

Mara sat up slowly and counted them without meaning to. A man in an expensive suit, already on his feet, brushing dust from his sleeve. A thin man with a notebook clutched to his chest. A broad-shouldered man with a shaved head, breathing hard. A woman with gray at her temples who looked around the room the way an archivist looks at a shelf that has been rearranged. Others. Twelve of them, including her.

Nobody spoke. Not yet.

Then the voice began.

It came from everywhere and nowhere, and its pitch was wrong — high, thin, like a violin played slightly off-key. It did not hurry. It simply spoke, and the speaking was worse than shouting.

"Welcome. You have been selected. There are rules. Listen once."`
  });

  // --- EPISODE 2 ---
  PAGES.push({
    type: 'episode',
    title: 'Episode 2 — The Rules',
    body: `The voice was high and thin and very steady.

"Rule one. Talking is allowed. You may speak freely at all times. Rule two. Attacking is allowed. You may harm one another. Rule three. Do not damage the Torch. If you damage the Torch, you will disappear. Not die. Disappear. From nothing. Into nothing."

The players looked at each other. Nobody spoke. The voice continued.

"Rule four. Each of you begins with one hundred Q Points. The shop is open. You may purchase food, water, tools, defenses, weapons. Purchases are final. Rule five. There are two Imposters among you. They will act against you. You may act against each other. Registered kills will be announced at voting. Rule six. At the end of each round, you will vote. One player will be eliminated."

The voice paused. When it resumed, it was very slightly faster.

"Survive. Identify. Vote. The round begins now."

Silence.

Then the shaved-head man laughed. "Talking is allowed? So I can just say—"

He got no further. The floor beneath him simply opened — not a trapdoor, not a seam, just an absence where he had been standing — and he dropped through it without a sound, and the floor closed again, smooth and gray and unmarked.

Nobody screamed. Nobody moved.

The voice returned, calm and high and almost gentle.

"You did not damage the Torch. You were removed for another reason. But you have seen the consequence."

Then it was gone.`
  });

  // --- EPISODE 3 ---
  PAGES.push({
    type: 'episode',
    title: 'Episode 3 — The Shop',
    body: `The shop was a recess in the far wall.

It had not been there before. Mara was certain of that. She had walked the perimeter of the room twice while waiting for the voice to return, and there had been no recess, no shelves, no softly lit alcove full of equipment.

Now there was.

The shelves were labeled with small paper tags. She read them all.

Food and Water — 10 Q. Basic supplies. Non-negotiable.

Reinforced Wall — 60 Q. A wall upgrade intended to resist attacks.

Kill Shield — 100 Q. Protects against one registered kill.

Identity Device — 80 Q. One use. Ten seconds. Fifty-fifty chance of identifying a player's role.

Torch Scanner — 75 Q. A device intended to scan or investigate the Torch.

Deface Kit — 40 Q. Allows you to write on surfaces that cannot normally be written on.

Attack Tool — 50 Q. A weapon. Simple. Effective.

The Murderer Tool — 0 Q. Once per round. Free. No description.

Mara stared at that last one for a long time.

She was still standing there when Felix Arden appeared beside her. He did not speak — talking was allowed, but nobody had spoken yet — but he held up a scrap of paper on which he had written: THE TOOL IS FREE. THAT MEANS SOMEONE WILL USE IT.

Mara took out her own paper and wrote: WHAT DOES IT DO?

He shook his head. He had not bought it. He wrote: I DON'T KNOW. BUT FREE THINGS IN THIS PLACE ARE NOT GIFTS.

She bought the Identity Device. Eighty points. The device was small and cold and fit in her palm, and it had a single button and a small screen that showed nothing at all.

Ten seconds. A fifty-fifty chance.

She had no idea what she was going to do with it.

Victor Hale came to stand beside her. He did not look at her. He looked at the Murderer Tool.

He did not buy it.

He did not buy anything.

He simply stood there, very still, and then he walked away.`
  });

  // --- EPISODE 4 ---
  PAGES.push({
    type: 'episode',
    title: 'Episode 4 — The First Kill',
    body: `The round ended without warning.

There was no bell, no countdown. The Torch simply brightened — a pulse of white light that swept the room and left everyone blinking — and the voice returned, high and quick, as though it had been waiting just behind their ears.

"Voting has begun. The registered kill will now be announced."

Mara set her pencil down. Her fingers had gone numb from writing.

The voice climbed.

"Last round, a kill was registered. The victim: Player 7."

The mathematician. The wiry man with glasses. Owen Price. Mara turned, and he was still there, sitting on his bench, mouthing numbers — and then he was not. The floor opened beneath him the way it had opened beneath the shaved-head man, and he fell without a cry, and the floor closed, and it was as though he had never existed.

Except he had. She had watched him write. 12 players. 2 imposters. 10 others.

"The accused: Player 2."

Everyone looked at Victor Hale.

He did not flinch. He stood very still near the shop recess with his hands folded in front of him, and he looked back at them all with an expression that was almost courteous, as though he had been introduced at a dinner party and was waiting for someone to offer him a drink.

"Voting will proceed. You have until the Torch dims. One player will be eliminated."

The silence broke all at once.

"It was you," Dr. Adrian Cross said — Player 9, the psychiatrist. He had risen from his bench and his voice was tight. "You were the only one moving. You went straight to the shop. You knew—"

"I went to the shop because I needed to know what was for sale." Victor spoke calmly, evenly, without raising his voice. "As did several of you. Player 3 bought something. Player 10 bought something. I did not."

"That's not—" Adrian stopped himself. "You didn't buy anything?"

"The walls." Victor gestured vaguely toward the far side of the room. "Someone purchased a reinforced wall. It wasn't me. I have spent nothing."

Nina Sol — Player 4, the archivist — wrote quickly on a fresh sheet and held it up.

PLAYER 2, HOW DID YOU KNOW ABOUT THE WALL?

Victor read it, and for the first time something crossed his face. Not guilt. Something closer to annoyance at himself.

"I saw it appear," he said. "The wall changed while I was standing there. I assumed the purchaser was nearby. I don't know who it was."

    backBtn.textContent = '← BACK TO GUESS';
    backBtn.style.cssText = 'background:#2a2a3a;color:#f0e6d2;border:none;padding:10px 24px;border-radius:30px;font-family:"Courier New",monospace;font-weight:bold;font-size:0.85em;cursor:pointer;margin-top:16px;';
    backBtn.addEventListener('click', () => {
      currentPage = PAGES.findIndex(p => p.type === 'guess');
      savePage();
      renderPage();
    });
    wrapper.appendChild(backBtn);
    pageContentEl.appendChild(wrapper);
  }

  // ---- END PAGE ----
  function renderEndPage(page) {
    const wrapper = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.textContent = page.title;
    wrapper.appendChild(h2);
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'episode-body';
    const paragraphs = page.body.split(/\n\n+/);
    paragraphs.forEach((pText, idx) => {
      if (idx > 0) {
        const spacer = document.createElement('div');
        spacer.style.height = '0.4em';
        bodyDiv.appendChild(spacer);
      }
      const p = document.createElement('p');
      p.textContent = pText.trim();
      bodyDiv.appendChild(p);
    });
    wrapper.appendChild(bodyDiv);
    pageContentEl.appendChild(wrapper);
  }

  // ============================================================
  //  WORD MARKING
  // ============================================================

  function getAllTextNodes() {
    const nodes = [];
    const walker = document.createTreeWalker(
      pageContentEl,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: (node) => {
          if (node.parentElement.closest('button, .suspect-btn, .marked-word')) {
            return NodeFilter.FILTER_REJECT;
          }
          if (node.textContent.trim().length === 0) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );
    let node;
    while (node = walker.nextNode()) {
      nodes.push(node);
    }
    return nodes;
  }

  pageContentEl.addEventListener('click', (e) => {
    const target = e.target;
    if (target.classList.contains('marked-word')) {
      unmarkWord();
      return;
    }
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    let range = selection.getRangeAt(0);
    if (!range || range.collapsed) {
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(e.clientX, e.clientY);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
        if (pos) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.setEnd(pos.offsetNode, pos.offset);
        }
      }
    }
    if (!range) return;
    const textNode = range.startContainer;
    if (textNode.nodeType !== Node.TEXT_NODE) return;
    if (textNode.parentElement.closest('button, .suspect-btn, .guess-section, .trailer-box, .reveal-text')) {
      return;
    }
    const text = textNode.textContent;
    const offset = range.startOffset;
    let start = offset;
    let end = offset;
    while (start > 0 && /\S/.test(text[start - 1])) start--;
    while (end < text.length && /\S/.test(text[end])) end++;
    if (start === end) return;
    const word = text.slice(start, end);
    if (!word.trim()) return;
    unmarkWord();
    const before = text.slice(0, start);
    const after = text.slice(end);
    const parent = textNode.parentNode;
    const span = document.createElement('span');
    span.className = 'marked-word';
    span.textContent = word;
    const wordIndex = getWordIndexInPage(word, textNode);
    markedWordData = { page: currentPage, wordIndex: wordIndex, word: word };
    const frag = document.createDocumentFragment();
    if (before) frag.appendChild(document.createTextNode(before));
    frag.appendChild(span);
    if (after) frag.appendChild(document.createTextNode(after));
    parent.replaceChild(frag, textNode);
    saveMark();
  });

  function getWordIndexInPage(word, textNode) {
    const allText = pageContentEl.textContent;
    const beforeText = allText.substring(0, allText.indexOf(word));
    return beforeText.split(/\s+/).length;
  }

  function unmarkWord() {
    const existing = pageContentEl.querySelector('.marked-word');
    if (existing) {
      const parent = existing.parentNode;
      const text = existing.textContent;
      const textNode = document.createTextNode(text);
      parent.replaceChild(textNode, existing);
      parent.normalize();
    }
    markedWordData = null;
    saveMark();
  }

  function restoreMark() {
    if (!markedWordData || markedWordData.page !== currentPage) return;
    const word = markedWordData.word;
    if (!word) return;
    const textNodes = getAllTextNodes();
    let found = false;
    for (const node of textNodes) {
      const text = node.textContent;
      const index = text.indexOf(word);
      if (index !== -1) {
        const before = text.slice(0, index);
        const after = text.slice(index + word.length);
        const span = document.createElement('span');
        span.className = 'marked-word';
        span.textContent = word;
        const parent = node.parentNode;
        const frag = document.createDocumentFragment();
        if (before) frag.appendChild(document.createTextNode(before));
        frag.appendChild(span);
        if (after) frag.appendChild(document.createTextNode(after));
        parent.replaceChild(frag, node);
        found = true;
        break;
      }
    }
    if (!found) {
      markedWordData = null;
      saveMark();
    }
  }

  // ============================================================
  //  UTILITIES
  // ============================================================

  function escapeHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ============================================================
  //  NAVIGATION
  // ============================================================

  function goToPage(index) {
    if (index < 0 || index >= PAGES.length) return;
    currentPage = index;
    savePage();
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    else if (e.key === 'ArrowRight') goToPage(currentPage + 1);
  });

  // ============================================================
  //  INIT
  // ============================================================

  loadSettings();
  loadState();
  renderPage();

</script>

</body>
</html>
