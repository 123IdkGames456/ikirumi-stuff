<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Links · Ikirumi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050608;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:28px}
.wrap{width:min(900px,100%);margin:0 auto;padding:28px 0 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
h1{margin:0;font-size:clamp(32px,6vw,52px);letter-spacing:-2.5px}
.sub{margin-top:8px;color:#747c88;font-size:13px}
.back{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#fff;border-radius:11px;padding:10px 14px;text-decoration:none;white-space:nowrap}
.grid{display:grid;gap:12px}
.card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));text-decoration:none;color:#fff;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.17);background:rgba(255,255,255,.075)}
.name{font-size:16px;font-weight:800}
.url{margin-top:5px;color:#68717e;font-size:11px;word-break:break-all}
.arrow{font-size:20px;color:#69717e;transition:.2s}
.card:hover .arrow{color:#fff;transform:translateX(4px)}
@media(max-width:600px){body{padding:16px}.wrap{padding-top:10px}.top{align-items:flex-start}.back{padding:9px 11px}.card{padding:17px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top">
<div><h1>Links</h1><div class="sub">Useful Ikirumi links.</div></div>
<a class="back" href="../">← Back</a>
</div>
<div class="grid">
<a class="card" href="https://123idkgames456.github.io/FNAJ/" target="_blank" rel="noopener"><div><div class="name">FNAJ Website</div><div class="url">123idkgames456.github.io/FNAJ/</div></div><div class="arrow">›</div></a>
<a class="card" href="https://github.com/123IdkGames456/FNAJ" target="_blank" rel="noopener"><div><div class="name">FNAJ GitHub</div><div class="url">github.com/123IdkGames456/FNAJ</div></div><div class="arrow">›</div></a>
</div>
</main>
</body>
</html>
